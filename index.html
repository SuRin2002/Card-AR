<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Card Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080b12;
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* Khung quét & hiển thị video tỉ lệ 9:16 đứng yên */
    .scan-box {
      aspect-ratio: 9 / 16;
      height: min(68dvh, 520px);
      width: auto;
      max-width: 84vw;
      box-shadow: 0 0 0 9999px rgba(4, 8, 16, 0.28);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .scan-box.matched {
      border-color: #34d399;
      box-shadow: 0 0 0 9999px rgba(4, 8, 16, 0.2), 0 0 28px rgba(52, 211, 153, 0.4);
    }

    #cardVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body class="select-none">
  <div class="w-full h-screen h-[100dvh] flex flex-col bg-[#080b12] relative overflow-hidden">

    <!-- Thanh điều hướng trên cùng -->
    <header class="h-14 shrink-0 px-4 sm:px-6 flex items-center justify-between bg-[#101725] border-b border-slate-800/90 z-30">
      <div class="flex items-center gap-2">
        <span class="text-base sm:text-lg font-extrabold tracking-wider text-white">
          AR <span class="text-cyan-400">CARD</span>
        </span>
        <span id="sourceBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          Live
        </span>
      </div>

      <button
        id="soundButton"
        type="button"
        class="px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 transition cursor-pointer"
      >
        🔊 Đang bật tiếng
      </button>
    </header>

    <!-- Vùng Camera chính -->
    <main class="relative flex-1 min-h-0 bg-black overflow-hidden">
      <video id="cameraFeed" autoplay playsinline webkit-playsinline muted></video>

      <!-- Khung quét card tỉ lệ 9:16 đứng yên ở giữa màn hình -->
      <div
        id="scanFrame"
        class="scan-box absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-2xl border-2 border-cyan-400/85 z-10 overflow-hidden"
      >
        <!-- Bốn góc định vị -->
        <div class="absolute top-0 left-0 w-7 h-7 border-t-4 border-l-4 border-cyan-400 rounded-tl-xl z-20 pointer-events-none"></div>
        <div class="absolute top-0 right-0 w-7 h-7 border-t-4 border-r-4 border-cyan-400 rounded-tr-xl z-20 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-7 h-7 border-b-4 border-l-4 border-cyan-400 rounded-bl-xl z-20 pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-7 h-7 border-b-4 border-r-4 border-cyan-400 rounded-br-xl z-20 pointer-events-none"></div>

        <!-- Lớp video hiển thị khớp gọn 9:16 trong khung card -->
        <div id="cardOverlay" class="hidden absolute inset-0 bg-black z-10">
          <video id="cardVideo" playsinline webkit-playsinline loop></video>
        </div>
      </div>

      <!-- Hướng dẫn sát cạnh dưới -->
      <p
        id="scanHint"
        class="absolute bottom-3 left-4 right-4 text-center text-xs sm:text-sm text-slate-100 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)] pointer-events-none z-20"
      >
        Đưa card vào khung 9:16 để nhận diện
      </p>

      <!-- Chỉ hiện khi trình duyệt chặn tự động mở camera -->
      <div
        id="cameraFallback"
        class="hidden absolute inset-0 bg-[#080b12]/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center gap-4"
      >
        <p id="cameraFallbackMsg" class="max-w-md text-xs sm:text-sm text-slate-200 leading-relaxed">
          Trình duyệt cần cấp quyền hoặc chạm để bật camera.
        </p>
        <button
          id="retryCameraButton"
          type="button"
          class="px-6 py-3 rounded-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-sm shadow-lg transition cursor-pointer"
        >
          BẬT CAMERA
        </button>
      </div>
    </main>

    <!-- Thanh trạng thái phía dưới -->
    <footer class="min-h-[64px] shrink-0 px-4 sm:px-6 py-2.5 bg-[#101725] border-t border-slate-800/90 flex flex-col justify-center gap-0.5 z-30">
      <div id="mainStatus" class="text-sm font-bold text-cyan-400 truncate">
        Đang mở camera...
      </div>
      <div id="subStatus" class="text-xs text-slate-400 truncate">
        Đưa card vào khung ngắm
      </div>
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
      authDomain: "ar-card-video.firebaseapp.com",
      projectId: "ar-card-video",
      storageBucket: "ar-card-video.firebasestorage.app",
      messagingSenderId: "725938606795",
      appId: "1:725938606795:web:516149f4210f26344bc14e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const cameraFeed = $("cameraFeed");
    const cardOverlay = $("cardOverlay");
    const arVideo = $("cardVideo");
    const scanFrame = $("scanFrame");
    const scanHint = $("scanHint");
    const cameraFallback = $("cameraFallback");
    const cameraFallbackMsg = $("cameraFallbackMsg");
    const retryCameraButton = $("retryCameraButton");
    const mainStatus = $("mainStatus");
    const subStatus = $("subStatus");
    const sourceBadge = $("sourceBadge");
    const soundButton = $("soundButton");

    // Tăng độ phân giải mẫu để giữ nét mảnh của tranh lineart/manga
    const GRID_W = 36;
    const GRID_H = 64;
    const workCanvas = document.createElement("canvas");
    workCanvas.width = GRID_W;
    workCanvas.height = GRID_H;
    const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });

    let cards = [];
    let mediaStream = null;
    let scanIntervalId = null;
    let scannerActive = false;
    let soundMuted = false;
    let audioUnlocked = false;
    let activeCardId = null;
    let playRequestToken = 0;
    let missCount = 0;
    let candidateCardId = null;
    let candidateHits = 0;

    // Ngưỡng nhận diện tối ưu cho cả card màu lẫn card nét đen trắng nền trắng
    const MATCH_THRESHOLD = 0.64;
    const RELEASE_THRESHOLD = 0.50;
    const MIN_MARGIN = 0.035;
    const REQUIRED_HITS = 2;
    const MAX_MISS_FRAMES = 4;

    function updateStatus(primary, secondary = "") {
      mainStatus.textContent = primary;
      subStatus.textContent = secondary;
    }

    function updateSoundButtonUI() {
      soundButton.textContent = soundMuted ? "🔇 Đang tắt tiếng" : "🔊 Đang bật tiếng";
    }

    function unlockAudioOnGesture() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      soundMuted = false;
      arVideo.muted = false;
      arVideo.volume = 1.0;
      updateSoundButtonUI();
      if (!cardOverlay.classList.contains("hidden") && arVideo.paused) {
        arVideo.play().catch(() => {});
      }
    }

    ["pointerdown", "touchstart", "click"].forEach((evt) => {
      document.addEventListener(evt, unlockAudioOnGesture, { passive: true });
    });

    /**
     * Trích xuất vector đặc trưng cấu trúc cạnh + tương phản chuẩn hóa theo khung dọc 9:16.
     * Hoạt động tốt cho cả card ảnh màu lẫn card nét đen trắng (lineart nền trắng).
     */
    function buildDescriptorFromCanvas() {
      const { data } = workCtx.getImageData(0, 0, GRID_W, GRID_H);
      const totalPixels = GRID_W * GRID_H;
      const luma = new Float32Array(totalPixels);
      const chromaRG = new Float32Array(totalPixels);
      const chromaBY = new Float32Array(totalPixels);

      let sumLuma = 0;
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const y = 0.299 * r + 0.587 * g + 0.114 * b;
        luma[p] = y;
        chromaRG[p] = r - g;
        chromaBY[p] = 0.5 * (r + g) - b;
        sumLuma += y;
      }

      const meanLuma = sumLuma / totalPixels;
      if (meanLuma < 15) return null; // Quá tối hoặc bị che tay

      // Chuẩn hóa độ sáng/tương phản (Z-score) để chống chênh lệch ánh sáng đèn phòng
      let variance = 0;
      for (let p = 0; p < totalPixels; p++) {
        const d = luma[p] - meanLuma;
        variance += d * d;
      }
      const stdLuma = Math.sqrt(variance / totalPixels);
      if (stdLuma < 8) return null; // Vùng tường trắng/bàn trơn không có chi tiết

      for (let p = 0; p < totalPixels; p++) {
        luma[p] = (luma[p] - meanLuma) / stdLuma;
      }

      // Kết hợp gradient cạnh (Sobel-like) + bố cục sáng tối + màu sắc
      const features = [];
      for (let y = 1; y < GRID_H - 1; y++) {
        for (let x = 1; x < GRID_W - 1; x++) {
          const idx = y * GRID_W + x;
          const gx =
            (luma[idx - GRID_W + 1] + 2 * luma[idx + 1] + luma[idx + GRID_W + 1]) -
            (luma[idx - GRID_W - 1] + 2 * luma[idx - 1] + luma[idx + GRID_W - 1]);
          const gy =
            (luma[idx + GRID_W - 1] + 2 * luma[idx + GRID_W] + luma[idx + GRID_W + 1]) -
            (luma[idx - GRID_W - 1] + 2 * luma[idx - GRID_W] + luma[idx - GRID_W + 1]);

          features.push(
            gx * 0.55,
            gy * 0.55,
            luma[idx] * 0.45,
            (chromaRG[idx] / 255) * 0.35,
            (chromaBY[idx] / 255) * 0.35
          );
        }
      }

      const vec = new Float32Array(features.length);
      let norm = 0;
      for (let i = 0; i < features.length; i++) {
        vec[i] = features[i];
        norm += vec[i] * vec[i];
      }
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < vec.length; i++) {
        vec[i] /= norm;
      }
      return vec;
    }

    function buildSourceDescriptor(source, sx, sy, sw, sh, rotateDeg = 0) {
      workCtx.save();
      workCtx.clearRect(0, 0, GRID_W, GRID_H);
      workCtx.fillStyle = "#ffffff";
      workCtx.fillRect(0, 0, GRID_W, GRID_H);

      if (rotateDeg !== 0) {
        workCtx.translate(GRID_W / 2, GRID_H / 2);
        workCtx.rotate((rotateDeg * Math.PI) / 180);
        if (rotateDeg === 90 || rotateDeg === 270) {
          workCtx.drawImage(source, sx, sy, sw, sh, -GRID_H / 2, -GRID_W / 2, GRID_H, GRID_W);
        } else {
          workCtx.drawImage(source, sx, sy, sw, sh, -GRID_W / 2, -GRID_H / 2, GRID_W, GRID_H);
        }
      } else {
        workCtx.drawImage(source, sx, sy, sw, sh, 0, 0, GRID_W, GRID_H);
      }

      workCtx.restore();
      return buildDescriptorFromCanvas();
    }

    function computeSimilarity(vecA, vecB) {
      if (!vecA || !vecB || vecA.length !== vecB.length) return -1;
      let dot = 0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
      }
      return dot;
    }

    /**
     * Tạo bộ mẫu đa hướng (0°, 90°, 180°, 270°) để dù ảnh gốc bị xoay ngang như Mẫu 2
     * hay cầm ngược đầu card thì vẫn nhận diện chính xác.
     */
    function createCardDescriptorsFromUrl(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            const descriptors = [];
            for (const deg of [0, 90, 180, 270]) {
              const desc = buildSourceDescriptor(img, 0, 0, w, h, deg);
              if (desc) descriptors.push(desc);
            }
            resolve(descriptors);
          } catch (err) {
            console.warn("Không trích xuất được mẫu ảnh:", url, err);
            resolve([]);
          }
        };
        img.onerror = () => resolve([]);
        img.src = url;
      });
    }

    async function fetchCardMetadataOnly() {
      try {
        const snapshot = await getDocs(collection(db, "cards"));
        const list = [];

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const name = (data.name || "Card AR").trim();
          const imageUrl = typeof data.imageUrl === "string" ? data.imageUrl.trim() : "";
          const videoUrl = typeof data.videoUrl === "string" ? data.videoUrl.trim() : "";

          if (!videoUrl.startsWith("https://")) return;

          list.push({
            id: docSnap.id,
            name,
            imageUrl,
            videoUrl,
            descriptors: [],
            loadingDescriptor: false
          });
        });

        cards = list;
        sourceBadge.textContent = `${cards.length} card`;
      } catch (err) {
        console.warn("Lỗi tải danh sách Firestore:", err);
        cards = [];
        sourceBadge.textContent = "0 card";
      }
    }

    async function warmDescriptorsBatch(batchSize = 4) {
      const pending = cards.filter(
        (c) => c.descriptors.length === 0 && !c.loadingDescriptor && c.imageUrl.startsWith("https://")
      );
      if (!pending.length) return;

      const slice = pending.slice(0, batchSize);
      await Promise.all(
        slice.map(async (card) => {
          card.loadingDescriptor = true;
          card.descriptors = await createCardDescriptorsFromUrl(card.imageUrl);
          card.loadingDescriptor = false;
        })
      );
    }

    function stopAndHideCardVideo(statusMsg = "Đang tìm card...", detailMsg = "Đưa card vào khung 9:16 để nhận diện") {
      playRequestToken++;
      activeCardId = null;
      candidateCardId = null;
      candidateHits = 0;
      missCount = 0;

      arVideo.pause();
      arVideo.onerror = null;
      arVideo.removeAttribute("src");
      arVideo.load();

      cardOverlay.classList.add("hidden");
      scanFrame.classList.remove("matched");
      scanHint.textContent = "Đưa card vào khung 9:16 để nhận diện";
      updateStatus(statusMsg, detailMsg);
    }

    async function showVideoInsideCard(card) {
      const token = ++playRequestToken;
      activeCardId = card.id;
      missCount = 0;

      scanFrame.classList.add("matched");
      scanHint.textContent = "";

      arVideo.pause();
      arVideo.removeAttribute("src");
      arVideo.load();

      arVideo.src = card.videoUrl;
      arVideo.muted = soundMuted;
      arVideo.volume = 1.0;
      arVideo.loop = true;
      arVideo.playsInline = true;

      cardOverlay.classList.remove("hidden");

      arVideo.onerror = () => {
        if (token !== playRequestToken) return;
        updateStatus("Lỗi tải video của " + card.name, "Kiểm tra lại videoUrl");
      };

      try {
        await arVideo.play();
        if (token !== playRequestToken || activeCardId !== card.id) {
          arVideo.pause();
          return;
        }
        arVideo.muted = soundMuted;
        arVideo.volume = 1.0;
        updateSoundButtonUI();
        updateStatus(`Đang phát: ${card.name}`, "Lấy card ra khỏi khung để dừng");
      } catch (err) {
        if (token !== playRequestToken) return;
        console.warn("Trình duyệt chặn tự phát có tiếng:", err);
        arVideo.muted = true;
        soundMuted = true;
        updateSoundButtonUI();
        try {
          await arVideo.play();
          updateStatus(`Đang phát: ${card.name}`, "Chạm màn hình để mở tiếng");
        } catch {
          updateStatus(`Đang phát: ${card.name}`, "Chạm màn hình để phát video");
        }
      }
    }

    /**
     * Cắt đúng vùng khung chữ nhật dọc 9:16 ở tâm camera để khớp toàn bộ chiều cao tấm card.
     */
    function captureCenterCardDescriptor() {
      if (!scannerActive || cameraFeed.readyState < 2 || !cameraFeed.videoWidth || !cameraFeed.videoHeight) {
        return null;
      }

      const vw = cameraFeed.videoWidth;
      const vh = cameraFeed.videoHeight;
      const targetAspect = 9 / 16;

      let cropH = vh * 0.68;
      let cropW = cropH * targetAspect;
      if (cropW > vw * 0.84) {
        cropW = vw * 0.84;
        cropH = cropW / targetAspect;
      }

      const sx = (vw - cropW) / 2;
      const sy = (vh - cropH) / 2;

      return buildSourceDescriptor(cameraFeed, sx, sy, cropW, cropH, 0);
    }

    function getBestCardScore(frameDesc, card) {
      let best = -1;
      for (const desc of card.descriptors) {
        const s = computeSimilarity(frameDesc, desc);
        if (s > best) best = s;
      }
      return best;
    }

    function startScanLoop() {
      clearInterval(scanIntervalId);
      let tick = 0;

      scanIntervalId = setInterval(() => {
        if (!scannerActive) return;

        tick++;
        if (tick % 4 === 0) {
          warmDescriptorsBatch(4);
        }

        const frameDesc = captureCenterCardDescriptor();

        if (!frameDesc) {
          if (activeCardId) {
            missCount++;
            if (missCount >= MAX_MISS_FRAMES) {
              stopAndHideCardVideo();
            }
          }
          return;
        }

        let bestCard = null;
        let bestScore = -1;
        let secondBestScore = -1;
        let currentActiveScore = -1;

        for (const card of cards) {
          if (!card.descriptors.length) continue;
          const score = getBestCardScore(frameDesc, card);

          if (card.id === activeCardId) {
            currentActiveScore = score;
          }

          if (score > bestScore) {
            secondBestScore = bestScore;
            bestScore = score;
            bestCard = card;
          } else if (score > secondBestScore) {
            secondBestScore = score;
          }
        }

        const margin = secondBestScore > 0 ? bestScore - secondBestScore : 1;

        // 1. Đang phát video của 1 card
        if (activeCardId) {
          if (bestCard && bestCard.id !== activeCardId && bestScore >= MATCH_THRESHOLD && margin >= MIN_MARGIN) {
            if (candidateCardId === bestCard.id) {
              candidateHits++;
            } else {
              candidateCardId = bestCard.id;
              candidateHits = 1;
            }

            if (candidateHits >= REQUIRED_HITS) {
              candidateCardId = null;
              candidateHits = 0;
              showVideoInsideCard(bestCard);
            }
            return;
          }

          if (currentActiveScore < RELEASE_THRESHOLD) {
            missCount++;
            if (missCount >= MAX_MISS_FRAMES) {
              stopAndHideCardVideo("Đã ngưng phát", "Đưa card tiếp theo vào khung 9:16");
            }
          } else {
            missCount = 0;
          }
          return;
        }

        // 2. Chưa phát: xác nhận khớp liên tiếp để mở video
        if (bestCard && bestScore >= MATCH_THRESHOLD && margin >= MIN_MARGIN) {
          if (candidateCardId === bestCard.id) {
            candidateHits++;
          } else {
            candidateCardId = bestCard.id;
            candidateHits = 1;
          }

          if (candidateHits >= REQUIRED_HITS) {
            candidateCardId = null;
            candidateHits = 0;
            showVideoInsideCard(bestCard);
          }
        } else {
          candidateCardId = null;
          candidateHits = 0;
        }
      }, 220);
    }

    async function openCameraStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Trình duyệt không hỗ trợ truy cập camera.");
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
      } catch {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }

      cameraFeed.srcObject = mediaStream;
      await new Promise((resolve) => {
        if (cameraFeed.readyState >= 1) return resolve();
        cameraFeed.onloadedmetadata = () => resolve();
      });
      await cameraFeed.play();
    }

    async function startScanner() {
      if (scannerActive) return;
      retryCameraButton.disabled = true;

      try {
        cameraFallback.classList.add("hidden");
        updateStatus("Đang mở camera...", "Đưa card vào khung 9:16");
        await openCameraStream();

        scannerActive = true;
        updateSoundButtonUI();
        stopAndHideCardVideo("Đang quét card...", "Đưa card vào khung 9:16 để nhận diện");

        await fetchCardMetadataOnly();
        await warmDescriptorsBatch(6);
        startScanLoop();
      } catch (err) {
        console.error("Không mở được camera:", err);
        scannerActive = false;
        const msg = err?.message || "Vui lòng cấp quyền camera hoặc mở trang qua HTTPS";
        updateStatus("Không mở được camera", msg);
        cameraFallbackMsg.textContent = msg;
        cameraFallback.classList.remove("hidden");
      } finally {
        retryCameraButton.disabled = false;
      }
    }

    soundButton.addEventListener("click", async (e) => {
      e.stopPropagation();
      audioUnlocked = true;
      soundMuted = !soundMuted;
      arVideo.muted = soundMuted;
      arVideo.volume = 1.0;
      updateSoundButtonUI();

      if (!soundMuted && !cardOverlay.classList.contains("hidden") && arVideo.paused) {
        try {
          await arVideo.play();
        } catch (err) {
          console.warn(err);
        }
      }
    });

    cardOverlay.addEventListener("click", () => {
      unlockAudioOnGesture();
    });

    retryCameraButton.addEventListener("click", startScanner);

    window.addEventListener("beforeunload", () => {
      scannerActive = false;
      clearInterval(scanIntervalId);
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }
    });

    startScanner();
  </script>
</body>
</html>
