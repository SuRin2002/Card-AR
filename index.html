
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<!-- A-FRAME PHẢI NẠP TRƯỚC MINDAR -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  background:#0b1020;
  color:#f3f6ff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  padding:12px 12px 25px;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
}

.wrap{
  max-width:760px;
  margin:auto;
}

.header{
  text-align:center;
  margin:12px 0 16px;
}

.header h1{
  font-size:25px;
  letter-spacing:.5px;
}

.header p{
  color:#91a3bf;
  font-size:13px;
  margin-top:8px;
}

.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:12px;
  margin-bottom:15px;
}

/* CAMERA DỌC */
.camera{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  width:min(100%,420px);
  aspect-ratio:9/16;
  max-height:75svh;
  margin:auto;
  background:#050a13;
  border-radius:13px;
}

/*
  VIDEO CAMERA THẬT CỦA MINDAR
  Đặt phía dưới canvas AR.
  Loại trừ video nội dung AR #arVideo.
*/
.camera video:not(#arVideo){
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  z-index:0!important;
  display:block!important;
}

/* LỚP A-FRAME TRONG SUỐT */
#arScene{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}

#arScene canvas.a-canvas{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}

/* KHUNG HƯỚNG DẪN QUÉT */
.scan-frame{
  position:absolute;
  z-index:5;
  inset:12%;
  border:2px solid rgba(255,255,255,.65);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.10);
}

/* TRẠNG THÁI */
.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
}

.status.error{
  color:#ff8998;
}

.status.success{
  color:#6de3ac;
}

/* ÂM THANH */
.audio-control{
  margin-top:12px;
  text-align:center;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 24px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer;
}

/* KẾT QUẢ */
.result{
  display:none;
  margin-top:12px;
  padding:13px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b;
  text-align:center;
}

.result h2{
  font-size:16px;
  margin-bottom:6px;
}

.result p{
  font-size:12px;
  color:#a9bbd5;
}

.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:16px;
  line-height:1.6;
}

@media(max-height:650px){
  .camera{
    max-height:65svh;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <header class="header">
    <h1>AR CARD SCANNER</h1>
    <p>Đưa mặt trước lá bài vào camera để xem video</p>
  </header>

  <section class="panel">

    <div class="camera" id="cameraBox">

      <a-scene
        id="arScene"
        embedded
        mindar-image="
          imageTargetSrc: ./targets.mind;
          autoStart: false;
          maxTrack: 1;
          uiLoading: no;
          uiScanning: no;
          uiError: no;
        "
        color-space="sRGB"
        renderer="
          alpha: true;
          antialias: true;
          colorManagement: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        background="transparent: true">

        <a-assets id="arAssets" timeout="30000">

          <video
            id="arVideo"
            crossorigin="anonymous"
            playsinline
            webkit-playsinline
            loop
            muted>
          </video>

        </a-assets>

        <a-camera
          position="0 0 0"
          look-controls="enabled: false">
        </a-camera>

        <!-- THẺ ĐẦU TIÊN TRONG TARGETS.MIND -->
        <a-entity
          id="cardTarget"
          mindar-image-target="targetIndex: 0">

          <a-video
            id="cardVideoPlane"
            src="#arVideo"
            position="0 0 0.01"
            width="1"
            height="0.7"
            material="shader: flat; side: double">
          </a-video>

        </a-entity>

      </a-scene>

      <div class="scan-frame"></div>

    </div>

    <div id="status" class="status">
      Đang khởi động hệ thống AR...
    </div>

    <div class="audio-control">
      <button id="audioButton">Bật âm thanh</button>
    </div>

    <section id="result" class="result">
      <h2 id="resultName"></h2>
      <p>Đã nhận diện lá bài thành công!</p>
    </section>

  </section>

  <p class="footer">
    Đưa mặt trước lá bài vào khung hình.
    Giữ điện thoại ổn định, đủ ánh sáng và tránh bị lóa.
  </p>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG - GIỮ NGUYÊN */

const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

/* ELEMENTS */

const sceneEl = document.getElementById("arScene");
const assetsEl = document.getElementById("arAssets");
const targetEl = document.getElementById("cardTarget");
const planeEl = document.getElementById("cardVideoPlane");
const videoEl = document.getElementById("arVideo");

const statusBox = document.getElementById("status");
const audioButton = document.getElementById("audioButton");
const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");

let db;
let arSystem;
let card;

let audioEnabled = false;
let targetFound = false;
let initialized = false;
let starting = false;

/* STATUS */

function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* WAIT FOR A-FRAME */

function waitForScene(){
  return new Promise(resolve=>{

    if(sceneEl.hasLoaded){
      resolve();
    }else{
      sceneEl.addEventListener(
        "loaded",
        resolve,
        {once:true}
      );
    }

  });
}

/* MAKE A-FRAME CANVAS TRANSPARENT */

function makeCanvasTransparent(){

  if(!sceneEl.renderer) return;

  try{
    sceneEl.renderer.setClearColor(0x000000,0);
    sceneEl.renderer.setClearAlpha(0);

    const canvas = sceneEl.canvas;

    if(canvas){
      canvas.style.background = "transparent";
    }

  }catch(error){
    console.warn("Canvas transparency:",error);
  }

}

/* LOAD IMAGE RATIO */

function getImageRatio(url){

  return new Promise(resolve=>{

    const img = new Image();

    const timeout = setTimeout(()=>{
      resolve(0.7);
    },10000);

    img.onload = ()=>{

      clearTimeout(timeout);

      if(img.naturalWidth && img.naturalHeight){
        resolve(img.naturalHeight/img.naturalWidth);
      }else{
        resolve(0.7);
      }

    };

    img.onerror = ()=>{
      clearTimeout(timeout);
      resolve(0.7);
    };

    img.src = url;

  });

}

/* LOAD VIDEO METADATA */

function waitForVideo(){

  return new Promise((resolve,reject)=>{

    if(videoEl.readyState>=1){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{

      cleanup();

      reject(
        new Error("Video tải quá lâu.")
      );

    },25000);

    function cleanup(){

      clearTimeout(timeout);

      videoEl.removeEventListener(
        "loadedmetadata",
        success
      );

      videoEl.removeEventListener(
        "error",
        failed
      );

    }

    function success(){
      cleanup();
      resolve();
    }

    function failed(){
      cleanup();
      reject(
        new Error("Không tải được video Cloudinary.")
      );
    }

    videoEl.addEventListener(
      "loadedmetadata",
      success
    );

    videoEl.addEventListener(
      "error",
      failed
    );

    videoEl.load();

  });

}

/* LOAD CARD FROM FIREBASE */

async function loadCard(){

  setStatus("Đang kết nối Firebase...");

  const snapshot = await getDocs(
    collection(db,"cards")
  );

  const cards = [];

  snapshot.forEach(doc=>{

    const data = doc.data();

    const imageUrl =
      data.imageUrl ||
      (
        Array.isArray(data.imageUrls)
        ? data.imageUrls[0]
        : ""
      );

    if(imageUrl && data.videoUrl){

      cards.push({
        id:doc.id,
        ...data,
        imageUrl
      });

    }

  });

  if(cards.length===0){

    throw new Error(
      "Không tìm thấy thẻ có đủ ảnh và video trong Firebase."
    );

  }

  if(cards.length>1){

    throw new Error(
      "Bản thử nghiệm cần đúng 1 thẻ có ảnh và video. Hiện tìm thấy "+
      cards.length+" thẻ."
    );

  }

  card = cards[0];

  console.log("AR Card:",card);

  return card;

}

/* PREPARE VIDEO */

async function prepareCard(){

  setStatus("Đang tải video...");

  videoEl.crossOrigin = "anonymous";
  videoEl.muted = true;
  videoEl.loop = true;
  videoEl.playsInline = true;

  videoEl.src = card.videoUrl;

  await waitForVideo();

  const cardHeight = await getImageRatio(
    card.imageUrl
  );

  const videoWidth = videoEl.videoWidth || 16;
  const videoHeight = videoEl.videoHeight || 9;

  const videoRatio = videoWidth/videoHeight;
  const cardRatio = 1/cardHeight;

  let planeWidth = 1;
  let planeHeight = cardHeight;

  /* FIT VIDEO INSIDE CARD */

  if(videoRatio>cardRatio){

    planeWidth = 1;
    planeHeight = 1/videoRatio;

  }else{

    planeHeight = cardHeight;
    planeWidth = cardHeight*videoRatio;

  }

  planeEl.setAttribute("width",planeWidth);
  planeEl.setAttribute("height",planeHeight);

  console.log("Card ratio:",cardRatio);
  console.log("Video ratio:",videoRatio);

  setStatus(
    "Đã tải video. Đang chuẩn bị camera..."
  );

}

/* TARGET FOUND */

async function onTargetFound(){

  if(targetFound) return;

  targetFound = true;

  resultName.textContent =
    card.name || "Card AR";

  resultBox.style.display = "block";

  videoEl.muted = !audioEnabled;

  try{

    await videoEl.play();

    setStatus(
      "Đã nhận diện: "+(card.name || "Card AR"),
      "success"
    );

  }catch(error){

    console.error("Video play error:",error);

    setStatus(
      "Đã nhận diện thẻ nhưng video không phát được. Kiểm tra videoUrl.",
      "error"
    );

  }

}

/* TARGET LOST
   KHÔNG DỪNG CAMERA */

function onTargetLost(){

  targetFound = false;

  videoEl.pause();

  resultBox.style.display = "none";

  setStatus(
    "Đưa mặt trước lá bài vào khung hình để xem video."
  );

}

/* AUDIO */

audioButton.addEventListener("click",async()=>{

  audioEnabled = !audioEnabled;

  audioButton.textContent = audioEnabled
    ? "Tắt âm thanh"
    : "Bật âm thanh";

  videoEl.muted = !audioEnabled;

  if(audioEnabled && targetFound){

    try{

      await videoEl.play();

    }catch(error){

      console.warn(error);

      setStatus(
        "Không thể bật âm thanh video.",
        "error"
      );

    }

  }

});

/* AUTOMATIC INITIALIZATION */

async function initializeAR(){

  if(starting || initialized) return;

  starting = true;

  try{

    setStatus("Đang khởi tạo hệ thống...");

    /* WAIT FOR A-FRAME */

    await waitForScene();

    makeCanvasTransparent();

    /* FIREBASE */

    const app = initializeApp(firebaseConfig);

    db = getFirestore(app);

    /* LOAD CARD */

    await loadCard();

    /* PREPARE VIDEO */

    await prepareCard();

    /* TARGET EVENTS */

    targetEl.addEventListener(
      "targetFound",
      onTargetFound
    );

    targetEl.addEventListener(
      "targetLost",
      onTargetLost
    );

    /* MINDAR SYSTEM */

    arSystem =
      sceneEl.systems["mindar-image-system"];

    if(!arSystem){

      throw new Error(
        "Không tìm thấy MindAR Image System."
      );

    }

    /* WAIT FOR AR READY */

    const readyPromise = new Promise((resolve,reject)=>{

      const timeout = setTimeout(()=>{

        cleanup();

        reject(
          new Error("Camera khởi động quá lâu.")
        );

      },35000);

      function cleanup(){

        clearTimeout(timeout);

        sceneEl.removeEventListener(
          "arReady",
          ready
        );

        sceneEl.removeEventListener(
          "arError",
          failed
        );

      }

      function ready(){

        cleanup();
        resolve();

      }

      function failed(event){

        cleanup();

        reject(
          new Error("MindAR không thể khởi động camera.")
        );

      }

      sceneEl.addEventListener(
        "arReady",
        ready
      );

      sceneEl.addEventListener(
        "arError",
        failed
      );

    });

    setStatus(
      "Đang mở camera. Vui lòng chờ..."
    );

    await arSystem.start();

    await readyPromise;

    /* ENSURE TRANSPARENCY AFTER CAMERA START */

    makeCanvasTransparent();

    initialized = true;

    setStatus(
      "Camera đã sẵn sàng. Hãy đưa thẻ vào khung hình."
    );

  }catch(error){

    console.error(
      "AR initialization error:",
      error
    );

    setStatus(
      "Lỗi khởi động: "+error.message+
      ". Hãy kiểm tra quyền camera và tải lại trang.",
      "error"
    );

  }finally{

    starting = false;

  }

}

/* START WHEN PAGE LOADS */

initializeAR();

/* DO NOT CALL STOP WHEN TARGET IS LOST.
   BROWSER RELEASES CAMERA WHEN PAGE IS CLOSED. */

</script>

</body>
</html>
