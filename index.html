
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
  color:#f3f6ff;
  font-family:Arial,sans-serif;
  padding:16px 12px 30px;
}
.wrap{max-width:760px;margin:auto}
.header{text-align:center;margin:15px 0 20px}
.header h1{font-size:25px;letter-spacing:.5px}
.header p{color:#91a3bf;font-size:13px;margin-top:9px}
.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:14px;
  margin-bottom:15px;
}
.camera{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:4/3;
  min-height:300px;
  background:#050a13;
  border-radius:13px;
}
#arScene{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
}
#arScene canvas{
  width:100%!important;
  height:100%!important;
}
.scan-frame{
  position:absolute;
  z-index:5;
  inset:12%;
  border:2px solid rgba(255,255,255,.65);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.10);
}
.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
}
.status.error{color:#ff8998}
.status.success{color:#6de3ac}
.controls{display:flex;gap:9px;margin-top:12px}
button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px 9px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer;
}
button:disabled{opacity:.5}
.primary{background:linear-gradient(135deg,#438fe9,#396ce0)}
.result{
  display:none;
  margin-top:14px;
  padding:13px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b;
  text-align:center;
}
.result h2{font-size:16px;margin-bottom:6px}
.result p{font-size:12px;color:#a9bbd5}
.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:18px;
  line-height:1.6;
}
.hidden{display:none!important}
</style>

<!-- MindAR + A-Frame -->
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
<main class="wrap">

<header class="header">
  <h1>AR CARD SCANNER</h1>
  <p>Đưa mặt trước lá bài vào camera để xem video</p>
</header>

<section class="panel">
  <div class="camera">

    <a-scene
      id="arScene"
      embedded
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        maxTrack: 1;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
      "
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets id="arAssets" timeout="15000"></a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

    </a-scene>

    <div class="scan-frame"></div>
  </div>

  <div id="status" class="status">
    Đang kết nối hệ thống...
  </div>

  <div class="controls">
    <button id="startButton" class="primary">
      Bắt đầu quét
    </button>
    <button id="stopButton" disabled>
      Dừng camera
    </button>
  </div>

  <div class="controls">
    <button id="audioButton">
      Bật âm thanh
    </button>
  </div>

  <section id="result" class="result">
    <h2 id="resultName"></h2>
    <p>Đã nhận diện lá bài thành công!</p>
  </section>
</section>

<p class="footer">
  Đặt mặt trước lá bài trong khung hình, đủ ánh sáng và tránh bị lóa.
  Giữ camera cách thẻ khoảng 15–30 cm.
</p>

</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG - GIỮ NGUYÊN */
const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

/* ELEMENTS */
const statusBox = document.getElementById("status");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const audioButton = document.getElementById("audioButton");
const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");
const sceneEl = document.getElementById("arScene");
const assetsEl = document.getElementById("arAssets");

let db = null;
let arSystem = null;
let cards = [];
let videoElements = [];
let targetElements = [];
let activeIndex = -1;
let audioEnabled = false;
let arStarted = false;
let initialized = false;

/* STATUS */
function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* FIREBASE */
function initializeFirebase(){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
}

/* SORT CARDS: OLDEST FIRST */
function getCreatedTime(card){
  const value = card.createdAt;

  if(value && typeof value.toMillis==="function"){
    return value.toMillis();
  }

  if(value && typeof value.seconds==="number"){
    return value.seconds*1000;
  }

  return 0;
}

/* LOAD IMAGE DIMENSIONS */
function getImageRatio(url){
  return new Promise(resolve=>{
    const img = new Image();
    let finished = false;

    const done = value=>{
      if(finished) return;
      finished = true;
      resolve(value);
    };

    const timeout = setTimeout(()=>done(0.7),8000);

    img.onload = ()=>{
      clearTimeout(timeout);

      if(img.naturalWidth && img.naturalHeight){
        done(img.naturalHeight/img.naturalWidth);
      }else{
        done(0.7);
      }
    };

    img.onerror = ()=>{
      clearTimeout(timeout);
      done(0.7);
    };

    img.src = url;
  });
}

/* WAIT FOR A-FRAME */
function waitForScene(){
  return new Promise(resolve=>{
    if(sceneEl.hasLoaded){
      resolve();
    }else{
      sceneEl.addEventListener("loaded",resolve,{once:true});
    }
  });
}

/* LOAD CARDS */
async function loadCards(){
  setStatus("Đang kết nối Firebase...");

  const snapshot = await getDocs(collection(db,"cards"));
  const loaded = [];

  snapshot.forEach(doc=>{
    const data = doc.data();

    const imageUrl =
      data.imageUrl ||
      (Array.isArray(data.imageUrls) ? data.imageUrls[0] : "");

    if(!imageUrl || !data.videoUrl) return;

    loaded.push({
      id:doc.id,
      ...data,
      imageUrl
    });
  });

  /* Compiler order must match this order */
  loaded.sort((a,b)=>{
    const timeDifference =
      getCreatedTime(a)-getCreatedTime(b);

    if(timeDifference!==0) return timeDifference;

    return String(a.name || "").localeCompare(
      String(b.name || ""),
      "vi"
    );
  });

  if(loaded.length===0){
    throw new Error(
      "Firestore chưa có thẻ nào có đủ imageUrl và videoUrl."
    );
  }

  if(loaded.length>10){
    console.warn(
      "Có hơn 10 thẻ. Bản này vẫn có thể xử lý, nhưng nên kiểm tra hiệu năng."
    );
  }

  cards = loaded;

  console.log(
    "Thứ tự targetIndex của MindAR:",
    cards.map((card,index)=>({
      targetIndex:index,
      name:card.name,
      id:card.id
    }))
  );

  return cards;
}

/* FIT VIDEO INSIDE CARD */
function fitVideoPlane(video,plane,cardHeight){
  const videoWidth = video.videoWidth || 16;
  const videoHeight = video.videoHeight || 9;
  const videoRatio = videoWidth/videoHeight;
  const cardRatio = 1/cardHeight;

  let width;
  let height;

  if(videoRatio>cardRatio){
    width = 1;
    height = 1/videoRatio;
  }else{
    height = cardHeight;
    width = cardHeight*videoRatio;
  }

  plane.setAttribute("width",width);
  plane.setAttribute("height",height);
}

/* CREATE TARGETS AND VIDEO PLANES */
async function createTargets(){
  await waitForScene();

  assetsEl.innerHTML = "";
  videoElements = [];
  targetElements = [];

  for(let index=0;index<cards.length;index++){
    const card = cards[index];

    setStatus(
      "Đang chuẩn bị thẻ "+(index+1)+"/"+cards.length+
      ": "+(card.name || "Card")
    );

    const cardHeight = await getImageRatio(card.imageUrl);

    /* Create video asset */
    const video = document.createElement("video");

    video.id = "ar-video-"+index;
    video.src = card.videoUrl;
    video.crossOrigin = "anonymous";
    video.preload = "metadata";
    video.muted = !audioEnabled;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute("playsinline","");
    video.setAttribute("webkit-playsinline","");
    video.setAttribute("crossorigin","anonymous");
    video.style.display = "none";

    video.addEventListener("error",()=>{
      console.error(
        "Không tải được video:",
        card.name,
        video.error
      );
    });

    assetsEl.appendChild(video);
    videoElements.push(video);

    /* Create MindAR target */
    const target = document.createElement("a-entity");

    target.id = "ar-target-"+index;
    target.setAttribute(
      "mindar-image-target",
      "targetIndex: "+index
    );

    /* Video overlay */
    const plane = document.createElement("a-video");

    plane.setAttribute("src","#"+video.id);
    plane.setAttribute("position","0 0 0.01");
    plane.setAttribute("width","1");
    plane.setAttribute("height",String(cardHeight));
    plane.setAttribute(
      "material",
      "shader: flat; side: double"
    );

    target.appendChild(plane);
    sceneEl.appendChild(target);

    targetElements.push({
      target,
      plane,
      card,
      video,
      index,
      cardHeight
    });

    /* Adjust video size after metadata loads */
    video.addEventListener("loadedmetadata",()=>{
      fitVideoPlane(video,plane,cardHeight);
    },{once:true});

    if(video.readyState>=1){
      fitVideoPlane(video,plane,cardHeight);
    }

    /* TARGET FOUND */
    target.addEventListener("targetFound",()=>{
      onTargetFound(index);
    });

    /* TARGET LOST */
    target.addEventListener("targetLost",()=>{
      onTargetLost(index);
    });
  }

  setStatus(
    "Đã chuẩn bị "+cards.length+
    " thẻ. Nhấn Bắt đầu quét."
  );
}

/* TARGET FOUND */
async function onTargetFound(index){
  const item = targetElements[index];

  if(!item) return;

  if(activeIndex!==index){
    pauseAllVideos();
    activeIndex = index;
  }

  resultName.textContent = item.card.name || "Card AR";
  resultBox.style.display = "block";

  const video = item.video;
  video.muted = !audioEnabled;

  try{
    if(video.readyState===0){
      video.load();
    }

    await video.play();

    setStatus(
      "Đã nhận diện: "+(item.card.name || "Card AR"),
      "success"
    );

  }catch(error){
    console.error("Video playback error:",error);

    setStatus(
      "Đã nhận diện thẻ nhưng video chưa phát được. "+
      "Kiểm tra đường dẫn video Cloudinary.",
      "error"
    );
  }
}

/* TARGET LOST */
function onTargetLost(index){
  const item = targetElements[index];

  if(!item) return;

  item.video.pause();

  if(activeIndex===index){
    activeIndex = -1;
    resultBox.style.display = "none";

    setStatus(
      "Đã mất dấu thẻ. Đưa lá bài vào khung hình để quét tiếp."
    );
  }
}

/* PAUSE ALL VIDEOS */
function pauseAllVideos(){
  videoElements.forEach(video=>{
    try{
      video.pause();
    }catch(error){
      console.warn(error);
    }
  });
}

/* AUDIO BUTTON */
audioButton.addEventListener("click",async()=>{
  audioEnabled = !audioEnabled;

  videoElements.forEach(video=>{
    video.muted = !audioEnabled;
  });

  audioButton.textContent = audioEnabled
    ? "Tắt âm thanh"
    : "Bật âm thanh";

  if(audioEnabled && activeIndex>=0){
    try{
      await videoElements[activeIndex].play();
    }catch(error){
      console.warn("Không bật được âm thanh:",error);
    }
  }
});

/* START AR */
async function startAR(){
  try{
    if(!initialized){
      setStatus("Đang khởi tạo hệ thống...");

      initializeFirebase();

      await loadCards();
      await createTargets();

      initialized = true;
    }

    if(!arSystem){
      arSystem = sceneEl.systems["mindar-image-system"];
    }

    if(!arSystem){
      throw new Error("Không tìm thấy hệ thống MindAR.");
    }

    startButton.disabled = true;
    stopButton.disabled = false;

    setStatus(
      "Đang mở camera. Hãy cấp quyền truy cập nếu được hỏi..."
    );

    sceneEl.addEventListener("arReady",()=>{
      arStarted = true;

      setStatus(
        "Camera đã sẵn sàng. Đưa mặt trước lá bài vào khung hình."
      );
    },{once:true});

    sceneEl.addEventListener("arError",event=>{
      console.error("MindAR error:",event);

      setStatus(
        "Không thể khởi động camera. Hãy kiểm tra quyền camera và mở website bằng HTTPS.",
        "error"
      );

      startButton.disabled = false;
      stopButton.disabled = true;
      arStarted = false;
    },{once:true});

    await arSystem.start();

  }catch(error){
    console.error("Start AR error:",error);

    setStatus(
      "Không thể bắt đầu quét: "+error.message,
      "error"
    );

    startButton.disabled = false;
    stopButton.disabled = true;
  }
}

/* STOP AR */
function stopAR(){
  try{
    if(arSystem){
      arSystem.stop();
    }
  }catch(error){
    console.warn("Stop AR error:",error);
  }

  pauseAllVideos();

  activeIndex = -1;
  arStarted = false;

  resultBox.style.display = "none";

  startButton.disabled = false;
  stopButton.disabled = true;

  setStatus("Camera đã dừng.");
}

/* BUTTONS */
startButton.addEventListener("click",startAR);
stopButton.addEventListener("click",stopAR);

/* PAGE CLEANUP */
window.addEventListener("pagehide",()=>{
  pauseAllVideos();

  try{
    if(arSystem){
      arSystem.stop();
    }
  }catch(error){
    console.warn(error);
  }
});

/* INITIALIZE */
async function initialize(){
  try{
    setStatus("Đang kiểm tra MindAR...");

    await waitForScene();

    setStatus(
      "MindAR đã tải. Nhấn Bắt đầu quét để mở camera."
    );

  }catch(error){
    console.error(error);

    setStatus(
      "Không tải được hệ thống AR: "+error.message,
      "error"
    );
  }
}

initialize();
</script>

</body>
</html>
