
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Quét thẻ</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#243b61 0%,#0b1020 55%);color:#f5f7ff;font-family:Arial,sans-serif;padding:22px 15px 40px}
    .wrap{max-width:560px;margin:auto}
    header{text-align:center;padding:12px 0 23px}
    header h1{font-size:24px;letter-spacing:-.5px}
    header p{font-size:14px;color:#aab8d0;margin-top:9px}
    .scanner{position:relative;width:100%;aspect-ratio:1/1;background:#111c30;border:1px solid #354967;border-radius:25px;overflow:hidden;box-shadow:0 20px 60px #0006}
    #camera{width:100%;height:100%;display:block;object-fit:cover}
    .corners{position:absolute;inset:15px;z-index:2;pointer-events:none;background:linear-gradient(#6de3ff,#6de3ff) left top/30px 3px no-repeat,linear-gradient(#6de3ff,#6de3ff) left top/3px 30px no-repeat,linear-gradient(#6de3ff,#6de3ff) right top/30px 3px no-repeat,linear-gradient(#6de3ff,#6de3ff) right top/3px 30px no-repeat,linear-gradient(#6de3ff,#6de3ff) left bottom/30px 3px no-repeat,linear-gradient(#6de3ff,#6de3ff) left bottom/3px 30px no-repeat,linear-gradient(#6de3ff,#6de3ff) right bottom/30px 3px no-repeat,linear-gradient(#6de3ff,#6de3ff) right bottom/3px 30px no-repeat}
    .scanline{position:absolute;z-index:2;left:8%;right:8%;top:10%;height:2px;background:#65e3ff;box-shadow:0 0 15px #65e3ff;opacity:0}
    .scanner.active .scanline{opacity:1;animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes scan{to{top:90%}}
    .message{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:25px;background:#111c30;color:#cbd6e8}
    .message .symbol{font-size:38px}
    .message p{font-size:14px;line-height:1.6}
    .message.hide{display:none}
    .status{display:flex;align-items:center;gap:11px;margin:17px 1px;padding:14px 15px;border:1px solid #293c59;border-radius:14px;background:#111b2c;color:#c4d0e2;font-size:13px;line-height:1.5}
    .dot{width:9px;height:9px;flex:none;border-radius:50%;background:#e7b65d}
    .dot.ok{background:#4ee0a0;box-shadow:0 0 10px #4ee0a080}
    .dot.err{background:#ff687b}
    .buttons{display:flex;gap:10px}
    button{border:0;border-radius:12px;padding:13px 17px;font-size:14px;font-weight:700;color:#fff;background:#273954;cursor:pointer}
    button:active{transform:scale(.98)}
    #retry{display:none;flex:1;background:#367ee7}
    #stop{flex:1}
    .result{display:none;margin-top:20px;overflow:hidden;border:1px solid #354967;border-radius:20px;background:#111b2c}
    .result.show{display:block}
    .result-head{padding:17px 18px 13px}
    .result-head small{font-size:11px;color:#55dba2;text-transform:uppercase;letter-spacing:1px}
    .result-head h2{font-size:19px;margin-top:7px}
    #video{width:100%;display:block;background:#000;max-height:420px}
    .note{padding:13px 18px 16px;color:#9eacc4;font-size:12px;line-height:1.5}
    footer{text-align:center;color:#687993;font-size:11px;margin-top:24px}
    @media(max-width:420px){body{padding:13px 11px 30px}.scanner{border-radius:19px}header h1{font-size:21px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Quét thẻ để xem video</h1>
      <p>Đưa thẻ vào giữa khung hình để nhận diện</p>
    </header>

    <section class="scanner" id="scanner">
      <video id="camera" autoplay muted playsinline></video>
      <div class="corners"></div>
      <div class="scanline"></div>
      <div class="message" id="cameraMessage">
        <div class="symbol">📷</div>
        <p id="messageText">Đang kết nối camera...</p>
      </div>
    </section>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">Đang yêu cầu quyền camera...</span>
    </div>

    <div class="buttons">
      <button id="retry">Thử mở camera lại</button>
      <button id="stop">Tắt camera</button>
    </div>

    <section class="result" id="result">
      <div class="result-head">
        <small>Đã nhận diện thẻ</small>
        <h2 id="cardName">Tên thẻ</h2>
      </div>
      <video id="video" controls playsinline></video>
      <div class="note">Nếu video không tự phát, hãy nhấn nút phát trên video.</div>
    </section>

    <footer>Giữ thẻ trong khung hình, đủ sáng và tránh rung tay</footer>
  </main>

  <script>
    var Module = {
      onRuntimeInitialized: function() {
        window.__opencvReady = true;
      }
    };
    window.Module = Module;
  </script>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFTvux73x5oAl273PN_0_wwzA1OVvh34c",
      authDomain: "ar-card-video.firebaseapp.com",
      projectId: "ar-card-video",
      storageBucket: "ar-card-video.firebasestorage.app",
      messagingSenderId: "725938606795",
      appId: "1:725938606795:web:516149f4210f26344bc14e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    const camera = document.getElementById("camera");
    const scanner = document.getElementById("scanner");
    const message = document.getElementById("cameraMessage");
    const messageText = document.getElementById("messageText");
    const statusText = document.getElementById("status");
    const dot = document.getElementById("dot");
    const retry = document.getElementById("retry");
    const stop = document.getElementById("stop");
    const result = document.getElementById("result");
    const cardName = document.getElementById("cardName");
    const video = document.getElementById("video");

    let stream = null;
    let cv = null;
    let orb = null;
    let matcher = null;
    let cards = [];
    let ready = false;
    let busy = false;
    let loopId = null;
    let lastScan = 0;
    let lastCardId = "";
    let lastCardTime = 0;

    function status(text,type="normal"){
      statusText.textContent=text;
      dot.className="dot";
      if(type==="ok")dot.classList.add("ok");
      if(type==="err")dot.classList.add("err");
    }

    function cameraError(text){
      message.classList.remove("hide");
      messageText.textContent=text;
      retry.style.display="block";
      scanner.classList.remove("active");
      status(text,"err");
    }

    function stopCamera(showMessage=true){
      if(stream){
        stream.getTracks().forEach(t=>t.stop());
        stream=null;
      }
      camera.srcObject=null;
      if(loopId)cancelAnimationFrame(loopId);
      loopId=null;
      scanner.classList.remove("active");
      if(showMessage){
        message.classList.remove("hide");
        messageText.textContent="Camera đã tắt.";
        status("Camera đã tắt.");
      }
    }

    async function startCamera(){
      retry.style.display="none";
      message.classList.remove("hide");
      messageText.textContent="Đang xin quyền truy cập camera...";
      status("Đang yêu cầu quyền truy cập camera...");
      stopCamera(false);

      if(!navigator.mediaDevices?.getUserMedia){
        cameraError("Camera cần HTTPS và trình duyệt hỗ trợ. Hãy mở website bằng Chrome hoặc Safari.");
        return;
      }

      try{
        try{
          stream=await navigator.mediaDevices.getUserMedia({
            audio:false,
            video:{
              facingMode:{exact:"environment"},
              width:{ideal:1280},
              height:{ideal:1280}
            }
          });
        }catch(e){
          stream=await navigator.mediaDevices.getUserMedia({
            audio:false,
            video:{
              facingMode:{ideal:"environment"},
              width:{ideal:1280},
              height:{ideal:1280}
            }
          });
        }

        camera.srcObject=stream;
        await camera.play();
        message.classList.add("hide");
        scanner.classList.add("active");
        status(ready?"Camera đã bật. Hãy đưa thẻ vào khung hình.":"Camera đã bật. Đang tải nhận diện...", "ok");
        startLoop();
      }catch(e){
        console.error(e);
        let msg="Không mở được camera.";
        if(e.name==="NotAllowedError")msg="Bạn chưa cấp quyền camera. Hãy cho phép camera trong cài đặt trình duyệt.";
        if(e.name==="NotFoundError")msg="Không tìm thấy camera trên thiết bị.";
        if(e.name==="NotReadableError")msg="Camera đang được ứng dụng khác sử dụng.";
        cameraError(msg);
      }
    }

    retry.addEventListener("click",startCamera);
    stop.addEventListener("click",()=>stopCamera());

    async function waitForOpenCV(){
      const started=Date.now();
      while(Date.now()-started<60000){
        let candidate=window.cv;
        if(candidate && typeof candidate.then==="function"){
          candidate=await candidate;
        }
        if(candidate && candidate.Mat && candidate.ORB){
          cv=candidate;
          return;
        }
        await new Promise(r=>setTimeout(r,250));
      }
      throw new Error("OpenCV không tải được.");
    }

    function loadImage(url){
      return new Promise((resolve,reject)=>{
        const img=new Image();
        img.crossOrigin="anonymous";
        img.onload=()=>resolve(img);
        img.onerror=()=>reject(new Error("Không tải được ảnh mẫu: "+url));
        img.src=url;
      });
    }

    async function makeReference(card){
      const img=await loadImage(card.imageUrl);
      const source=cv.imread(img);
      const gray=new cv.Mat();
      const normalized=new cv.Mat();
      const keypoints=new cv.KeyPointVector();
      const descriptors=new cv.Mat();
      const mask=new cv.Mat();

      try{
        cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);
        cv.equalizeHist(gray,normalized);
        orb.detectAndCompute(normalized,mask,keypoints,descriptors);

        if(descriptors.empty())throw new Error("Ảnh mẫu không có đặc trưng nhận diện.");

        return {
          ...card,
          descriptors:descriptors,
          keypoints:keypoints,
          width:img.naturalWidth,
          height:img.naturalHeight
        };
      }catch(e){
        descriptors.delete();
        keypoints.delete();
        throw e;
      }finally{
        source.delete();
        gray.delete();
        normalized.delete();
        mask.delete();
      }
    }

    async function loadCardData(){
      const snapshot=await getDocs(collection(db,"cards"));
      const data=[];
      snapshot.forEach(d=>{
        const c=d.data();
        if(c.imageUrl && c.videoUrl){
          data.push({
            id:d.id,
            name:c.name || "Thẻ chưa đặt tên",
            imageUrl:c.imageUrl,
            videoUrl:c.videoUrl
          });
        }
      });
      return data;
    }

    async function initializeRecognition(){
      try{
        status("Đang tải thư viện nhận diện...");
        await waitForOpenCV();

        orb=new cv.ORB(
          1800,1.2,8,31,0,2,
          cv.ORB_HARRIS_SCORE,31,10
        );
        matcher=new cv.BFMatcher(cv.NORM_HAMMING,false);

        const sourceCards=await loadCardData();
        if(sourceCards.length===0){
          ready=true;
          status("Chưa có thẻ nào. Hãy thêm thẻ trong trang quản trị.",stream?"ok":"normal");
          return;
        }

        for(const card of sourceCards){
          try{
            cards.push(await makeReference(card));
          }catch(e){
            console.warn("Không nạp được ảnh mẫu:",card.name,e);
          }
        }

        ready=true;
        status(
          cards.length
            ? "Đã tải "+cards.length+" thẻ. Hãy đưa thẻ vào khung hình."
            : "Có dữ liệu thẻ nhưng không tải được ảnh mẫu.",
          cards.length?"ok":"err"
        );
      }catch(e){
        console.error("Lỗi khởi tạo nhận diện:",e);
        status("Không tải được bộ nhận diện. Kiểm tra kết nối hoặc tải lại trang.","err");
      }
    }

    function matchCard(frameDescriptors,frameKeypoints,card){
      const pairs=new cv.DMatchVectorVector();
      let sourcePoints=null;
      let targetPoints=null;
      let homography=null;
      let inlierMask=null;

      try{
        // So ảnh mẫu với khung camera
        matcher.knnMatch(card.descriptors,frameDescriptors,pairs,2);

        const src=[];
        const dst=[];

        for(let i=0;i<pairs.size();i++){
          const pair=pairs.get(i);
          if(pair.size()>=2){
            const a=pair.get(0);
            const b=pair.get(1);

            if(a.distance < 0.76*b.distance){
              const kpA=card.keypoints.get(a.queryIdx);
              const kpB=frameKeypoints.get(a.trainIdx);
              src.push(kpA.pt.x,kpA.pt.y);
              dst.push(kpB.pt.x,kpB.pt.y);
              kpA.delete();
              kpB.delete();
            }
          }
          pair.delete();
        }

        if(src.length/2<6)return 0;

        sourcePoints=cv.matFromArray(src.length/2,1,cv.CV_32FC2,src);
        targetPoints=cv.matFromArray(dst.length/2,1,cv.CV_32FC2,dst);
        inlierMask=new cv.Mat();

        homography=cv.findHomography(
          sourcePoints,targetPoints,cv.RANSAC,5,inlierMask
        );

        if(homography.empty())return 0;

        return cv.countNonZero(inlierMask);

      }catch(e){
        console.warn("So khớp ảnh gặp lỗi:",e);
        return 0;
      }finally{
        pairs.delete();
        if(sourcePoints)sourcePoints.delete();
        if(targetPoints)targetPoints.delete();
        if(homography)homography.delete();
        if(inlierMask)inlierMask.delete();
      }
    }

    function recognize(){
      if(!ready || !cv || !stream || camera.readyState<2 || busy || cards.length===0)return;
      busy=true;

      let source,gray,normalized,keypoints,descriptors,mask;

      try{
        const canvas=document.createElement("canvas");
        canvas.width=camera.videoWidth;
        canvas.height=camera.videoHeight;
        const ctx=canvas.getContext("2d",{willReadFrequently:true});
        ctx.drawImage(camera,0,0);

        source=cv.imread(canvas);
        gray=new cv.Mat();
        normalized=new cv.Mat();
        keypoints=new cv.KeyPointVector();
        descriptors=new cv.Mat();
        mask=new cv.Mat();

        cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);
        cv.equalizeHist(gray,normalized);
        orb.detectAndCompute(normalized,mask,keypoints,descriptors);

        if(descriptors.empty())return;

        let best=null;
        let bestScore=0;

        for(const card of cards){
          const score=matchCard(descriptors,keypoints,card);
          if(score>bestScore){
            bestScore=score;
            best=card;
          }
        }

        console.log("Điểm nhận diện:",best?.name,bestScore);

        // Kiểm tra hình học bằng RANSAC giúp giảm nhận nhầm.
        if(best && bestScore>=7){
          const now=Date.now();
          if(best.id!==lastCardId || now-lastCardTime>10000){
            lastCardId=best.id;
            lastCardTime=now;
            playCard(best);
          }
        }else{
          status("Đang quét thẻ...", "ok");
        }
      }catch(e){
        console.error("Lỗi khi quét:",e);
      }finally{
        if(source)source.delete();
        if(gray)gray.delete();
        if(normalized)normalized.delete();
        if(keypoints)keypoints.delete();
        if(descriptors)descriptors.delete();
        if(mask)mask.delete();
        busy=false;
      }
    }

    function startLoop(){
      if(loopId)return;
      const tick=(time)=>{
        if(!stream){
          loopId=null;
          return;
        }
        if(time-lastScan>800){
          lastScan=time;
          recognize();
        }
        loopId=requestAnimationFrame(tick);
      };
      loopId=requestAnimationFrame(tick);
    }

    function playCard(card){
      result.classList.add("show");
      cardName.textContent=card.name;
      if(video.src!==card.videoUrl)video.src=card.videoUrl;
      video.load();
      video.play().catch(()=>{});
      status("Đã nhận diện: "+card.name,"ok");
      result.scrollIntoView({behavior:"smooth",block:"nearest"});
    }

    // Camera và nhận diện được khởi động độc lập.
    startCamera();
    initializeRecognition();
  </script>
</body>
</html>
