<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Card Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080b12;
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .scan-box {
      width: min(70vw, 320px);
      height: min(70vw, 320px);
      max-height: 46%;
      box-shadow: 0 0 0 9999px rgba(4, 8, 16, 0.32);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .scan-box.matched {
      border-color: #34d399;
      box-shadow: 0 0 0 9999px rgba(4, 8, 16, 0.25), 0 0 28px rgba(52, 211, 153, 0.35);
    }

    #cardVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body class="select-none">
  <div class="w-full h-screen h-[100dvh] flex flex-col bg-[#080b12] relative overflow-hidden">

    <!-- Thanh điều hướng trên cùng -->
    <header class="h-16 shrink-0 px-4 sm:px-6 flex items-center justify-between bg-[#101725] border-b border-slate-800/90 z-30">
      <div class="flex items-center gap-2">
        <span class="text-lg font-extrabold tracking-wider text-white">
          AR <span class="text-cyan-400">CARD</span>
        </span>
        <span id="sourceBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          Live
        </span>
      </div>

      <button
        id="soundButton"
        type="button"
        class="px-3.5 py-2 rounded-full text-xs sm:text-sm font-medium bg-slate-800/90 hover:bg-slate-700 text-white border border-slate-700 transition cursor-pointer"
      >
        🔇 Tắt tiếng
      </button>
    </header>

    <!-- Vùng Camera chính -->
    <main class="relative flex-1 min-h-0 bg-black overflow-hidden">
      <!-- Luồng camera trực tiếp full vùng nhìn -->
      <video id="cameraFeed" autoplay playsinline webkit-playsinline muted></video>

      <!-- Thanh trạng thái nổi phía trên -->
      <div
        id="topStatusPill"
        class="absolute top-3.5 left-1/2 -translate-x-1/2 z-20 max-w-[92%] px-4 py-2 rounded-full bg-[#0a121e]/85 border border-slate-700/80 text-xs sm:text-sm text-slate-100 truncate backdrop-blur-sm"
      >
        Đang mở camera...
      </div>

      <!-- Khung quét card ở giữa màn hình + video khớp đúng kích thước card -->
      <div
        id="scanFrame"
        class="scan-box absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-3xl border-2 border-cyan-400/85 z-10 overflow-hidden pointer-events-none"
      >
        <!-- Bốn góc định vị -->
        <div class="absolute top-0 left-0 w-7 h-7 border-t-4 border-l-4 border-cyan-400 rounded-tl-2xl z-20 pointer-events-none"></div>
        <div class="absolute top-0 right-0 w-7 h-7 border-t-4 border-r-4 border-cyan-400 rounded-tr-2xl z-20 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-7 h-7 border-b-4 border-l-4 border-cyan-400 rounded-bl-2xl z-20 pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-7 h-7 border-b-4 border-r-4 border-cyan-400 rounded-br-2xl z-20 pointer-events-none"></div>

        <!-- Lớp video hiển thị khớp gọn trong khung card khi nhận diện thành công -->
        <div id="cardOverlay" class="hidden absolute inset-0 bg-black z-10">
          <video id="cardVideo" playsinline webkit-playsinline loop></video>
          <div
            id="cardTitleOverlay"
            class="absolute bottom-2.5 left-2.5 right-2.5 px-2.5 py-1 rounded-xl bg-black/65 text-center text-xs sm:text-sm font-semibold text-white truncate"
          ></div>
        </div>
      </div>

      <!-- Hướng dẫn ngay dưới khung ngắm -->
      <p
        id="scanHint"
        class="absolute top-[calc(50%+min(35vw,160px)+18px)] left-4 right-4 text-center text-xs sm:text-sm text-slate-100 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)] pointer-events-none z-20"
      >
        Đưa card vào giữa khung ngắm để nhận diện
      </p>

      <!-- Chỉ hiện khi trình duyệt chặn tự động mở camera hoặc lỗi quyền -->
      <div
        id="cameraFallback"
        class="hidden absolute inset-0 bg-[#080b12]/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center gap-4"
      >
        <p id="cameraFallbackMsg" class="max-w-md text-xs sm:text-sm text-slate-200 leading-relaxed">
          Trình duyệt cần cấp quyền hoặc chạm để bật camera.
        </p>
        <button
          id="retryCameraButton"
          type="button"
          class="px-6 py-3 rounded-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-sm shadow-lg transition cursor-pointer"
        >
          BẬT CAMERA
        </button>
      </div>
    </main>

    <!-- Thanh trạng thái phía dưới -->
    <footer class="min-h-[74px] shrink-0 px-4 sm:px-6 py-3 bg-[#101725] border-t border-slate-800/90 flex flex-col justify-center gap-1 z-30">
      <div id="mainStatus" class="text-sm font-bold text-cyan-400 truncate">
        Đang mở camera...
      </div>
      <div id="subStatus" class="text-xs text-slate-400 truncate">
        Đưa card vào giữa khung ngắm
      </div>
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
      authDomain: "ar-card-video.firebaseapp.com",
      projectId: "ar-card-video",
      storageBucket: "ar-card-video.firebasestorage.app",
      messagingSenderId: "725938606795",
      appId: "1:725938606795:web:516149f4210f26344bc14e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const cameraFeed = $("cameraFeed");
    const cardOverlay = $("cardOverlay");
    const arVideo = $("cardVideo");
    const cardTitleOverlay = $("cardTitleOverlay");
    const topStatusPill = $("topStatusPill");
    const scanFrame = $("scanFrame");
    const scanHint = $("scanHint");
    const cameraFallback = $("cameraFallback");
    const cameraFallbackMsg = $("cameraFallbackMsg");
    const retryCameraButton = $("retryCameraButton");
    const mainStatus = $("mainStatus");
    const subStatus = $("subStatus");
    const sourceBadge = $("sourceBadge");
    const soundButton = $("soundButton");

    // Canvas phân tích đặc trưng hình ảnh card
    const ANALYSIS_SIZE = 32;
    const workCanvas = document.createElement("canvas");
    workCanvas.width = ANALYSIS_SIZE;
    workCanvas.height = ANALYSIS_SIZE;
    const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });

    let cards = [];
    let mediaStream = null;
    let scanIntervalId = null;
    let scannerActive = false;
    let soundMuted = true;
    let activeCardId = null;
    let playRequestToken = 0;
    let missCount = 0;
    let candidateCardId = null;
    let candidateHits = 0;

    // Ngưỡng nhận diện và số khung hình liên tiếp để tránh nhảy sai
    const MATCH_THRESHOLD = 0.62;
    const RELEASE_THRESHOLD = 0.48;
    const REQUIRED_HITS = 2;
    const MAX_MISS_FRAMES = 3;

    function updateStatus(primary, secondary = "") {
      topStatusPill.textContent = primary;
      mainStatus.textContent = primary;
      subStatus.textContent = secondary;
    }

    /**
     * Trích xuất vector đặc trưng cấu trúc + màu chuẩn hóa từ vùng ảnh vuông.
     */
    function buildImageDescriptor(source, sx, sy, sw, sh) {
      workCtx.clearRect(0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);
      workCtx.drawImage(source, sx, sy, sw, sh, 0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);
      const { data } = workCtx.getImageData(0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);

      const pixelCount = ANALYSIS_SIZE * ANALYSIS_SIZE;
      const luma = new Float32Array(pixelCount);
      const chromaRG = new Float32Array(pixelCount);
      const chromaBY = new Float32Array(pixelCount);

      let meanLuma = 0;
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const y = 0.299 * r + 0.587 * g + 0.114 * b;
        luma[p] = y;
        chromaRG[p] = r - g;
        chromaBY[p] = 0.5 * (r + g) - b;
        meanLuma += y;
      }

      meanLuma /= pixelCount;
      if (meanLuma < 18) return null; // Quá tối hoặc bị che camera

      // Vector đặc trưng gradient cạnh (4 hướng) + phân bố màu chuẩn hóa
      const gradFeatures = [];
      for (let y = 1; y < ANALYSIS_SIZE - 1; y++) {
        for (let x = 1; x < ANALYSIS_SIZE - 1; x++) {
          const idx = y * ANALYSIS_SIZE + x;
          const gx = luma[idx + 1] - luma[idx - 1];
          const gy = luma[idx + ANALYSIS_SIZE] - luma[idx - ANALYSIS_SIZE];
          gradFeatures.push(gx, gy, chromaRG[idx] * 0.4, chromaBY[idx] * 0.4);
        }
      }

      const vec = new Float32Array(gradFeatures.length);
      let norm = 0;
      for (let i = 0; i < gradFeatures.length; i++) {
        vec[i] = gradFeatures[i];
        norm += vec[i] * vec[i];
      }
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < vec.length; i++) {
        vec[i] /= norm;
      }
      return vec;
    }

    function computeSimilarity(vecA, vecB) {
      if (!vecA || !vecB || vecA.length !== vecB.length) return -1;
      let dot = 0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
      }
      return dot;
    }

    function createCardDescriptorFromUrl(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const side = Math.min(img.naturalWidth, img.naturalHeight);
            const sx = (img.naturalWidth - side) / 2;
            const sy = (img.naturalHeight - side) / 2;
            resolve(buildImageDescriptor(img, sx, sy, side, side));
          } catch (err) {
            console.warn("Không trích xuất được mẫu ảnh:", url, err);
            resolve(null);
          }
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    /**
     * Chỉ tải metadata nhẹ (text) từ Firestore, KHÔNG tải toàn bộ ảnh lúc khởi động.
     */
    async function fetchCardMetadataOnly() {
      try {
        const snapshot = await getDocs(collection(db, "cards"));
        const list = [];

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const name = (data.name || "Card AR").trim();
          const imageUrl = typeof data.imageUrl === "string" ? data.imageUrl.trim() : "";
          const videoUrl = typeof data.videoUrl === "string" ? data.videoUrl.trim() : "";

          if (!videoUrl.startsWith("https://")) return;

          list.push({
            id: docSnap.id,
            name,
            imageUrl,
            videoUrl,
            descriptor: null,
            loadingDescriptor: false
          });
        });

        cards = list;
        sourceBadge.textContent = `${cards.length} card`;
      } catch (err) {
        console.warn("Lỗi tải danh sách Firestore:", err);
        cards = [];
        sourceBadge.textContent = "0 card";
      }
    }

    /**
     * Nạp mẫu ảnh theo từng lô nhỏ ở chế độ nền để không làm lag máy kể cả khi có hàng trăm card.
     */
    async function warmDescriptorsBatch(batchSize = 4) {
      const pending = cards.filter(
        (c) => !c.descriptor && !c.loadingDescriptor && c.imageUrl.startsWith("https://")
      );
      if (!pending.length) return;

      const slice = pending.slice(0, batchSize);
      await Promise.all(
        slice.map(async (card) => {
          card.loadingDescriptor = true;
          card.descriptor = await createCardDescriptorFromUrl(card.imageUrl);
          card.loadingDescriptor = false;
        })
      );
    }

    function stopAndHideCardVideo(statusMsg = "Đang tìm card...", detailMsg = "Đưa card vào giữa khung ngắm để nhận diện") {
      playRequestToken++;
      activeCardId = null;
      candidateCardId = null;
      candidateHits = 0;
      missCount = 0;

      arVideo.pause();
      arVideo.onerror = null;
      arVideo.removeAttribute("src");
      arVideo.load();

      cardOverlay.classList.add("hidden");
      cardTitleOverlay.textContent = "";
      scanFrame.classList.remove("matched");
      scanHint.textContent = "Đưa card vào giữa khung ngắm để nhận diện";
      updateStatus(statusMsg, detailMsg);
    }

    async function showVideoInsideCard(card) {
      const token = ++playRequestToken;
      activeCardId = card.id;
      missCount = 0;

      scanFrame.classList.add("matched");
      cardTitleOverlay.textContent = card.name;
      scanHint.textContent = `Đang giữ card: ${card.name} (lấy card ra để ngưng)`;

      arVideo.pause();
      arVideo.removeAttribute("src");
      arVideo.load();

      arVideo.src = card.videoUrl;
      arVideo.muted = soundMuted;
      arVideo.loop = true;
      arVideo.playsInline = true;

      cardOverlay.classList.remove("hidden");

      arVideo.onerror = () => {
        if (token !== playRequestToken) return;
        updateStatus("Lỗi tải video của " + card.name, "Kiểm tra lại videoUrl");
      };

      try {
        await arVideo.play();
        if (token !== playRequestToken || activeCardId !== card.id) {
          arVideo.pause();
          return;
        }
        updateStatus(`Đã khớp: ${card.name}`, "Lấy card ra khỏi khung để dừng");
      } catch (err) {
        if (token !== playRequestToken) return;
        console.warn("Trình duyệt chặn tự phát có tiếng:", err);
        arVideo.muted = true;
        soundMuted = true;
        soundButton.textContent = "🔇 Tắt tiếng";
        try {
          await arVideo.play();
          updateStatus(`Đã khớp: ${card.name}`, "Nhấn Bật tiếng ở góc trên để nghe âm thanh");
        } catch {
          updateStatus(`Đã khớp: ${card.name}`, "Chạm màn hình để phát video");
        }
      }
    }

    function captureCenterCardDescriptor() {
      if (!scannerActive || cameraFeed.readyState < 2 || !cameraFeed.videoWidth || !cameraFeed.videoHeight) {
        return null;
      }

      const vw = cameraFeed.videoWidth;
      const vh = cameraFeed.videoHeight;
      const cropSide = Math.min(vw, vh) * 0.56;
      const sx = (vw - cropSide) / 2;
      const sy = (vh - cropSide) / 2;

      return buildImageDescriptor(cameraFeed, sx, sy, cropSide, cropSide);
    }

    function startScanLoop() {
      clearInterval(scanIntervalId);
      let tick = 0;

      scanIntervalId = setInterval(() => {
        if (!scannerActive) return;

        // Nạp dần thêm mẫu ở nền mỗi ~1.2 giây mà không chặn khung hình
        tick++;
        if (tick % 5 === 0) {
          warmDescriptorsBatch(3);
        }

        const frameDesc = captureCenterCardDescriptor();

        // Nếu camera tối hoặc không có khung hình hợp lệ -> xem như đã lấy card ra
        if (!frameDesc) {
          if (activeCardId) {
            missCount++;
            if (missCount >= MAX_MISS_FRAMES) {
              stopAndHideCardVideo();
            }
          }
          return;
        }

        // Tìm card khớp nhất trong số các card đã nạp descriptor
        let bestCard = null;
        let bestScore = -1;
        let currentActiveScore = -1;

        for (const card of cards) {
          if (!card.descriptor) continue;
          const score = computeSimilarity(frameDesc, card.descriptor);
          if (card.id === activeCardId) {
            currentActiveScore = score;
          }
          if (score > bestScore) {
            bestScore = score;
            bestCard = card;
          }
        }

        // 1. Đang phát video của 1 card: kiểm tra xem card đó còn nằm trong khung hay đã lấy ra / đổi card khác
        if (activeCardId) {
          if (bestCard && bestCard.id !== activeCardId && bestScore >= MATCH_THRESHOLD) {
            if (candidateCardId === bestCard.id) {
              candidateHits++;
            } else {
              candidateCardId = bestCard.id;
              candidateHits = 1;
            }

            if (candidateHits >= REQUIRED_HITS) {
              candidateCardId = null;
              candidateHits = 0;
              showVideoInsideCard(bestCard);
            }
            return;
          }

          if (currentActiveScore < RELEASE_THRESHOLD) {
            missCount++;
            if (missCount >= MAX_MISS_FRAMES) {
              stopAndHideCardVideo("Đã ngưng phát (lấy card ra)", "Đưa card tiếp theo vào giữa khung ngắm");
            }
          } else {
            missCount = 0;
          }
          return;
        }

        // 2. Chưa có card nào đang phát: xác nhận khớp liên tiếp để mở video trong khung card
        if (bestCard && bestScore >= MATCH_THRESHOLD) {
          if (candidateCardId === bestCard.id) {
            candidateHits++;
          } else {
            candidateCardId = bestCard.id;
            candidateHits = 1;
          }

          if (candidateHits >= REQUIRED_HITS) {
            candidateCardId = null;
            candidateHits = 0;
            showVideoInsideCard(bestCard);
          }
        } else {
          candidateCardId = null;
          candidateHits = 0;
        }
      }, 240);
    }

    async function openCameraStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Trình duyệt không hỗ trợ truy cập camera.");
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
      } catch {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }

      cameraFeed.srcObject = mediaStream;
      await new Promise((resolve) => {
        if (cameraFeed.readyState >= 1) return resolve();
        cameraFeed.onloadedmetadata = () => resolve();
      });
      await cameraFeed.play();
    }

    async function startScanner() {
      if (scannerActive) return;
      retryCameraButton.disabled = true;

      try {
        cameraFallback.classList.add("hidden");
        updateStatus("Đang mở camera...", "Đưa card vào giữa khung ngắm");
        await openCameraStream();

        scannerActive = true;
        stopAndHideCardVideo("Đang quét card...", "Đưa card vào giữa khung ngắm để nhận diện");

        // Lấy danh sách nhẹ (chỉ text URL) và bắt đầu quét ngay, không chờ tải hết ảnh
        await fetchCardMetadataOnly();
        await warmDescriptorsBatch(4);
        startScanLoop();
      } catch (err) {
        console.error("Không mở được camera:", err);
        scannerActive = false;
        const msg = err?.message || "Vui lòng cấp quyền camera hoặc mở trang qua HTTPS";
        updateStatus("Không mở được camera", msg);
        cameraFallbackMsg.textContent = msg;
        cameraFallback.classList.remove("hidden");
      } finally {
        retryCameraButton.disabled = false;
      }
    }

    soundButton.addEventListener("click", async () => {
      soundMuted = !soundMuted;
      arVideo.muted = soundMuted;
      soundButton.textContent = soundMuted ? "🔇 Tắt tiếng" : "🔊 Bật tiếng";

      if (!soundMuted && !cardOverlay.classList.contains("hidden") && arVideo.paused) {
        try {
          await arVideo.play();
        } catch (err) {
          console.warn(err);
        }
      }
    });

    retryCameraButton.addEventListener("click", startScanner);

    window.addEventListener("beforeunload", () => {
      scannerActive = false;
      clearInterval(scanIntervalId);
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }
    });

    // Tự động mở camera trực tiếp ngay khi vào trang
    startScanner();
  </script>
</body>
</html>
