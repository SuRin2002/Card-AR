
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
  color:#f3f6ff;
  font-family:Arial,sans-serif;
  padding:20px 14px 35px
}
.wrap{max-width:760px;margin:auto}
.header{text-align:center;margin:20px 0 24px}
.header h1{font-size:25px;letter-spacing:.5px}
.header p{color:#91a3bf;font-size:13px;margin-top:9px}
.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px
}
.camera{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:4/3;
  background:#050a13;
  border-radius:13px
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}
.scan-frame{
  position:absolute;
  inset:12%;
  border:2px solid rgba(255,255,255,.7);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.12)
}
.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere
}
.status.error{color:#ff8998}
.status.success{color:#6de3ac}
.controls{display:flex;gap:9px;margin-top:12px}
button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer
}
button:disabled{opacity:.5}
.primary{background:linear-gradient(135deg,#438fe9,#396ce0)}
.result{
  display:none;
  margin-top:15px;
  padding:14px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b
}
.result h2{font-size:16px;margin-bottom:8px}
.result p{font-size:12px;color:#a9bbd5}
video#resultVideo{
  width:100%;
  max-height:420px;
  margin-top:12px;
  border-radius:10px;
  background:#000
}
.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:18px
}
.hidden{display:none!important}
</style>
</head>

<body>
<main class="wrap">

<header class="header">
  <h1>AR CARD SCANNER</h1>
  <p>Đưa thẻ vào camera để xem video</p>
</header>

<section class="panel">
  <div class="camera">
    <video id="camera" autoplay muted playsinline></video>
    <div class="scan-frame"></div>
  </div>

  <div id="status" class="status">
    Đang khởi động camera...
  </div>

  <div class="controls">
    <button id="stopButton">Dừng camera</button>
    <button id="retryButton" class="primary hidden">Thử lại</button>
  </div>
</section>

<section id="result" class="result">
  <h2 id="resultName"></h2>
  <p>Đã nhận diện thẻ thành công.</p>
  <video id="resultVideo" controls playsinline></video>
</section>

<p class="footer">Giữ card trong khung hình và đảm bảo đủ ánh sáng.</p>

</main>

<script>
window.Module = {
  onRuntimeInitialized: function(){
    window.__opencvReady = true;
    if(window.__opencvResolve) window.__opencvResolve();
  }
};
</script>

<script src="https://docs.opencv.org/4.x/opencv.js" async></script>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0_wwzA1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ELEMENTS
const camera = document.getElementById("camera");
const statusBox = document.getElementById("status");
const stopButton = document.getElementById("stopButton");
const retryButton = document.getElementById("retryButton");
const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");
const resultVideo = document.getElementById("resultVideo");

let stream = null;
let cards = [];
let cvReady = false;
let cameraReady = false;
let scanning = false;
let scanningBusy = false;
let stopped = false;
let activeCardId = null;
let lastMatchTime = 0;
let referenceCanvas = null;
let frameCanvas = null;
let scanTimer = null;

const status = (message,type="") => {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
};

// TẢI OPENCV
const opencvPromise = new Promise((resolve,reject)=>{
  window.__opencvResolve = resolve;

  let attempts = 0;

  const timer = setInterval(()=>{
    attempts++;

    if(window.__opencvReady && window.cv){
      clearInterval(timer);
      resolve(window.cv);
    }

    if(attempts > 120){
      clearInterval(timer);
      reject(new Error("OpenCV tải quá lâu. Hãy tải lại trang."));
    }
  },500);
});

// MỞ CAMERA
async function startCamera(){
  stopped = false;
  retryButton.classList.add("hidden");

  try{
    stopCamera();

    status("Đang xin quyền truy cập camera...");

    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{exact:"environment"},
          width:{ideal:1280},
          height:{ideal:720}
        }
      });
    }catch(firstError){
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1280},
          height:{ideal:720}
        }
      });
    }

    camera.srcObject = stream;
    await camera.play();

    cameraReady = true;

    status("Camera đã mở. Đang chuẩn bị nhận diện...");

    startScanning();

  }catch(error){
    console.error("Camera error:",error);
    cameraReady = false;

    status(
      "Không mở được camera: " + error.message +
      ". Hãy cho phép quyền camera và dùng HTTPS.",
      "error"
    );

    retryButton.classList.remove("hidden");
  }
}

// DỪNG CAMERA
function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream = null;
  }

  camera.srcObject = null;
  cameraReady = false;

  if(scanTimer){
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  scanning = false;
}

// TẢI ẢNH MẪU
function loadImage(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";

    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(
      new Error("Không tải được ảnh mẫu: "+url)
    );

    img.src = url;
  });
}

// TẠO DESCRIPTOR TỪ ẢNH
async function makeReference(url,cv){
  const img = await loadImage(url);

  const canvas = document.createElement("canvas");
  const maxSize = 1000;

  let width = img.naturalWidth;
  let height = img.naturalHeight;

  const scale = Math.min(1,maxSize/Math.max(width,height));

  width = Math.round(width*scale);
  height = Math.round(height*scale);

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img,0,0,width,height);

  const source = cv.imread(canvas);
  const gray = new cv.Mat();
  const descriptors = new cv.Mat();
  const keypoints = new cv.KeyPointVector();

  try{
    cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);
    cv.equalizeHist(gray,gray);

    const orb = new cv.ORB(1800);
    orb.detectAndCompute(
      gray,
      new cv.Mat(),
      keypoints,
      descriptors
    );

    if(keypoints.size()<15 || descriptors.empty()){
      throw new Error("Ảnh mẫu không có đủ chi tiết để nhận diện.");
    }

    return {
      descriptors,
      keypoints,
      width,
      height
    };

  }catch(error){
    descriptors.delete();
    keypoints.delete();
    throw error;
  }finally{
    source.delete();
    gray.delete();
  }
}

// TẢI DANH SÁCH CARD
async function loadCards(){
  status("Đang tải danh sách card...");

  const snapshot = await getDocs(collection(db,"cards"));

  const rawCards = [];

  snapshot.forEach(item=>{
    rawCards.push({
      id:item.id,
      ...item.data()
    });
  });

  const prepared = [];

  for(const card of rawCards){
    const urls = Array.isArray(card.imageUrls)
      ? card.imageUrls.filter(Boolean)
      : [card.imageUrl].filter(Boolean);

    const references = [];

    for(const url of urls.slice(0,2)){
      try{
        const ref = await makeReference(url,window.cv);
        references.push(ref);
      }catch(error){
        console.warn(
          "Không tạo được ảnh mẫu:",
          card.name,
          error
        );
      }
    }

    if(references.length){
      prepared.push({
        ...card,
        references
      });
    }
  }

  cards = prepared;

  console.log("Cards loaded:",cards.length);

  if(cards.length===0){
    status(
      "Chưa có ảnh mẫu hợp lệ. Vào Admin kiểm tra ảnh của card.",
      "error"
    );
  }else{
    status(
      "Đã tải "+cards.length+" card. Đang chờ nhận diện..."
    );
  }
}

// TẠO FRAME GRAYSCALE
function getFrameDescriptors(cv){
  if(!camera.videoWidth || !camera.videoHeight) return null;

  const maxWidth = 800;
  const scale = Math.min(1,maxWidth/camera.videoWidth);

  frameCanvas.width = Math.round(camera.videoWidth*scale);
  frameCanvas.height = Math.round(camera.videoHeight*scale);

  const ctx = frameCanvas.getContext("2d");
  ctx.drawImage(
    camera,
    0,
    0,
    frameCanvas.width,
    frameCanvas.height
  );

  const source = cv.imread(frameCanvas);
  const gray = new cv.Mat();
  const descriptors = new cv.Mat();
  const keypoints = new cv.KeyPointVector();

  try{
    cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);
    cv.equalizeHist(gray,gray);

    const orb = new cv.ORB(1800);
    orb.detectAndCompute(
      gray,
      new cv.Mat(),
      keypoints,
      descriptors
    );

    return {
      descriptors,
      keypoints,
      sourceWidth:camera.videoWidth,
      sourceHeight:camera.videoHeight
    };

  }catch(error){
    descriptors.delete();
    keypoints.delete();
    throw error;
  }finally{
    source.delete();
    gray.delete();
  }
}

// SO KHỚP MỘT ẢNH MẪU VỚI FRAME CAMERA
function compareReference(cv,reference,frame){
  if(
    reference.descriptors.empty() ||
    frame.descriptors.empty() ||
    reference.keypoints.size()<15 ||
    frame.keypoints.size()<15
  ){
    return 0;
  }

  const matcher = new cv.BFMatcher(cv.NORM_HAMMING,false);
  const matches = new cv.DMatchVectorVector();

  let sourcePoints = null;
  let destinationPoints = null;
  let homography = null;
  let mask = null;

  try{
    matcher.knnMatch(
      reference.descriptors,
      frame.descriptors,
      matches,
      2
    );

    const sourceData = [];
    const destinationData = [];

    for(let i=0;i<matches.size();i++){
      const pair = matches.get(i);

      if(pair.size()<2) continue;

      const best = pair.get(0);
      const second = pair.get(1);

      if(best.distance < 0.72*second.distance){
        const pointA = reference.keypoints.get(best.queryIdx).pt;
        const pointB = frame.keypoints.get(best.trainIdx).pt;

        sourceData.push(pointA.x,pointA.y);
        destinationData.push(pointB.x,pointB.y);
      }
    }

    const goodCount = sourceData.length/2;

    if(goodCount<10) return 0;

    sourcePoints = cv.matFromArray(
      goodCount,1,cv.CV_32FC2,sourceData
    );

    destinationPoints = cv.matFromArray(
      goodCount,1,cv.CV_32FC2,destinationData
    );

    mask = new cv.Mat();

    homography = cv.findHomography(
      sourcePoints,
      destinationPoints,
      cv.RANSAC,
      5,
      mask
    );

    if(homography.empty()) return 0;

    let inliers = 0;

    for(let i=0;i<mask.rows;i++){
      if(mask.data[i]!==0) inliers++;
    }

    const ratio = inliers/goodCount;

    // Ngưỡng nhận diện
    if(inliers>=9 && ratio>=0.25){
      return inliers;
    }

    return 0;

  }catch(error){
    console.warn("Match error:",error);
    return 0;
  }finally{
    matcher.delete();
    matches.delete();

    if(sourcePoints) sourcePoints.delete();
    if(destinationPoints) destinationPoints.delete();
    if(homography) homography.delete();
    if(mask) mask.delete();
  }
}

// NHẬN DIỆN CARD
function recognize(cv,frame){
  let bestCard = null;
  let bestScore = 0;

  for(const card of cards){
    for(const reference of card.references){
      const score = compareReference(cv,reference,frame);

      if(score>bestScore){
        bestScore = score;
        bestCard = card;
      }
    }
  }

  return bestCard;
}

// PHÁT VIDEO
function playCard(card){
  if(activeCardId===card.id) return;

  if(!card.videoUrl){
    status("Card đã nhận diện nhưng chưa có URL video.","error");
    return;
  }

  activeCardId = card.id;

  resultName.textContent = card.name || "Card AR";
  resultBox.style.display = "block";

  resultVideo.pause();
  resultVideo.src = card.videoUrl;
  resultVideo.load();

  resultVideo.play().then(()=>{
    status("Đã nhận diện: "+card.name,"success");
  }).catch(error=>{
    console.error("Video error:",error);

    status(
      "Đã nhận diện card nhưng video không phát. Hãy chạm nút Play.",
      "error"
    );
  });

  resultBox.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}

// VÒNG QUÉT
async function scanLoop(){
  if(!scanning || stopped || scanningBusy) return;

  scanningBusy = true;

  try{
    if(camera.readyState>=2 && cards.length){
      const frame = getFrameDescriptors(window.cv);

      if(frame){
        const found = recognize(window.cv,frame);

        if(found){
          const now = Date.now();

          if(now-lastMatchTime>2500){
            lastMatchTime = now;
            playCard(found);
          }
        }

        frame.descriptors.delete();
        frame.keypoints.delete();
      }
    }
  }catch(error){
    console.error("Scan error:",error);
    status("Lỗi nhận diện: "+error.message,"error");
  }finally{
    scanningBusy = false;

    if(scanning && !stopped){
      scanTimer = setTimeout(scanLoop,700);
    }
  }
}

function startScanning(){
  if(scanning) return;

  scanning = true;
  scanLoop();
}

// NÚT CAMERA
stopButton.addEventListener("click",()=>{
  stopped = true;
  stopCamera();
  status("Camera đã dừng.");
  retryButton.classList.remove("hidden");
});

retryButton.addEventListener("click",()=>{
  startCamera();
});

// KHỞI ĐỘNG
frameCanvas = document.createElement("canvas");

async function initialize(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Trình duyệt không hỗ trợ camera hoặc trang chưa dùng HTTPS.");
    }

    // Mở camera ngay, không phụ thuộc Firebase/OpenCV
    startCamera();

    await opencvPromise;

    status("OpenCV đã sẵn sàng. Đang tải ảnh mẫu...");

    await loadCards();

    cvReady = true;

  }catch(error){
    console.error("Initialization error:",error);
    status(error.message,"error");
  }
}

initialize();

// DỌN TÀI NGUYÊN KHI RỜI TRANG
window.addEventListener("pagehide",()=>{
  stopped = true;
  stopCamera();

  for(const card of cards){
    for(const ref of card.references){
      ref.descriptors.delete();
      ref.keypoints.delete();
    }
  }
});
</script>
</body>
</html>
