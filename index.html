<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Card Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080b12;
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .camera-stage {
      perspective: 950px;
      transform-style: preserve-3d;
    }

    .card-anchor {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(56vw, 220px);
      height: min(86vw, 338px);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      will-change: transform, width, height;
      transition: width 0.14s ease-out, height 0.14s ease-out, border-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: none;
    }

    .card-anchor.matched {
      border-color: rgba(255, 255, 255, 0.92);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .ar-video-deck {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      border-radius: inherit;
    }

    .ar-video-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      opacity: 0;
      transition: opacity 0.14s ease;
      pointer-events: none;
    }

    .ar-video-slot.active {
      opacity: 1;
      z-index: 2;
    }

    .ar-video-slot.standby {
      opacity: 0;
      z-index: 1;
    }
  </style>
</head>
<body class="select-none">
  <div class="w-full h-screen h-[100dvh] flex flex-col bg-[#080b12] relative overflow-hidden">

    <!-- Thanh điều hướng trên cùng -->
    <header class="h-16 shrink-0 px-4 sm:px-6 flex items-center justify-between bg-[#101725] border-b border-slate-800/90 z-30">
      <div class="flex items-center gap-2">
        <span class="text-lg font-extrabold tracking-wider text-white">
          AR <span class="text-cyan-400">CARD</span>
        </span>
        <span id="sourceBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          0/0 mẫu
        </span>
      </div>

      <button
        id="soundButton"
        type="button"
        class="px-3.5 py-2 rounded-full text-xs sm:text-sm font-medium bg-slate-800/90 hover:bg-slate-700 text-white border border-slate-700 transition cursor-pointer"
      >
        🔊 Đang bật tiếng
      </button>
    </header>

    <!-- Vùng Camera chính -->
    <main class="camera-stage relative flex-1 min-h-0 bg-black overflow-hidden">
      <video id="cameraFeed" autoplay playsinline webkit-playsinline muted></video>

      <div
        id="topStatusPill"
        class="absolute top-3.5 left-1/2 -translate-x-1/2 z-20 max-w-[92%] px-4 py-2 rounded-full bg-[#0a121e]/85 border border-slate-700/80 text-xs sm:text-sm text-slate-100 truncate backdrop-blur-sm"
      >
        Đang mở camera...
      </div>

      <!-- Khung khớp tỉ lệ card + video phát trực tiếp trên mặt card -->
      <div
        id="scanFrame"
        class="card-anchor rounded-xl border border-cyan-300/75 z-10 overflow-hidden pointer-events-none"
      >
        <div class="absolute top-0 left-0 w-4 h-4 border-t-[3px] border-l-[3px] border-cyan-300 rounded-tl-lg z-20 pointer-events-none"></div>
        <div class="absolute top-0 right-0 w-4 h-4 border-t-[3px] border-r-[3px] border-cyan-300 rounded-tr-lg z-20 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-4 h-4 border-b-[3px] border-l-[3px] border-cyan-300 rounded-bl-lg z-20 pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-4 h-4 border-b-[3px] border-r-[3px] border-cyan-300 rounded-br-lg z-20 pointer-events-none"></div>

        <!-- Hai khe video luân phiên để chuyển card không bị khựng -->
        <div id="cardOverlay" class="hidden ar-video-deck z-10">
          <video id="videoSlotA" class="ar-video-slot" playsinline webkit-playsinline loop></video>
          <video id="videoSlotB" class="ar-video-slot" playsinline webkit-playsinline loop></video>
        </div>
      </div>

      <!-- Chỉ hiện khi trình duyệt chặn tự động mở camera -->
      <div
        id="cameraFallback"
        class="hidden absolute inset-0 bg-[#080b12]/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center gap-4"
      >
        <p id="cameraFallbackMsg" class="max-w-md text-xs sm:text-sm text-slate-200 leading-relaxed">
          Trình duyệt cần cấp quyền hoặc chạm để bật camera.
        </p>
        <button
          id="retryCameraButton"
          type="button"
          class="px-6 py-3 rounded-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-sm shadow-lg transition cursor-pointer"
        >
          BẬT CAMERA
        </button>
      </div>
    </main>

    <!-- Thanh trạng thái phía dưới -->
    <footer class="min-h-[74px] shrink-0 px-4 sm:px-6 py-3 bg-[#101725] border-t border-slate-800/90 flex flex-col justify-center gap-1 z-30">
      <div id="mainStatus" class="text-sm font-bold text-cyan-400 truncate">
        Đang mở camera...
      </div>
      <div id="subStatus" class="text-xs text-slate-400 truncate">
        Đưa đúng card vào giữa khung ngắm
      </div>
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
      authDomain: "ar-card-video.firebaseapp.com",
      projectId: "ar-card-video",
      storageBucket: "ar-card-video.firebasestorage.app",
      messagingSenderId: "725938606795",
      appId: "1:725938606795:web:516149f4210f26344bc14e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const cameraFeed = $("cameraFeed");
    const cardOverlay = $("cardOverlay");
    const videoSlotA = $("videoSlotA");
    const videoSlotB = $("videoSlotB");
    const topStatusPill = $("topStatusPill");
    const scanFrame = $("scanFrame");
    const cameraFallback = $("cameraFallback");
    const cameraFallbackMsg = $("cameraFallbackMsg");
    const retryCameraButton = $("retryCameraButton");
    const mainStatus = $("mainStatus");
    const subStatus = $("subStatus");
    const sourceBadge = $("sourceBadge");
    const soundButton = $("soundButton");

    const ANALYSIS_SIZE = 48;
    const workCanvas = document.createElement("canvas");
    workCanvas.width = ANALYSIS_SIZE;
    workCanvas.height = ANALYSIS_SIZE;
    const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });

    let cards = [];
    let mediaStream = null;
    let scanIntervalId = null;
    let scannerActive = false;
    let soundMuted = false;
    let userUnlockedAudio = false;
    let activeCardId = null;
    let activeVideoEl = videoSlotA;
    let standbyVideoEl = videoSlotB;
    let playRequestToken = 0;
    let missCount = 0;
    let candidateCardId = null;
    let candidateHits = 0;

    // Cân bằng độ nhạy cho cả card màu lẫn card nét đen trắng nền trắng
    const MATCH_THRESHOLD = 0.72;
    const RELEASE_THRESHOLD = 0.60;
    const MIN_MARGIN_OVER_SECOND = 0.045;
    const REQUIRED_HITS = 2;
    const MAX_MISS_FRAMES = 3;

    function syncAudioStateToSlots(forceUnmute = false) {
      if (forceUnmute) {
        soundMuted = false;
        userUnlockedAudio = true;
      }
      for (const el of [videoSlotA, videoSlotB]) {
        el.muted = soundMuted;
        el.defaultMuted = soundMuted;
        el.volume = 1.0;
      }
      soundButton.textContent = soundMuted ? "🔇 Bật tiếng" : "🔊 Đang bật tiếng";
    }

    function updateStatus(primary, secondary = "") {
      if (activeCardId) {
        topStatusPill.textContent = activeVideoEl.muted ? "AR LIVE · CHẠM MỞ TIẾNG" : "AR LIVE · 🔊";
        mainStatus.textContent = "AR LIVE";
        subStatus.textContent = activeVideoEl.muted ? "Chạm màn hình để bật âm thanh" : "";
        return;
      }
      topStatusPill.textContent = primary;
      mainStatus.textContent = primary;
      subStatus.textContent = secondary;
    }

    function applyCardRatioAndPose(ratio = 1.54) {
      const safeRatio = Number(ratio) > 0.2 && Number(ratio) < 4 ? Number(ratio) : 1.54;
      const isLandscape = safeRatio < 1;

      const maxWidth = isLandscape ? window.innerWidth * 0.9 : Math.min(window.innerWidth * 0.56, 224);
      const maxHeight = window.innerHeight * 0.56;

      let width = maxWidth;
      let height = width * safeRatio;

      if (height > maxHeight) {
        height = maxHeight;
        width = height / safeRatio;
      }

      scanFrame.style.width = `${Math.round(width)}px`;
      scanFrame.style.height = `${Math.round(height)}px`;
      scanFrame.style.transform = "translate(-50%, -50%)";
    }

    function normalizeVector(arr, weight = 1.0) {
      let norm = 0;
      for (let i = 0; i < arr.length; i++) {
        norm += arr[i] * arr[i];
      }
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < arr.length; i++) {
        arr[i] = (arr[i] / norm) * weight;
      }
    }

    function buildImageDescriptor(source, sx, sy, sw, sh, rotateDeg = 0) {
      try {
        workCtx.save();
        workCtx.clearRect(0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);
        workCtx.fillStyle = "#ffffff";
        workCtx.fillRect(0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);

        if (rotateDeg !== 0) {
          workCtx.translate(ANALYSIS_SIZE / 2, ANALYSIS_SIZE / 2);
          workCtx.rotate((rotateDeg * Math.PI) / 180);
          workCtx.drawImage(source, sx, sy, sw, sh, -ANALYSIS_SIZE / 2, -ANALYSIS_SIZE / 2, ANALYSIS_SIZE, ANALYSIS_SIZE);
        } else {
          workCtx.drawImage(source, sx, sy, sw, sh, 0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);
        }
        workCtx.restore();

        const { data } = workCtx.getImageData(0, 0, ANALYSIS_SIZE, ANALYSIS_SIZE);

        const pixelCount = ANALYSIS_SIZE * ANALYSIS_SIZE;
        let sumR = 0;
        let sumG = 0;
        let sumB = 0;
        let sumSqLuma = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          sumR += r;
          sumG += g;
          sumB += b;
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          sumSqLuma += lum * lum;
        }

        const meanLuma = (0.299 * sumR + 0.587 * sumG + 0.114 * sumB) / pixelCount;
        // Nới ngưỡng sáng tối để tranh nét đen trắng nền trắng không bị loại nhầm
        if (meanLuma < 18 || meanLuma > 252) return null;
        const stdLuma = Math.sqrt(Math.max(0, sumSqLuma / pixelCount - meanLuma * meanLuma));
        if (stdLuma < 8) return null;

        const avgR = (sumR / pixelCount) || 1;
        const avgG = (sumG / pixelCount) || 1;
        const avgB = (sumB / pixelCount) || 1;
        const avgGray = (avgR + avgG + avgB) / 3;
        const gainR = avgGray / avgR;
        const gainG = avgGray / avgG;
        const gainB = avgGray / avgB;

        const gridDim = 6;
        const cellSize = ANALYSIS_SIZE / gridDim;
        const gridVec = new Float32Array(gridDim * gridDim * 3);
        const histVec = new Float32Array(64);
        const edgeVec = new Float32Array(gridDim * gridDim);
        const lumaGridVec = new Float32Array(gridDim * gridDim);
        const normLuma = new Float32Array(pixelCount);

        for (let y = 0; y < ANALYSIS_SIZE; y++) {
          const gy = Math.min(gridDim - 1, Math.floor(y / cellSize));
          for (let x = 0; x < ANALYSIS_SIZE; x++) {
            const gx = Math.min(gridDim - 1, Math.floor(x / cellSize));
            const p = y * ANALYSIS_SIZE + x;
            const idx = p * 4;

            const r = Math.min(255, data[idx] * gainR);
            const g = Math.min(255, data[idx + 1] * gainG);
            const b = Math.min(255, data[idx + 2] * gainB);

            const lum = 0.299 * r + 0.587 * g + 0.114 * b;
            normLuma[p] = lum;

            const cell = gy * gridDim + gx;
            const cellIdx = cell * 3;
            gridVec[cellIdx] += r - lum;
            gridVec[cellIdx + 1] += g - lum;
            gridVec[cellIdx + 2] += b - lum;
            lumaGridVec[cell] += (lum - meanLuma) / stdLuma;

            const binR = Math.min(3, r >> 6);
            const binG = Math.min(3, g >> 6);
            const binB = Math.min(3, b >> 6);
            histVec[(binR << 4) | (binG << 2) | binB] += 1;
          }
        }

        for (let y = 1; y < ANALYSIS_SIZE - 1; y++) {
          const gy = Math.min(gridDim - 1, Math.floor(y / cellSize));
          for (let x = 1; x < ANALYSIS_SIZE - 1; x++) {
            const gx = Math.min(gridDim - 1, Math.floor(x / cellSize));
            const p = y * ANALYSIS_SIZE + x;
            const dx = Math.abs(normLuma[p + 1] - normLuma[p - 1]);
            const dy = Math.abs(normLuma[p + ANALYSIS_SIZE] - normLuma[p - ANALYSIS_SIZE]);
            edgeVec[gy * gridDim + gx] += dx + dy;
          }
        }

        normalizeVector(gridVec, 1.15);
        normalizeVector(histVec, 0.75);
        normalizeVector(edgeVec, 1.45);
        normalizeVector(lumaGridVec, 1.15);

        const combined = new Float32Array(gridVec.length + histVec.length + edgeVec.length + lumaGridVec.length);
        let offset = 0;
        combined.set(gridVec, offset); offset += gridVec.length;
        combined.set(histVec, offset); offset += histVec.length;
        combined.set(edgeVec, offset); offset += edgeVec.length;
        combined.set(lumaGridVec, offset);

        normalizeVector(combined, 1.0);
        return combined;
      } catch (err) {
        console.warn("Lỗi đọc dữ liệu ảnh:", err);
        return null;
      }
    }

    function computeSimilarity(vecA, vecB) {
      if (!vecA || !vecB || vecA.length !== vecB.length) return -1;
      let dot = 0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
      }
      return dot;
    }

    async function createCardDescriptorFromUrl(url) {
      const extractMultiVariants = (drawable, w, h) => {
        const variants = [];
        // Sinh mẫu ở cả 0°, 90°, 270° (phòng trường hợp ảnh upload bị xoay ngang như Mẫu 2)
        for (const deg of [0, 90, 270]) {
          const baseDesc = buildImageDescriptor(drawable, 0, 0, w, h, deg);
          if (baseDesc) variants.push(baseDesc);
        }

        const cW = w * 0.88;
        const cH = h * 0.88;
        const centerDesc = buildImageDescriptor(drawable, (w - cW) / 2, (h - cH) / 2, cW, cH, 0);
        if (centerDesc) variants.push(centerDesc);

        return variants;
      };

      try {
        const res = await fetch(url, { mode: "cors" });
        if (res.ok) {
          const blob = await res.blob();
          const bitmap = await createImageBitmap(blob);
          const variants = extractMultiVariants(bitmap, bitmap.width, bitmap.height);
          bitmap.close();
          if (variants.length) return variants;
        }
      } catch {}

      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const variants = extractMultiVariants(img, img.naturalWidth, img.naturalHeight);
          resolve(variants.length ? variants : null);
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    function scoreAgainstCardVariants(frameDesc, card) {
      if (!frameDesc || !card?.descriptors?.length) return -1;
      let best = -1;
      for (const desc of card.descriptors) {
        const s = computeSimilarity(frameDesc, desc);
        if (s > best) best = s;
      }
      return best;
    }

    function updateReadyBadge() {
      const readyCount = cards.filter((c) => Boolean(c.descriptors?.length)).length;
      sourceBadge.textContent = `${readyCount}/${cards.length} mẫu`;
    }

    async function fetchCardMetadataOnly() {
      try {
        const snapshot = await getDocs(collection(db, "cards"));
        const list = [];

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const name = (data.name || "Card AR").trim();
          const imageUrl = typeof data.imageUrl === "string" ? data.imageUrl.trim() : "";
          const videoUrl = typeof data.videoUrl === "string" ? data.videoUrl.trim() : "";
          const ratio = Number(data.ratio) > 0 ? Number(data.ratio) : 1.54;

          if (!videoUrl.startsWith("https://") || !imageUrl.startsWith("https://")) return;

          list.push({
            id: docSnap.id,
            name,
            imageUrl,
            videoUrl,
            ratio,
            descriptors: null,
            loadingDescriptor: false,
            failed: false
          });
        });

        cards = list;
        updateReadyBadge();
      } catch (err) {
        console.warn("Lỗi tải danh sách Firestore:", err);
        cards = [];
        sourceBadge.textContent = "0/0 mẫu";
      }
    }

    async function warmDescriptorsBatch(batchSize = 4) {
      const pending = cards.filter(
        (c) => !c.descriptors && !c.loadingDescriptor && !c.failed && c.imageUrl.startsWith("https://")
      );
      if (!pending.length) return;

      const slice = pending.slice(0, batchSize);
      await Promise.all(
        slice.map(async (card) => {
          card.loadingDescriptor = true;
          const variants = await createCardDescriptorFromUrl(card.imageUrl);
          card.descriptors = variants;
          card.failed = !variants;
          card.loadingDescriptor = false;
        })
      );
      updateReadyBadge();
    }

    function clearVideoSlot(el) {
      el.pause();
      el.onerror = null;
      el.removeAttribute("src");
      el.load();
      el.classList.remove("active");
      el.classList.add("standby");
    }

    function stopAndHideCardVideo(statusMsg = "Đang quét...", detailMsg = "") {
      playRequestToken++;
      activeCardId = null;
      candidateCardId = null;
      candidateHits = 0;
      missCount = 0;

      clearVideoSlot(videoSlotA);
      clearVideoSlot(videoSlotB);

      cardOverlay.classList.add("hidden");
      scanFrame.classList.remove("matched");
      applyCardRatioAndPose(1.54);
      updateStatus(statusMsg, detailMsg);
    }

    async function showVideoInsideCard(card) {
      const token = ++playRequestToken;
      activeCardId = card.id;
      missCount = 0;

      applyCardRatioAndPose(card.ratio);
      scanFrame.classList.add("matched");
      cardOverlay.classList.remove("hidden");

      const nextVideo = standbyVideoEl;
      const prevVideo = activeVideoEl;

      nextVideo.pause();
      nextVideo.onerror = null;
      nextVideo.src = card.videoUrl;
      nextVideo.muted = soundMuted;
      nextVideo.defaultMuted = soundMuted;
      nextVideo.volume = 1.0;
      nextVideo.loop = true;
      nextVideo.playsInline = true;
      nextVideo.load();

      nextVideo.onerror = () => {
        if (token !== playRequestToken) return;
        stopAndHideCardVideo("Đang quét...", "");
      };

      const activateSlot = () => {
        // Tự động khớp khung hiển thị theo tỉ lệ thật của video (ngang 16:9 hoặc dọc 9:16)
        if (nextVideo.videoWidth > 0 && nextVideo.videoHeight > 0) {
          const naturalVideoRatio = nextVideo.videoHeight / nextVideo.videoWidth;
          applyCardRatioAndPose(naturalVideoRatio);
        }

        nextVideo.classList.remove("standby");
        nextVideo.classList.add("active");

        prevVideo.classList.remove("active");
        prevVideo.classList.add("standby");
        prevVideo.pause();

        activeVideoEl = nextVideo;
        standbyVideoEl = prevVideo;
      };

      try {
        await nextVideo.play();
        if (token !== playRequestToken || activeCardId !== card.id) {
          nextVideo.pause();
          return;
        }
        if (!soundMuted) {
          nextVideo.muted = false;
          nextVideo.volume = 1.0;
        }
        activateSlot();
        updateStatus("AR LIVE", "");
      } catch (err) {
        if (token !== playRequestToken) return;
        console.warn("Trình duyệt chặn tự phát có tiếng, đang phát tạm tắt tiếng chờ chạm màn hình:", err);
        nextVideo.muted = true;
        try {
          await nextVideo.play();
          activateSlot();
          updateStatus("AR LIVE", "Chạm màn hình để bật âm thanh");
        } catch {
          stopAndHideCardVideo("Đang quét...", "");
        }
      }
    }

    function captureCenterCardDescriptor(ratio = 1.54, scaleFactor = 1.0) {
      if (!scannerActive || cameraFeed.readyState < 2 || !cameraFeed.videoWidth || !cameraFeed.videoHeight) {
        return null;
      }

      const vw = cameraFeed.videoWidth;
      const vh = cameraFeed.videoHeight;
      const safeRatio = ratio > 0.2 && ratio < 4 ? ratio : 1.54;

      let cropW = Math.min(vw, vh) * 0.56 * scaleFactor;
      let cropH = cropW * safeRatio;
      const maxH = vh * 0.72;
      if (cropH > maxH) {
        cropH = maxH;
        cropW = cropH / safeRatio;
      }

      const sx = Math.max(0, (vw - cropW) / 2);
      const sy = Math.max(0, (vh - cropH) / 2);
      const sw = Math.min(vw - sx, cropW);
      const sh = Math.min(vh - sy, cropH);

      return buildImageDescriptor(cameraFeed, sx, sy, sw, sh, 0);
    }

    function startScanLoop() {
      clearInterval(scanIntervalId);
      let tick = 0;

      scanIntervalId = setInterval(() => {
        if (!scannerActive) return;

        tick++;
        if (tick % 2 === 0) {
          warmDescriptorsBatch(6);
        }

        const activeCardObj = activeCardId ? cards.find((c) => c.id === activeCardId) : null;
        const probeRatio = activeCardObj ? activeCardObj.ratio : 1.54;

        const frameDesc = captureCenterCardDescriptor(probeRatio, 1.0);
        const wideDesc = captureCenterCardDescriptor(probeRatio, 1.12);

        if (!frameDesc && !wideDesc) {
          if (activeCardId) {
            missCount++;
            if (missCount >= MAX_MISS_FRAMES) {
              stopAndHideCardVideo("Đang quét...", "");
            }
          }
          return;
        }

        const loadedCards = cards.filter((c) => Boolean(c.descriptors?.length));
        if (!loadedCards.length) {
          if (activeCardId) stopAndHideCardVideo("Đang quét...", "");
          return;
        }

        let bestCard = null;
        let bestScore = -1;
        let secondScore = -1;
        let currentActiveScore = -1;

        for (const card of loadedCards) {
          const s1 = frameDesc ? scoreAgainstCardVariants(frameDesc, card) : -1;
          const s2 = wideDesc ? scoreAgainstCardVariants(wideDesc, card) : -1;
          const score = Math.max(s1, s2);

          if (card.id === activeCardId) {
            currentActiveScore = score;
          }
          if (score > bestScore) {
            secondScore = bestScore;
            bestScore = score;
            bestCard = card;
          } else if (score > secondScore) {
            secondScore = score;
          }
        }

        const margin = loadedCards.length > 1 ? bestScore - secondScore : 1;
        const isConfidentMatch =
          Boolean(bestCard) &&
          bestScore >= MATCH_THRESHOLD &&
          margin >= MIN_MARGIN_OVER_SECOND;

        if (activeCardId) {
          if (currentActiveScore < RELEASE_THRESHOLD && !isConfidentMatch) {
            missCount++;
            if (missCount >= MAX_MISS_FRAMES) {
              stopAndHideCardVideo("Đang quét...", "");
            }
            return;
          }

          missCount = 0;
          if (activeCardObj) {
            const liveRatio =
              activeVideoEl.videoWidth > 0 && activeVideoEl.videoHeight > 0
                ? activeVideoEl.videoHeight / activeVideoEl.videoWidth
                : activeCardObj.ratio;
            applyCardRatioAndPose(liveRatio);
          }

          if (isConfidentMatch && bestCard.id !== activeCardId) {
            if (candidateCardId === bestCard.id) {
              candidateHits++;
            } else {
              candidateCardId = bestCard.id;
              candidateHits = 1;
            }

            if (candidateHits >= REQUIRED_HITS) {
              candidateCardId = null;
              candidateHits = 0;
              showVideoInsideCard(bestCard);
            }
          } else {
            candidateCardId = null;
            candidateHits = 0;
          }
          return;
        }

        if (isConfidentMatch) {
          if (candidateCardId === bestCard.id) {
            candidateHits++;
          } else {
            candidateCardId = bestCard.id;
            candidateHits = 1;
          }

          if (candidateHits >= REQUIRED_HITS) {
            candidateCardId = null;
            candidateHits = 0;
            showVideoInsideCard(bestCard);
          }
        } else {
          candidateCardId = null;
          candidateHits = 0;
        }
      }, 150);
    }

    async function openCameraStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Trình duyệt không hỗ trợ truy cập camera.");
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
      } catch {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }

      cameraFeed.srcObject = mediaStream;
      await new Promise((resolve) => {
        if (cameraFeed.readyState >= 1) return resolve();
        cameraFeed.onloadedmetadata = () => resolve();
      });
      await cameraFeed.play();
    }

    async function startScanner() {
      if (scannerActive) return;
      retryCameraButton.disabled = true;

      try {
        cameraFallback.classList.add("hidden");
        updateStatus("Đang mở camera...", "Đưa đúng card vào giữa khung ngắm");
        await openCameraStream();

        scannerActive = true;
        stopAndHideCardVideo("Đang quét card...", "Đưa đúng card vào giữa khung ngắm");

        await fetchCardMetadataOnly();
        await warmDescriptorsBatch(4);
        startScanLoop();
      } catch (err) {
        console.error("Không mở được camera:", err);
        scannerActive = false;
        const msg = err?.message || "Vui lòng cấp quyền camera hoặc mở trang qua HTTPS";
        updateStatus("Không mở được camera", msg);
        cameraFallbackMsg.textContent = msg;
        cameraFallback.classList.remove("hidden");
      } finally {
        retryCameraButton.disabled = false;
      }
    }

    async function unlockAndPlayAudio() {
      syncAudioStateToSlots(true);
      if (!cardOverlay.classList.contains("hidden") && activeVideoEl.src) {
        try {
          activeVideoEl.muted = false;
          activeVideoEl.volume = 1.0;
          await activeVideoEl.play();
        } catch (err) {
          console.warn("Không thể phát có tiếng:", err);
        }
      }
      if (activeCardId) {
        updateStatus("AR LIVE", "");
      }
    }

    soundButton.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!userUnlockedAudio || soundMuted) {
        await unlockAndPlayAudio();
      } else {
        soundMuted = true;
        syncAudioStateToSlots(false);
        if (activeCardId) updateStatus("AR LIVE", "");
      }
    });

    document.addEventListener("pointerdown", async () => {
      if (!userUnlockedAudio || soundMuted) {
        await unlockAndPlayAudio();
      } else if (!cardOverlay.classList.contains("hidden") && activeVideoEl.paused && activeVideoEl.src) {
        try {
          await activeVideoEl.play();
        } catch {}
      }
    }, { passive: true });

    retryCameraButton.addEventListener("click", startScanner);

    window.addEventListener("resize", () => {
      if (activeCardId) {
        const c = cards.find((item) => item.id === activeCardId);
        if (c) {
          const liveRatio =
            activeVideoEl.videoWidth > 0 && activeVideoEl.videoHeight > 0
              ? activeVideoEl.videoHeight / activeVideoEl.videoWidth
              : c.ratio;
          applyCardRatioAndPose(liveRatio);
        }
      }
    });

    window.addEventListener("beforeunload", () => {
      scannerActive = false;
      clearInterval(scanIntervalId);
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }
    });

    syncAudioStateToSlots(false);
    startScanner();
  </script>
</body>
