
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Card Scanner</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080b12;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #080b12;
    }

    header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #202838;
      background: #101725;
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #40d9ff;
    }

    .sound-button {
      border: 1px solid #344258;
      color: #fff;
      background: #1b2638;
      border-radius: 20px;
      padding: 9px 14px;
      cursor: pointer;
    }

    .camera-area {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #arContainer,
    #arContainer a-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #arContainer canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    #arContainer video:not(#arVideo) {
      object-fit: cover !important;
    }

    .scan-frame {
      position: absolute;
      width: min(72vw, 330px);
      height: min(72vw, 330px);
      max-height: 45%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(64, 217, 255, .8);
      border-radius: 22px;
      box-shadow: 0 0 25px rgba(64, 217, 255, .12);
      pointer-events: none;
      z-index: 3;
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #40d9ff;
      border-style: solid;
    }

    .tl {
      top: -2px;
      left: -2px;
      border-width: 4px 0 0 4px;
      border-radius: 12px 0 0;
    }

    .tr {
      top: -2px;
      right: -2px;
      border-width: 4px 4px 0 0;
      border-radius: 0 12px 0 0;
    }

    .bl {
      bottom: -2px;
      left: -2px;
      border-width: 0 0 4px 4px;
      border-radius: 0 0 0 12px;
    }

    .br {
      bottom: -2px;
      right: -2px;
      border-width: 0 4px 4px 0;
      border-radius: 0 0 12px;
    }

    .hint {
      position: absolute;
      top: calc(50% + min(36vw, 165px) + 25px);
      left: 15px;
      right: 15px;
      text-align: center;
      color: #d5e5f4;
      font-size: 14px;
      z-index: 4;
      text-shadow: 0 2px 5px #000;
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 18, 30, .85);
      border: 1px solid #304158;
      border-radius: 30px;
      padding: 9px 16px;
      font-size: 13px;
      white-space: nowrap;
      z-index: 5;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-layer {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 6;
      align-items: center;
      justify-content: center;
    }

    .video-layer.show {
      display: flex;
    }

    #arVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-name {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 18px;
      text-align: center;
      font-size: 15px;
      color: white;
      text-shadow: 0 2px 6px #000;
      pointer-events: none;
    }

    footer {
      flex-shrink: 0;
      min-height: 76px;
      padding: 13px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: #101725;
      border-top: 1px solid #202838;
      z-index: 10;
    }

    #mainStatus {
      font-size: 14px;
      font-weight: bold;
      color: #40d9ff;
    }

    #subStatus {
      font-size: 12px;
      color: #8c9bb0;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      background: #080b12;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 25px;
      text-align: center;
      gap: 16px;
    }

    .start-screen h2 {
      font-size: 24px;
    }

    .start-screen p {
      color: #9baabe;
      font-size: 14px;
      line-height: 1.6;
    }

    .start-screen select {
      width: 100%;
      max-width: 340px;
      padding: 13px;
      border: 1px solid #344258;
      border-radius: 10px;
      background: #172235;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .start-button {
      border: none;
      background: #22c8ef;
      color: #061018;
      font-weight: bold;
      font-size: 16px;
      padding: 14px 30px;
      border-radius: 30px;
      margin-top: 8px;
      cursor: pointer;
    }

    .start-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .change-button {
      display: none;
      position: absolute;
      z-index: 12;
      top: 65px;
      right: 12px;
      padding: 10px 14px;
      border: 1px solid #344258;
      border-radius: 22px;
      background: rgba(16, 23, 37, .92);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .change-button.show {
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <div class="logo">AR <span>CARD</span></div>
    <button class="sound-button" id="soundButton">🔇 Bật âm thanh</button>
  </header>

  <main class="camera-area">

    <div id="arContainer"></div>

    <div class="scan-frame" id="scanFrame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

    <div class="status" id="status">Đang tải danh sách card...</div>

    <div class="hint" id="hint">
      Chọn card rồi đưa vào giữa khung hình
    </div>

    <button class="change-button" id="changeButton">
      Đổi card
    </button>

    <div class="video-layer" id="videoLayer">
      <video id="arVideo" playsinline webkit-playsinline></video>
      <div class="video-name" id="videoName"></div>
    </div>

    <div class="start-screen" id="startScreen">
      <h2>AR Card Scanner</h2>
      <p>
        Chọn card muốn quét.<br>
        Sau đó đưa đúng card vào giữa khung hình.
      </p>

      <select id="cardSelect" disabled>
        <option value="">Đang tải danh sách card...</option>
      </select>

      <button class="start-button" id="startButton" disabled>
        BẮT ĐẦU QUÉT
      </button>
    </div>

  </main>

  <footer>
    <div id="mainStatus">Đang tải dữ liệu</div>
    <div id="subStatus">Đang kết nối Firestore</div>
  </footer>

</div>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
    authDomain: "ar-card-video.firebaseapp.com",
    projectId: "ar-card-video",
    storageBucket: "ar-card-video.firebasestorage.app",
    messagingSenderId: "725938606795",
    appId: "1:725938606795:web:516149f4210f26344bc14e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);

  const arContainer = $("arContainer");
  const video = $("arVideo");
  const videoLayer = $("videoLayer");
  const videoName = $("videoName");
  const statusEl = $("status");
  const mainStatus = $("mainStatus");
  const subStatus = $("subStatus");
  const hint = $("hint");
  const scanFrame = $("scanFrame");
  const startScreen = $("startScreen");
  const startButton = $("startButton");
  const soundButton = $("soundButton");
  const cardSelect = $("cardSelect");
  const changeButton = $("changeButton");

  let cards = [];
  let activeCard = null;
  let currentScene = null;
  let currentArSystem = null;

  let sessionId = 0;
  let isRunning = false;
  let isTargetFound = false;
  let soundEnabled = false;
  let videoToken = 0;

  function setStatus(message, detail = "") {
    statusEl.textContent = message;
    mainStatus.textContent = message;
    subStatus.textContent = detail;
  }

  function normalizeUrl(value) {
    return typeof value === "string" ? value.trim() : "";
  }

  function isHttpsUrl(value) {
    try {
      return new URL(value).protocol === "https:";
    } catch {
      return false;
    }
  }

  async function loadCards() {
    setStatus("Đang tải dữ liệu...", "Đang kết nối Firestore");

    const snapshot = await getDocs(collection(db, "cards"));
    const result = [];

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      const mindUrl = normalizeUrl(data.mindUrl);
      const videoUrl = normalizeUrl(data.videoUrl);

      if (!isHttpsUrl(mindUrl) || !isHttpsUrl(videoUrl)) {
        console.warn("Bỏ qua card thiếu URL hợp lệ:", docSnap.id);
        return;
      }

      result.push({
        id: docSnap.id,
        name: data.name || "Thẻ AR",
        imageUrl: data.imageUrl || "",
        mindUrl,
        videoUrl,
        ratio: Number(data.ratio) || 1.54,
        targetIndex: 0
      });
    });

    return result;
  }

  function populateCardSelect() {
    cardSelect.replaceChildren();

    if (!cards.length) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Chưa có card hợp lệ";
      cardSelect.append(option);
      cardSelect.disabled = true;
      startButton.disabled = true;
      return;
    }

    const firstOption = document.createElement("option");
    firstOption.value = "";
    firstOption.textContent = "— Chọn card muốn quét —";
    cardSelect.append(firstOption);

    cards.forEach(card => {
      const option = document.createElement("option");
      option.value = card.id;
      option.textContent = card.name;
      cardSelect.append(option);
    });

    cardSelect.disabled = false;
    startButton.disabled = false;
  }

  function waitForSceneLoaded(scene) {
    return new Promise((resolve, reject) => {
      if (scene.hasLoaded) {
        resolve();
        return;
      }

      const timer = setTimeout(() => {
        reject(new Error("Scene khởi tạo quá thời gian."));
      }, 20000);

      scene.addEventListener("loaded", () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });

      scene.addEventListener("error", () => {
        clearTimeout(timer);
        reject(new Error("Không thể khởi tạo A-Frame scene."));
      }, { once: true });
    });
  }

  function waitForArReady(scene, timeoutMs = 30000) {
    return new Promise((resolve, reject) => {
      let finished = false;

      const cleanup = () => {
        scene.removeEventListener("arReady", onReady);
        scene.removeEventListener("arError", onError);
        clearTimeout(timer);
      };

      const done = (callback, value) => {
        if (finished) return;
        finished = true;
        cleanup();
        callback(value);
      };

      const onReady = () => done(resolve);

      const onError = event => {
        done(
          reject,
          new Error(
            event.detail?.error || "MindAR không thể khởi động camera."
          )
        );
      };

      const timer = setTimeout(() => {
        done(
          reject,
          new Error("Không nhận được tín hiệu camera từ MindAR.")
        );
      }, timeoutMs);

      scene.addEventListener("arReady", onReady);
      scene.addEventListener("arError", onError);
    });
  }

  function stopVideo() {
    videoToken++;

    video.pause();
    video.onended = null;
    video.onerror = null;
    video.removeAttribute("src");
    video.load();

    videoLayer.classList.remove("show");
    videoName.textContent = "";
  }

  async function playCardVideo(card, thisSession) {
    if (
      !isRunning ||
      thisSession !== sessionId ||
      !activeCard ||
      card.id !== activeCard.id ||
      !isTargetFound
    ) {
      return;
    }

    const thisVideoToken = ++videoToken;

    video.pause();
    video.removeAttribute("src");
    video.load();

    video.src = card.videoUrl;
    video.muted = !soundEnabled;
    video.loop = false;
    video.playsInline = true;

    videoName.textContent = card.name;
    videoLayer.classList.add("show");

    video.onended = () => {
      if (
        thisSession !== sessionId ||
        thisVideoToken !== videoToken ||
        !isTargetFound
      ) return;

      setStatus(
        "Video đã phát xong",
        "Đưa thẻ ra rồi đưa lại vào để phát lại"
      );
    };

    video.onerror = () => {
      if (
        thisSession !== sessionId ||
        thisVideoToken !== videoToken
      ) return;

      setStatus(
        "Không phát được video",
        "Kiểm tra lại videoUrl trong Admin"
      );
    };

    try {
      await video.play();

      if (
        thisSession !== sessionId ||
        thisVideoToken !== videoToken ||
        !isTargetFound
      ) {
        video.pause();
        return;
      }

      setStatus("Đã nhận diện: " + card.name, "Đang phát video");
    } catch (error) {
      console.warn("Không thể tự phát video:", error);

      if (
        thisSession === sessionId &&
        thisVideoToken === videoToken
      ) {
        setStatus(
          "Đã nhận diện: " + card.name,
          "Chạm vào màn hình video để phát"
        );
      }
    }
  }

  async function destroyCurrentScene() {
    const oldScene = currentScene;
    const oldSystem = currentArSystem;

    currentScene = null;
    currentArSystem = null;

    if (oldSystem) {
      try {
        await oldSystem.stop();
      } catch (error) {
        console.warn("Lỗi khi dừng MindAR:", error);
      }
    }

    if (oldScene) {
      try {
        oldScene.pause();
        oldScene.remove();
      } catch (error) {
        console.warn("Lỗi khi xóa scene:", error);
      }
    }

    arContainer.replaceChildren();
  }

  async function createScene(card, thisSession) {
    const scene = document.createElement("a-scene");

    scene.setAttribute(
      "mindar-image",
      [
        `imageTargetSrc: ${card.mindUrl}`,
        "autoStart: false",
        "uiLoading: false",
        "uiError: false",
        "uiScanning: false",
        "maxTrack: 1"
      ].join("; ") + ";"
    );

    scene.setAttribute("embedded", "");
    scene.setAttribute("color-space", "sRGB");
    scene.setAttribute(
      "renderer",
      "colorManagement: true; physicallyCorrectLights: true; alpha: true"
    );
    scene.setAttribute("vr-mode-ui", "enabled: false");
    scene.setAttribute(
      "device-orientation-permission-ui",
      "enabled: false"
    );

    scene.style.position = "absolute";
    scene.style.inset = "0";
    scene.style.width = "100%";
    scene.style.height = "100%";

    const camera = document.createElement("a-camera");
    camera.setAttribute("position", "0 0 0");
    camera.setAttribute("look-controls", "enabled: false");

    const target = document.createElement("a-entity");
    target.setAttribute("mindar-image-target", "targetIndex: 0");

    scene.appendChild(camera);
    scene.appendChild(target);
    arContainer.appendChild(scene);

    await waitForSceneLoaded(scene);

    if (thisSession !== sessionId) {
      throw new Error("Phiên quét đã bị thay đổi.");
    }

    const arSystem = scene.systems["mindar-image-system"];

    if (!arSystem) {
      throw new Error("Không tìm thấy MindAR system.");
    }

    currentScene = scene;
    currentArSystem = arSystem;

    // Mỗi scene giữ cố định card được chọn.
    target.addEventListener("targetFound", () => {
      if (
        thisSession !== sessionId ||
        !isRunning ||
        !activeCard ||
        activeCard.id !== card.id
      ) return;

      if (isTargetFound) return;

      isTargetFound = true;

      scanFrame.style.borderColor = "#35e58b";
      hint.textContent = "Đã nhận diện: " + card.name;

      setStatus("Đã nhận diện: " + card.name, "Đang phát video");

      playCardVideo(card, thisSession);
    });

    target.addEventListener("targetLost", () => {
      if (
        thisSession !== sessionId ||
        !activeCard ||
        activeCard.id !== card.id
      ) return;

      isTargetFound = false;
      stopVideo();

      scanFrame.style.borderColor = "rgba(64, 217, 255, .8)";
      hint.textContent = "Đưa đúng card vào giữa khung hình";

      setStatus(
        "Đã mất dấu card",
        "Đang chờ nhận diện lại: " + card.name
      );
    });

    const readyPromise = waitForArReady(scene);

    await arSystem.start();
    await readyPromise;

    if (thisSession !== sessionId) {
      throw new Error("Phiên quét đã bị thay đổi.");
    }
  }

  async function startScanner() {
    if (isRunning) return;

    const selectedId = cardSelect.value;
    const card = cards.find(item => item.id === selectedId);

    if (!card) {
      setStatus("Bạn chưa chọn card", "Hãy chọn card trước khi quét");
      return;
    }

    startButton.disabled = true;
    startButton.textContent = "ĐANG KHỞI ĐỘNG...";

    activeCard = card;
    isRunning = true;
    isTargetFound = false;

    sessionId++;
    const thisSession = sessionId;

    stopVideo();

    startScreen.classList.add("hidden");
    changeButton.classList.remove("show");

    scanFrame.style.borderColor = "rgba(64, 217, 255, .8)";
    hint.textContent = "Đưa card " + card.name + " vào giữa khung hình";

    setStatus(
      "Đang tải nhận diện: " + card.name,
      "Đang khởi động camera..."
    );

    try {
      await destroyCurrentScene();

      if (thisSession !== sessionId) return;

      await createScene(card, thisSession);

      if (thisSession !== sessionId) return;

      changeButton.classList.add("show");

      setStatus(
        "Sẵn sàng quét: " + card.name,
        "Đưa đúng card vào giữa khung hình"
      );

    } catch (error) {
      console.error("Lỗi khởi động Scanner:", error);

      if (thisSession !== sessionId) return;

      isRunning = false;
      activeCard = null;

      await destroyCurrentScene();

      startScreen.classList.remove("hidden");

      setStatus(
        "Không thể khởi động Scanner",
        error.message || "Vui lòng kiểm tra camera và file .mind"
      );
    } finally {
      startButton.disabled = false;
      startButton.textContent = "BẮT ĐẦU QUÉT";
    }
  }

  async function changeCard() {
    if (!isRunning) return;

    isRunning = false;
    isTargetFound = false;
    sessionId++;

    stopVideo();

    changeButton.classList.remove("show");

    setStatus("Đang dừng camera...", "Chuẩn bị chọn card khác");

    await destroyCurrentScene();

    activeCard = null;

    scanFrame.style.borderColor = "rgba(64, 217, 255, .8)";
    hint.textContent = "Chọn card rồi đưa vào giữa khung hình";

    startScreen.classList.remove("hidden");

    setStatus(
      "Đã dừng quét",
      "Chọn card khác nếu muốn tiếp tục"
    );
  }

  soundButton.addEventListener("click", async () => {
    soundEnabled = !soundEnabled;
    video.muted = !soundEnabled;

    soundButton.textContent = soundEnabled
      ? "🔊 Tắt âm thanh"
      : "🔇 Bật âm thanh";

    if (soundEnabled && videoLayer.classList.contains("show")) {
      try {
        await video.play();
      } catch (error) {
        console.warn("Không thể bật âm thanh:", error);
      }
    }
  });

  startButton.addEventListener("click", startScanner);
  changeButton.addEventListener("click", changeCard);

  // Tải danh sách card khi mở trang.
  async function initializeScanner() {
    try {
      cards = await loadCards();
      populateCardSelect();

      if (!cards.length) {
        setStatus(
          "Chưa có card hợp lệ",
          "Kiểm tra mindUrl và videoUrl trong Admin"
        );
        $("hint").textContent = "Chưa có card để quét";
        return;
      }

      setStatus(
        "Đã tải " + cards.length + " card",
        "Chọn card muốn quét"
      );

      hint.textContent = "Chọn card rồi đưa vào giữa khung hình";

    } catch (error) {
      console.error("Lỗi tải card:", error);

      setStatus(
        "Không tải được danh sách card",
        error.message
      );

      cardSelect.replaceChildren();

      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Lỗi tải dữ liệu";
      cardSelect.append(option);

      startButton.disabled = true;
    }
  }

  window.addEventListener("beforeunload", () => {
    sessionId++;
    stopVideo();

    if (currentArSystem) {
      try {
        currentArSystem.stop();
      } catch (error) {
        console.warn(error);
      }
    }
  });

  initializeScanner();
</script>
</body>
</html>
