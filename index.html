
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
  color:#f3f6ff;
  font-family:Arial,sans-serif;
  padding:16px 12px 30px;
}
.wrap{max-width:760px;margin:auto}
.header{text-align:center;margin:15px 0 20px}
.header h1{font-size:25px;letter-spacing:.5px}
.header p{color:#91a3bf;font-size:13px;margin-top:9px}
.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:14px;
  margin-bottom:15px;
}
.camera{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:4/3;
  min-height:300px;
  background:#050a13;
  border-radius:13px;
}
#arScene{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
}
#arScene canvas{
  width:100%!important;
  height:100%!important;
}
.scan-frame{
  position:absolute;
  z-index:5;
  inset:12%;
  border:2px solid rgba(255,255,255,.65);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.10);
}
.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
}
.status.error{color:#ff8998}
.status.success{color:#6de3ac}
.controls{display:flex;gap:9px;margin-top:12px}
button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px 9px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer;
}
button:disabled{opacity:.5}
.primary{background:linear-gradient(135deg,#438fe9,#396ce0)}
.result{
  display:none;
  margin-top:14px;
  padding:13px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b;
  text-align:center;
}
.result h2{font-size:16px;margin-bottom:6px}
.result p{font-size:12px;color:#a9bbd5}
.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:18px;
  line-height:1.6;
}
</style>

<!-- Nạp A-Frame trước, sau đó MindAR -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
<main class="wrap">

<header class="header">
  <h1>AR CARD SCANNER</h1>
  <p>Đưa mặt trước lá bài vào camera để xem video</p>
</header>

<section class="panel">
  <div class="camera">

    <a-scene
      id="arScene"
      embedded
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        maxTrack: 1;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
      "
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets id="arAssets" timeout="30000"></a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- Mục tiêu được khai báo sẵn, không tạo động -->
      <a-entity
        id="cardTarget"
        mindar-image-target="targetIndex: 0">
      </a-entity>

    </a-scene>

    <div class="scan-frame"></div>
  </div>

  <div id="status" class="status">
    Đang tải hệ thống...
  </div>

  <div class="controls">
    <button id="startButton" class="primary">
      Bắt đầu quét
    </button>
    <button id="stopButton" disabled>
      Dừng camera
    </button>
  </div>

  <div class="controls">
    <button id="audioButton">
      Bật âm thanh
    </button>
  </div>

  <section id="result" class="result">
    <h2 id="resultName"></h2>
    <p>Đã nhận diện lá bài thành công!</p>
  </section>
</section>

<p class="footer">
  Đặt mặt trước lá bài trong khung hình, đủ ánh sáng và tránh bị lóa.
  Giữ camera cách thẻ khoảng 15–30 cm.
</p>

</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG - GIỮ NGUYÊN */
const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

const statusBox = document.getElementById("status");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const audioButton = document.getElementById("audioButton");
const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");

const sceneEl = document.getElementById("arScene");
const assetsEl = document.getElementById("arAssets");
const targetEl = document.getElementById("cardTarget");

let db;
let arSystem;
let card;
let video;
let initialized = false;
let arStarted = false;
let audioEnabled = false;
let targetFound = false;

/* STATUS */
function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* WAIT FOR A-FRAME */
function waitForScene(){
  return new Promise(resolve=>{
    if(sceneEl.hasLoaded){
      resolve();
    }else{
      sceneEl.addEventListener("loaded",resolve,{once:true});
    }
  });
}

/* LOAD IMAGE RATIO */
function getImageRatio(url){
  return new Promise(resolve=>{
    const img = new Image();
    const timeout = setTimeout(()=>resolve(0.7),10000);

    img.onload = ()=>{
      clearTimeout(timeout);
      resolve(
        img.naturalWidth && img.naturalHeight
          ? img.naturalHeight/img.naturalWidth
          : 0.7
      );
    };

    img.onerror = ()=>{
      clearTimeout(timeout);
      resolve(0.7);
    };

    img.src = url;
  });
}

/* LOAD ONE CARD FROM FIREBASE */
async function loadOneCard(){
  setStatus("Đang kết nối Firebase...");

  const snapshot = await getDocs(collection(db,"cards"));
  const loaded = [];

  snapshot.forEach(doc=>{
    const data = doc.data();

    const imageUrl =
      data.imageUrl ||
      (Array.isArray(data.imageUrls) ? data.imageUrls[0] : "");

    if(imageUrl && data.videoUrl){
      loaded.push({
        id:doc.id,
        ...data,
        imageUrl
      });
    }
  });

  if(loaded.length===0){
    throw new Error(
      "Không tìm thấy thẻ có đủ imageUrl và videoUrl trong Firebase."
    );
  }

  if(loaded.length>1){
    throw new Error(
      "Hiện có "+loaded.length+
      " thẻ trong Firebase. Bản thử nghiệm này cần giữ lại đúng 1 thẻ có ảnh đã biên dịch."
    );
  }

  card = loaded[0];

  console.log("Thẻ thử nghiệm:",card);

  return card;
}

/* WAIT FOR VIDEO METADATA */
function waitForVideoMetadata(element){
  return new Promise((resolve,reject)=>{
    if(element.readyState>=1){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("Video tải quá lâu. Hãy kiểm tra videoUrl."));
    },20000);

    function cleanup(){
      clearTimeout(timeout);
      element.removeEventListener("loadedmetadata",success);
      element.removeEventListener("error",failed);
    }

    function success(){
      cleanup();
      resolve();
    }

    function failed(){
      cleanup();
      reject(new Error("Không tải được video từ đường dẫn videoUrl."));
    }

    element.addEventListener("loadedmetadata",success);
    element.addEventListener("error",failed);
    element.load();
  });
}

/* PREPARE VIDEO AND TARGET */
async function prepareAR(){
  setStatus("Đang chuẩn bị thẻ và video...");

  video = document.createElement("video");
  video.id = "arVideo";
  video.crossOrigin = "anonymous";
  video.preload = "auto";
  video.loop = true;
  video.muted = true;
  video.playsInline = true;

  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.setAttribute("crossorigin","anonymous");

  assetsEl.appendChild(video);

  video.src = card.videoUrl;

  await waitForVideoMetadata(video);

  const cardHeight = await getImageRatio(card.imageUrl);

  const plane = document.createElement("a-video");
  plane.setAttribute("src","#arVideo");
  plane.setAttribute("position","0 0 0.01");
  plane.setAttribute("width","1");
  plane.setAttribute("height",String(cardHeight));
  plane.setAttribute(
    "material",
    "shader: flat; side: double"
  );

  targetEl.appendChild(plane);

  targetEl.addEventListener("targetFound",onTargetFound);
  targetEl.addEventListener("targetLost",onTargetLost);

  setStatus(
    "Đã chuẩn bị thẻ: "+(card.name || "Card")+
    ". Nhấn Bắt đầu quét."
  );
}

/* TARGET FOUND */
async function onTargetFound(){
  targetFound = true;

  resultName.textContent = card.name || "Card AR";
  resultBox.style.display = "block";

  video.muted = !audioEnabled;

  try{
    await video.play();

    setStatus(
      "Đã nhận diện: "+(card.name || "Card AR"),
      "success"
    );
  }catch(error){
    console.error("Video playback error:",error);

    setStatus(
      "Đã nhận diện thẻ nhưng video chưa phát được. Kiểm tra đường dẫn video.",
      "error"
    );
  }
}

/* TARGET LOST */
function onTargetLost(){
  targetFound = false;

  if(video){
    video.pause();
  }

  resultBox.style.display = "none";

  setStatus(
    "Đã mất dấu thẻ. Đưa lá bài vào khung hình để quét tiếp."
  );
}

/* START AR */
async function startAR(){
  try{
    startButton.disabled = true;

    if(!initialized){
      setStatus("Đang khởi tạo Firebase và MindAR...");

      await waitForScene();

      db = getFirestore(initializeApp(firebaseConfig));

      await loadOneCard();
      await prepareAR();

      initialized = true;
    }

    arSystem = sceneEl.systems["mindar-image-system"];

    if(!arSystem){
      throw new Error("Không tìm thấy MindAR Image System.");
    }

    setStatus("Đang mở camera. Hãy cấp quyền truy cập...");

    const readyPromise = new Promise((resolve,reject)=>{
      const timeout = setTimeout(()=>{
        cleanup();
        reject(new Error("MindAR khởi động quá lâu."));
      },30000);

      function cleanup(){
        clearTimeout(timeout);
        sceneEl.removeEventListener("arReady",ready);
        sceneEl.removeEventListener("arError",failed);
      }

      function ready(){
        cleanup();
        resolve();
      }

      function failed(event){
        cleanup();
        reject(new Error("MindAR không thể mở camera."));
      }

      sceneEl.addEventListener("arReady",ready);
      sceneEl.addEventListener("arError",failed);
    });

    await arSystem.start();
    await readyPromise;

    arStarted = true;
    stopButton.disabled = false;

    setStatus(
      "Camera đã sẵn sàng. Hãy đưa đúng mặt trước thẻ vào khung hình."
    );

  }catch(error){
    console.error("Start AR error:",error);

    setStatus(
      "Không thể bắt đầu: "+error.message,
      "error"
    );

    startButton.disabled = false;
    stopButton.disabled = true;
  }
}

/* STOP AR */
function stopAR(){
  try{
    if(arSystem){
      arSystem.stop();
    }
  }catch(error){
    console.warn(error);
  }

  if(video){
    video.pause();
  }

  arStarted = false;
  targetFound = false;

  resultBox.style.display = "none";

  startButton.disabled = false;
  stopButton.disabled = true;

  setStatus("Camera đã dừng.");
}

/* AUDIO */
audioButton.addEventListener("click",async()=>{
  audioEnabled = !audioEnabled;

  audioButton.textContent = audioEnabled
    ? "Tắt âm thanh"
    : "Bật âm thanh";

  if(video){
    video.muted = !audioEnabled;

    if(audioEnabled && targetFound){
      try{
        await video.play();
      }catch(error){
        console.warn("Không bật được âm thanh:",error);
        setStatus(
          "Không thể bật âm thanh. Hãy chạm nút lần nữa.",
          "error"
        );
      }
    }
  }
});

/* BUTTONS */
startButton.addEventListener("click",startAR);
stopButton.addEventListener("click",stopAR);

/* CLEANUP */
window.addEventListener("pagehide",()=>{
  try{
    if(arSystem){
      arSystem.stop();
    }
  }catch(error){
    console.warn(error);
  }

  if(video){
    video.pause();
  }
});

/* INITIAL STATUS */
waitForScene().then(()=>{
  setStatus("MindAR đã tải. Nhấn Bắt đầu quét để mở camera.");
}).catch(error=>{
  console.error(error);
  setStatus("Không tải được hệ thống AR.", "error");
});
</script>

</body>
</html>
