
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Card Scanner</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080b12;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #080b12;
    }

    header {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #202838;
      background: #101725;
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span { color: #40d9ff; }

    .sound-button {
      border: 1px solid #344258;
      color: #fff;
      background: #1b2638;
      border-radius: 20px;
      padding: 9px 14px;
      cursor: pointer;
    }

    .camera-area {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #arContainer,
    #arContainer a-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #arContainer canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #arContainer video {
      object-fit: cover !important;
    }

    .scan-frame {
      position: absolute;
      width: min(72vw, 330px);
      height: min(72vw, 330px);
      max-height: 45%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(64, 217, 255, .8);
      border-radius: 22px;
      box-shadow: 0 0 25px rgba(64, 217, 255, .12);
      pointer-events: none;
      z-index: 3;
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #40d9ff;
      border-style: solid;
    }

    .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-radius: 12px 0 0; }
    .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-radius: 0 12px 0 0; }
    .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-radius: 0 0 0 12px; }
    .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-radius: 0 0 12px; }

    .hint {
      position: absolute;
      top: calc(50% + min(36vw, 165px) + 25px);
      left: 15px;
      right: 15px;
      text-align: center;
      color: #d5e5f4;
      font-size: 14px;
      z-index: 4;
      text-shadow: 0 2px 5px #000;
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 18, 30, .85);
      border: 1px solid #304158;
      border-radius: 30px;
      padding: 9px 16px;
      font-size: 13px;
      white-space: nowrap;
      z-index: 5;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-layer {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 6;
      align-items: center;
      justify-content: center;
    }

    .video-layer.show { display: flex; }

    #arVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-name {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 18px;
      text-align: center;
      font-size: 15px;
      color: white;
      text-shadow: 0 2px 6px #000;
      pointer-events: none;
    }

    footer {
      flex-shrink: 0;
      min-height: 76px;
      padding: 13px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: #101725;
      border-top: 1px solid #202838;
      z-index: 10;
    }

    #mainStatus {
      font-size: 14px;
      font-weight: bold;
      color: #40d9ff;
    }

    #subStatus {
      font-size: 12px;
      color: #8c9bb0;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      background: #080b12;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 25px;
      text-align: center;
      gap: 16px;
    }

    .start-screen h2 { font-size: 24px; }

    .start-screen p {
      color: #9baabe;
      font-size: 14px;
      line-height: 1.6;
    }

    .start-button {
      border: none;
      background: #22c8ef;
      color: #061018;
      font-weight: bold;
      font-size: 16px;
      padding: 14px 30px;
      border-radius: 30px;
      margin-top: 8px;
      cursor: pointer;
    }

    .start-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
<div class="app">

  <header>
    <div class="logo">AR <span>CARD</span></div>
    <button class="sound-button" id="soundButton">🔇 Bật âm thanh</button>
  </header>

  <main class="camera-area">
    <div id="arContainer"></div>

    <div class="scan-frame" id="scanFrame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

    <div class="status" id="status">Đang tải danh sách card...</div>

    <div class="hint" id="hint">
      Đưa bất kỳ card nào vào giữa khung hình
    </div>

    <div class="video-layer" id="videoLayer">
      <video id="arVideo" playsinline webkit-playsinline></video>
      <div class="video-name" id="videoName"></div>
    </div>

    <div class="start-screen" id="startScreen">
      <h2>AR Card Scanner</h2>
      <p>
        Hệ thống tự động nhận diện tất cả card.<br>
        Đưa bất kỳ card nào vào trước camera.
      </p>
      <button class="start-button" id="startButton" disabled>
        ĐANG TẢI CARD...
      </button>
    </div>
  </main>

  <footer>
    <div id="mainStatus">Đang tải dữ liệu</div>
    <div id="subStatus">Đang kết nối Firestore</div>
  </footer>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

const arContainer = $("arContainer");
const video = $("arVideo");
const videoLayer = $("videoLayer");
const videoName = $("videoName");
const startScreen = $("startScreen");
const startButton = $("startButton");
const statusEl = $("status");
const mainStatus = $("mainStatus");
const subStatus = $("subStatus");
const hint = $("hint");
const scanFrame = $("scanFrame");
const soundButton = $("soundButton");

let cards = [];
let scene = null;
let arSystem = null;
let mindUrl = null;
let running = false;
let soundEnabled = false;
let activeCardId = null;
let videoToken = 0;
let lostTimer = null;

function setStatus(message, detail = "") {
  statusEl.textContent = message;
  mainStatus.textContent = message;
  subStatus.textContent = detail;
}

function stopVideo() {
  videoToken++;
  clearTimeout(lostTimer);

  video.pause();
  video.onended = null;
  video.onerror = null;
  video.oncanplay = null;
  video.removeAttribute("src");
  video.load();

  videoLayer.classList.remove("show");
  videoName.textContent = "";
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";

    img.onload = () => resolve(img);
    img.onerror = () => reject(
      new Error("Không tải được ảnh card. Kiểm tra imageUrl/CORS: " + url)
    );

    img.src = url;
  });
}

async function loadCards() {
  const snapshot = await getDocs(collection(db, "cards"));
  const result = [];

  snapshot.forEach(docSnap => {
    const data = docSnap.data();

    const imageUrl = typeof data.imageUrl === "string"
      ? data.imageUrl.trim() : "";

    const videoUrl = typeof data.videoUrl === "string"
      ? data.videoUrl.trim() : "";

    if (
      !imageUrl.startsWith("https://") ||
      !videoUrl.startsWith("https://")
    ) {
      console.warn("Bỏ qua card thiếu imageUrl/videoUrl:", docSnap.id);
      return;
    }

    result.push({
      id: docSnap.id,
      name: data.name || "Thẻ AR",
      imageUrl,
      videoUrl
    });
  });

  return result;
}

async function compileAllCards() {
  const Compiler = window.MINDAR?.IMAGE?.Compiler;

  if (!Compiler) {
    throw new Error(
      "Không tìm thấy MindAR Compiler. Không thể tạo bộ nhận diện chung."
    );
  }

  const compiler = new Compiler();
  const images = [];

  for (let i = 0; i < cards.length; i++) {
    setStatus(
      `Đang tải ảnh ${i + 1}/${cards.length}`,
      cards[i].name
    );

    images.push(await loadImage(cards[i].imageUrl));
  }

  setStatus("Đang biên dịch ảnh card...", "Vui lòng giữ trang mở");

  await compiler.compileImageTargets(images, progress => {
    setStatus(
      "Đang biên dịch: " + Math.round(progress) + "%",
      cards.length + " card"
    );
  });

  const buffer = await compiler.exportData();

  return URL.createObjectURL(
    new Blob([buffer], { type: "application/octet-stream" })
  );
}

function waitSceneLoaded(el) {
  return new Promise((resolve, reject) => {
    if (el.hasLoaded) return resolve();

    const timer = setTimeout(() => {
      reject(new Error("A-Frame khởi tạo quá thời gian."));
    }, 20000);

    el.addEventListener("loaded", () => {
      clearTimeout(timer);
      resolve();
    }, { once: true });
  });
}

function waitArReady(el) {
  return new Promise((resolve, reject) => {
    let done = false;

    const timer = setTimeout(() => {
      finish(reject, new Error(
        "Không nhận được tín hiệu camera. Kiểm tra quyền camera và HTTPS."
      ));
    }, 30000);

    function cleanup() {
      clearTimeout(timer);
      el.removeEventListener("arReady", ready);
      el.removeEventListener("arError", error);
    }

    function finish(callback, value) {
      if (done) return;
      done = true;
      cleanup();
      callback(value);
    }

    function ready() {
      finish(resolve);
    }

    function error(event) {
      finish(reject, new Error(
        event.detail?.error || "MindAR không thể khởi động camera."
      ));
    }

    el.addEventListener("arReady", ready);
    el.addEventListener("arError", error);
  });
}

async function playCard(card) {
  if (!running || activeCardId !== card.id) return;

  const token = ++videoToken;

  video.pause();
  video.removeAttribute("src");
  video.load();

  video.src = card.videoUrl;
  video.muted = !soundEnabled;
  video.loop = false;
  video.playsInline = true;

  videoName.textContent = card.name;

  videoLayer.classList.add("show");

  video.onerror = () => {
    if (token !== videoToken) return;

    videoLayer.classList.remove("show");
    setStatus("Không tải được video", "Kiểm tra videoUrl trong Admin");
  };

  video.onended = () => {
    if (token !== videoToken) return;
    setStatus("Video đã phát xong", "Giữ card trước camera để quét");
  };

  try {
    await video.play();

    if (token !== videoToken || !running) {
      video.pause();
      return;
    }

    setStatus("Đã nhận diện: " + card.name, "Đang phát video");
  } catch (error) {
    if (token !== videoToken) return;

    console.warn("Không tự phát được video:", error);
    setStatus(
      "Đã nhận diện: " + card.name,
      "Trình duyệt chặn tự phát video có âm thanh"
    );
  }
}

function createTargetEvents(target, card) {
  target.addEventListener("targetFound", () => {
    if (!running) return;

    clearTimeout(lostTimer);

    if (activeCardId === card.id) return;

    // Nếu đang nhận diện card khác, không đổi video liên tục.
    if (activeCardId !== null) return;

    activeCardId = card.id;

    scanFrame.style.borderColor = "#35e58b";
    hint.textContent = "Đã nhận diện: " + card.name;

    playCard(card);
  });

  target.addEventListener("targetLost", () => {
    if (activeCardId !== card.id) return;

    // Chờ một chút để tránh mất dấu thoáng qua làm video bị ngắt.
    clearTimeout(lostTimer);

    lostTimer = setTimeout(() => {
      if (activeCardId !== card.id) return;

      activeCardId = null;
      stopVideo();

      scanFrame.style.borderColor = "rgba(64, 217, 255, .8)";
      hint.textContent = "Đưa card tiếp theo vào khung hình";

      setStatus("Đang tìm card...", "Đưa bất kỳ card nào vào camera");
    }, 700);
  });
}

async function createScanner() {
  scene = document.createElement("a-scene");

  scene.setAttribute("mindar-image", [
    "imageTargetSrc: " + mindUrl,
    "autoStart: false",
    "uiLoading: false",
    "uiError: false",
    "uiScanning: false",
    "maxTrack: 1"
  ].join("; ") + ";");

  scene.setAttribute("embedded", "");
  scene.setAttribute("color-space", "sRGB");
  scene.setAttribute(
    "renderer",
    "colorManagement: true; physicallyCorrectLights: true; alpha: true"
  );
  scene.setAttribute("vr-mode-ui", "enabled: false");
  scene.setAttribute("device-orientation-permission-ui", "enabled: false");

  Object.assign(scene.style, {
    position: "absolute",
    inset: "0",
    width: "100%",
    height: "100%"
  });

  const camera = document.createElement("a-camera");
  camera.setAttribute("position", "0 0 0");
  camera.setAttribute("look-controls", "enabled: false");
  scene.appendChild(camera);

  cards.forEach((card, index) => {
    const target = document.createElement("a-entity");

    target.setAttribute(
      "mindar-image-target",
      "targetIndex: " + index
    );

    createTargetEvents(target, card);
    scene.appendChild(target);
  });

  arContainer.replaceChildren(scene);

  await waitSceneLoaded(scene);

  arSystem = scene.systems["mindar-image-system"];

  if (!arSystem) {
    throw new Error("Không tìm thấy MindAR system.");
  }

  const readyPromise = waitArReady(scene);

  await arSystem.start();
  await readyPromise;
}

async function startScanner() {
  if (running) return;

  startButton.disabled = true;
  startButton.textContent = "ĐANG MỞ CAMERA...";

  try {
    if (!mindUrl || !cards.length) {
      throw new Error("Chưa có bộ nhận diện card.");
    }

    stopVideo();
    activeCardId = null;

    setStatus("Đang mở camera...", "Vui lòng cho phép truy cập camera");

    await createScanner();

    running = true;
    startScreen.classList.add("hidden");

    setStatus(
      "Scanner đã sẵn sàng",
      "Đưa bất kỳ card nào vào giữa khung hình"
    );

    hint.textContent = "Đưa card vào giữa khung hình";

  } catch (error) {
    console.error("Scanner error:", error);

    running = false;

    if (arSystem) {
      try { await arSystem.stop(); } catch (e) {
        console.warn(e);
      }
    }

    if (scene) scene.remove();

    scene = null;
    arSystem = null;

    setStatus("Không khởi động được Scanner", error.message);
    startScreen.classList.remove("hidden");

  } finally {
    startButton.disabled = false;
    startButton.textContent = "BẮT ĐẦU QUÉT";
  }
}

soundButton.addEventListener("click", async () => {
  soundEnabled = !soundEnabled;
  video.muted = !soundEnabled;

  soundButton.textContent = soundEnabled
    ? "🔊 Tắt âm thanh"
    : "🔇 Bật âm thanh";

  if (soundEnabled && videoLayer.classList.contains("show")) {
    try {
      await video.play();
    } catch (error) {
      console.warn(error);
    }
  }
});

startButton.addEventListener("click", startScanner);

async function initializeScanner() {
  try {
    setStatus("Đang tải danh sách card...", "Đang kết nối Firestore");

    cards = await loadCards();

    if (!cards.length) {
      throw new Error(
        "Không có card hợp lệ. Kiểm tra imageUrl và videoUrl trong Admin."
      );
    }

    setStatus(
      "Đã tải " + cards.length + " card",
      "Đang chuẩn bị bộ nhận diện"
    );

    mindUrl = await compileAllCards();

    startButton.disabled = false;
    startButton.textContent = "BẮT ĐẦU QUÉT";

    setStatus(
      "Đã chuẩn bị " + cards.length + " card",
      "Nhấn BẮT ĐẦU QUÉT để mở camera"
    );

    hint.textContent = "Đưa bất kỳ card nào vào giữa khung hình";

  } catch (error) {
    console.error("Lỗi chuẩn bị Scanner:", error);

    setStatus("Lỗi chuẩn bị Scanner", error.message);

    startButton.disabled = true;
    startButton.textContent = "LỖI TẢI CARD";
  }
}

window.addEventListener("beforeunload", () => {
  running = false;
  stopVideo();

  if (arSystem) {
    try { arSystem.stop(); } catch (error) {
      console.warn(error);
    }
  }

  if (mindUrl) URL.revokeObjectURL(mindUrl);
});

initializeScanner();
</script>
</body>
</html>
