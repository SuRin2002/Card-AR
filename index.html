
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AR Card Scanner</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:white}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#arScene{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#arScene canvas{width:100%!important;height:100%!important;object-fit:cover}
#arScene video{object-fit:cover!important}
#panel{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.82));text-align:center;pointer-events:none}
#status{font-size:14px;line-height:1.5;margin-bottom:12px;text-shadow:0 1px 4px #000}
#startBtn{pointer-events:auto;border:0;border-radius:999px;padding:14px 28px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
#startBtn:disabled{opacity:.55}
#stopBtn{pointer-events:auto;border:0;border-radius:999px;padding:12px 22px;margin-left:8px;background:#fff;color:#172033;font-size:14px;font-weight:bold;cursor:pointer;display:none}
#topLabel{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;text-align:center;background:linear-gradient(rgba(0,0,0,.55),transparent);font-size:14px}
#arVideo{display:none}
#errorBox{display:none;position:absolute;z-index:10;left:16px;right:16px;top:50%;transform:translateY(-50%);padding:18px;border-radius:12px;background:#fff;color:#b91c1c;font-size:14px;line-height:1.6;white-space:pre-wrap}
</style>
</head>

<body>
<div id="app">
  <div id="topLabel">AR CARD SCANNER</div>
  <div id="status">Đang tải danh sách thẻ...</div>

  <a-scene
    id="arScene"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true"
  >
    <a-assets>
      <video id="arVideo" playsinline webkit-playsinline crossorigin="anonymous" muted loop></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

  <div id="panel">
    <div id="statusSpacer"></div>
    <button id="startBtn" disabled>Đang tải...</button>
    <button id="stopBtn">Tắt camera</button>
  </div>
  <div id="errorBox"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain:"ar-card-video.firebaseapp.com",
  projectId:"ar-card-video",
  storageBucket:"ar-card-video.firebasestorage.app",
  messagingSenderId:"725938606795",
  appId:"1:725938606795:web:516149f4210f26344bc14e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

const scene=$("arScene");
const video=$("arVideo");
const startBtn=$("startBtn");
const stopBtn=$("stopBtn");

let cards=[];
let currentCard=null;
let scannerStarted=false;
let sceneConfigured=false;

function setStatus(text){
  $("status").textContent=text;
}

function showError(text){
  $("errorBox").style.display="block";
  $("errorBox").textContent=text;
  setStatus("Đã xảy ra lỗi.");
}

function hideError(){
  $("errorBox").style.display="none";
}

function validHttpsUrl(value){
  try{
    const u=new URL(value);
    return u.protocol==="https:";
  }catch{return false;}
}

async function loadCards(){
  const snap=await getDocs(collection(db,"cards"));
  const result=snap.docs.map(d=>({id:d.id,...d.data()}));

  const valid=result.filter(c=>
    c.imageUrl &&
    c.videoUrl &&
    c.mindUrl &&
    Number.isInteger(c.targetIndex) &&
    c.targetIndex>=0
  );

  if(!valid.length){
    throw new Error(
      "Không tìm thấy card hợp lệ trong Firestore.\n"+
      "Mỗi card cần có imageUrl, videoUrl, mindUrl và targetIndex là số nguyên."
    );
  }

  const indexes=valid.map(c=>c.targetIndex);
  if(new Set(indexes).size!==indexes.length){
    throw new Error("Có card đang bị trùng targetIndex. Hãy sửa targetIndex trong Admin.");
  }

  const mindUrls=[...new Set(valid.map(c=>c.mindUrl))];
  if(mindUrls.length!==1){
    throw new Error(
      "Các card đang dùng nhiều mindUrl khác nhau.\n"+
      "Hãy vào Admin và cập nhật một file .mind dùng chung cho tất cả card."
    );
  }

  if(!validHttpsUrl(mindUrls[0])){
    throw new Error("mindUrl không phải đường dẫn HTTPS hợp lệ.");
  }

  for(const card of valid){
    if(!validHttpsUrl(card.videoUrl)){
      throw new Error(`Link video của card "${card.name||card.id}" không hợp lệ.`);
    }
    if(!(Number(card.ratio)>0)){
      card.ratio=1.54;
    }
  }

  valid.sort((a,b)=>a.targetIndex-b.targetIndex);
  return {cards:valid,mindUrl:mindUrls[0]};
}

function createTarget(card){
  const target=document.createElement("a-entity");
  target.setAttribute("mindar-image-target",`targetIndex: ${card.targetIndex}`);

  const plane=document.createElement("a-video");
  plane.setAttribute("src","#arVideo");
  plane.setAttribute("position","0 0 0");
  plane.setAttribute("rotation","0 0 0");
  plane.setAttribute("width","1");
  plane.setAttribute("height",String(card.ratio||1.54));
  plane.setAttribute("visible","true");
  target.appendChild(plane);

  target.addEventListener("targetFound",()=>{
    playCard(card,plane);
  });

  target.addEventListener("targetLost",()=>{
    if(currentCard?.id===card.id){
      video.pause();
      currentCard=null;
      setStatus("Đưa một thẻ AR vào trước camera để quét.");
    }
  });

  scene.appendChild(target);
}

function playCard(card,plane){
  currentCard=card;

  if(video.dataset.cardId!==card.id){
    video.pause();
    video.src=card.videoUrl;
    video.dataset.cardId=card.id;
    video.load();
  }

  // Cập nhật kích thước video theo tỉ lệ đã lưu của card.
  plane.setAttribute("width","1");
  plane.setAttribute("height",String(card.ratio||1.54));

  video.muted=true;
  const playPromise=video.play();

  if(playPromise){
    playPromise.then(()=>{
      setStatus("Đang phát video: "+(card.name||"Card"));
    }).catch(error=>{
      console.warn("Không thể tự phát video:",error);
      setStatus("Đã nhận diện "+(card.name||"card")+". Chạm màn hình nếu video chưa phát.");
    });
  }else{
    setStatus("Đang phát video: "+(card.name||"Card"));
  }
}

async function startScanner(){
  hideError();
  if(scannerStarted)return;

  try{
    startBtn.disabled=true;
    startBtn.textContent="Đang mở camera...";
    setStatus("Đang khởi động camera...");

    const system=scene.systems["mindar-image-system"];
    if(!system)throw new Error("MindAR chưa khởi tạo. Hãy tải lại trang.");

    await system.start();
    scannerStarted=true;
    startBtn.style.display="none";
    stopBtn.style.display="inline-block";
    setStatus("Đưa card vào trước camera để nhận diện.");
  }catch(error){
    console.error(error);
    showError("Không thể mở camera.\n"+(error.message||error));
    startBtn.disabled=false;
    startBtn.textContent="Thử mở camera lại";
  }
}

async function stopScanner(){
  try{
    const system=scene.systems["mindar-image-system"];
    if(system)await system.stop();
  }catch(error){
    console.warn("Lỗi khi tắt camera:",error);
  }

  scannerStarted=false;
  currentCard=null;
  video.pause();
  video.removeAttribute("src");
  video.dataset.cardId="";
  video.load();

  stopBtn.style.display="none";
  startBtn.style.display="inline-block";
  startBtn.disabled=false;
  startBtn.textContent="Bắt đầu quét AR";
  setStatus("Camera đã tắt.");
}

startBtn.addEventListener("click",startScanner);
stopBtn.addEventListener("click",stopScanner);

async function initializeScanner(){
  try{
    setStatus("Đang tải dữ liệu card từ Firebase...");
    const data=await loadCards();
    cards=data.cards;

    // Tạo tất cả target trước khi người dùng bật camera.
    cards.forEach(createTarget);

    // MindAR sử dụng một file .mind duy nhất cho toàn bộ target.
    scene.setAttribute("mindar-image",{
      imageTargetSrc:data.mindUrl,
      autoStart:false,
      maxTrack:1
    });

    scene.addEventListener("arReady",()=>{
      setStatus("Camera sẵn sàng. Đưa card vào trước camera.");
    });

    scene.addEventListener("arError",event=>{
      console.error("MindAR error:",event);
      showError("MindAR không thể khởi động. Kiểm tra file .mind và quyền camera.");
    });

    sceneConfigured=true;
    startBtn.disabled=false;
    startBtn.textContent="Bắt đầu quét AR";
    setStatus(`Đã tải ${cards.length} card. Nhấn bắt đầu để mở camera.`);
  }catch(error){
    console.error(error);
    showError(error.message||"Không thể tải dữ liệu card.");
    startBtn.disabled=true;
    startBtn.textContent="Chưa thể quét AR";
  }
}

initializeScanner();
</script>
</body>
</html>
