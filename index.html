<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  background:#0b1020;
  color:#f3f6ff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  padding:12px 12px 25px;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
}

.wrap{
  max-width:760px;
  margin:auto;
}

.header{
  text-align:center;
  margin:12px 0 16px;
}

.header h1{
  font-size:25px;
  letter-spacing:.5px;
}

.header p{
  color:#91a3bf;
  font-size:13px;
  margin-top:8px;
}

.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:12px;
  margin-bottom:15px;
}

/* CAMERA DỌC */
.camera{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  width:min(100%,420px);
  aspect-ratio:9/16;
  max-height:75svh;
  margin:auto;
  background:#050a13;
  border-radius:13px;
}

/* VIDEO CAMERA THẬT CỦA MINDAR */
.camera video:not(#arVideo){
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  z-index:0!important;
  display:block!important;
}

/* LỚP A-FRAME TRONG SUỐT */
#arScene{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}

#arScene canvas.a-canvas{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}

/* KHUNG HƯỚNG DẪN QUÉT */
.scan-frame{
  position:absolute;
  z-index:5;
  inset:12%;
  border:2px solid rgba(255,255,255,.65);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.10);
}

/* TRẠNG THÁI */
.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
}

.status.error{
  color:#ff8998;
}

.status.success{
  color:#6de3ac;
}

/* ÂM THANH */
.audio-control{
  margin-top:12px;
  text-align:center;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 24px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer;
}

/* KẾT QUẢ */
.result{
  display:none;
  margin-top:12px;
  padding:13px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b;
  text-align:center;
}

.result h2{
  font-size:16px;
  margin-bottom:6px;
}

.result p{
  font-size:12px;
  color:#a9bbd5;
}

.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:16px;
  line-height:1.6;
}

@media(max-height:650px){
  .camera{
    max-height:65svh;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <header class="header">
    <h1>AR CARD SCANNER</h1>
    <p>Đưa mặt trước lá bài vào camera để xem video</p>
  </header>

  <section class="panel">

    <div class="camera" id="cameraBox">
      <div class="scan-frame"></div>
    </div>

    <div id="status" class="status">
      Đang khởi động hệ thống AR...
    </div>

    <div class="audio-control">
      <button id="audioButton">Bật âm thanh</button>
    </div>

    <section id="result" class="result">
      <h2 id="resultName"></h2>
      <p>Đã nhận diện lá bài thành công!</p>
    </section>

  </section>

  <p class="footer">
    Đưa mặt trước lá bài vào khung hình.
    Giữ điện thoại ổn định, đủ ánh sáng và tránh bị lóa.
  </p>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG - GIỮ NGUYÊN */

const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

/* ELEMENTS */

const cameraBox = document.getElementById("cameraBox");
const statusBox = document.getElementById("status");
const audioButton = document.getElementById("audioButton");
const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");

let db;
let sceneEl;
let videoEl;
let arSystem;

let cards = [];
let audioEnabled = false;
let activeCardId = null;
let playVersion = 0;
let initialized = false;
let starting = false;

/* STATUS */

function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* LOAD SCRIPT IN ORDER */

function loadScript(src){

  return new Promise((resolve,reject)=>{

    const script = document.createElement("script");

    script.src = src;
    script.onload = resolve;

    script.onerror = ()=>{
      reject(new Error("Không tải được thư viện: "+src));
    };

    document.head.appendChild(script);

  });

}

/* WAIT FOR A-FRAME SCENE */

function waitForScene(){

  return new Promise((resolve,reject)=>{

    if(sceneEl.hasLoaded){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{
      reject(new Error("A-Frame khởi tạo quá lâu."));
    },20000);

    sceneEl.addEventListener("loaded",()=>{
      clearTimeout(timeout);
      resolve();
    },{once:true});

  });

}

/* MAKE CANVAS TRANSPARENT */

function makeCanvasTransparent(){

  if(!sceneEl || !sceneEl.renderer) return;

  try{

    sceneEl.renderer.setClearColor(0x000000,0);
    sceneEl.renderer.setClearAlpha(0);

    if(sceneEl.canvas){
      sceneEl.canvas.style.background="transparent";
    }

  }catch(error){

    console.warn("Canvas transparency:",error);

  }

}

/* LOAD IMAGE RATIO */

function getImageRatio(url){

  return new Promise(resolve=>{

    const img = new Image();

    const timeout = setTimeout(()=>{
      resolve(0.7);
    },10000);

    img.onload = ()=>{

      clearTimeout(timeout);

      if(img.naturalWidth && img.naturalHeight){
        resolve(img.naturalHeight/img.naturalWidth);
      }else{
        resolve(0.7);
      }

    };

    img.onerror = ()=>{

      clearTimeout(timeout);
      resolve(0.7);

    };

    img.src = url;

  });

}

/* WAIT FOR VIDEO METADATA */

function waitForVideo(){

  return new Promise((resolve,reject)=>{

    if(videoEl.readyState>=1){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{

      cleanup();

      reject(new Error("Video tải quá lâu."));

    },25000);

    function cleanup(){

      clearTimeout(timeout);

      videoEl.removeEventListener("loadedmetadata",success);
      videoEl.removeEventListener("error",failed);

    }

    function success(){

      cleanup();
      resolve();

    }

    function failed(){

      cleanup();

      reject(
        new Error("Không tải được video. Hãy kiểm tra videoUrl.")
      );

    }

    videoEl.addEventListener("loadedmetadata",success);
    videoEl.addEventListener("error",failed);

  });

}

/* LOAD ALL CARDS FROM FIREBASE */

async function loadCards(){

  setStatus("Đang kết nối Firebase...");

  const snapshot = await getDocs(
    collection(db,"cards")
  );

  const loadedCards = [];

  snapshot.forEach(document=>{

    const data = document.data();

    const imageUrl =
      data.imageUrl ||
      (
        Array.isArray(data.imageUrls)
        ? data.imageUrls[0]
        : ""
      );

    if(imageUrl && data.videoUrl){

      loadedCards.push({
        id:document.id,
        ...data,
        imageUrl
      });

    }

  });

  if(loadedCards.length===0){

    throw new Error(
      "Không tìm thấy card nào có đủ imageUrl và videoUrl."
    );

  }

  /* KIỂM TRA MIND URL */

  const mindUrls = [
    ...new Set(
      loadedCards
        .map(card=>(card.mindUrl||"").trim())
        .filter(Boolean)
    )
  ];

  if(mindUrls.length===0){

    throw new Error(
      "Firestore chưa có mindUrl. Hãy cập nhật file .mind trong Admin."
    );

  }

  if(mindUrls.length>1){

    throw new Error(
      "Các card đang có mindUrl khác nhau. Hãy cập nhật một file .mind dùng chung trong Admin."
    );

  }

  const mindUrl = mindUrls[0];

  try{

    const parsed = new URL(mindUrl);

    if(parsed.protocol!=="https:"){
      throw new Error();
    }

  }catch{

    throw new Error("mindUrl không phải đường dẫn HTTPS hợp lệ.");

  }

  /* KIỂM TRA TARGET INDEX */

  for(const card of loadedCards){

    if(
      card.targetIndex===undefined ||
      card.targetIndex===null ||
      card.targetIndex==="" ||
      !Number.isInteger(Number(card.targetIndex)) ||
      Number(card.targetIndex)<0
    ){

      throw new Error(
        'Card "'+(card.name||card.id)+
        '" chưa có targetIndex hợp lệ trong Firestore.'
      );

    }

    card.targetIndex = Number(card.targetIndex);

  }

  /* KIỂM TRA INDEX TRÙNG */

  const usedIndexes = new Set();

  for(const card of loadedCards){

    if(usedIndexes.has(card.targetIndex)){

      throw new Error(
        "Có nhiều card dùng chung targetIndex "+
        card.targetIndex+". Hãy sửa trong Admin."
      );

    }

    usedIndexes.add(card.targetIndex);

  }

  /* SẮP XẾP THEO TARGET INDEX */

  loadedCards.sort((a,b)=>
    a.targetIndex-b.targetIndex
  );

  cards = loadedCards;

  console.log("MindAR URL:",mindUrl);
  console.log("Danh sách card:",cards);

  return {
    cards,
    mindUrl
  };

}

/* CREATE A-FRAME SCENE AFTER FIREBASE DATA IS READY */

function createScene(mindUrl){

  sceneEl = document.createElement("a-scene");

  sceneEl.id = "arScene";

  sceneEl.setAttribute("embedded","");
  sceneEl.setAttribute(
    "mindar-image",
    [
      "imageTargetSrc: "+mindUrl,
      "autoStart: false",
      "maxTrack: 1",
      "uiLoading: no",
      "uiScanning: no",
      "uiError: no"
    ].join("; ")
  );

  sceneEl.setAttribute("color-space","sRGB");

  sceneEl.setAttribute(
    "renderer",
    "alpha: true; antialias: true; colorManagement: true"
  );

  sceneEl.setAttribute("vr-mode-ui","enabled: false");
  sceneEl.setAttribute(
    "device-orientation-permission-ui",
    "enabled: false"
  );

  sceneEl.setAttribute(
    "background",
    "transparent: true"
  );

  /* ASSETS */

  const assetsEl = document.createElement("a-assets");

  assetsEl.setAttribute("timeout","30000");

  videoEl = document.createElement("video");

  videoEl.id = "arVideo";
  videoEl.setAttribute("crossorigin","anonymous");
  videoEl.setAttribute("playsinline","");
  videoEl.setAttribute("webkit-playsinline","");
  videoEl.setAttribute("loop","");
  videoEl.setAttribute("muted","");

  videoEl.muted = true;
  videoEl.loop = true;
  videoEl.playsInline = true;

  assetsEl.appendChild(videoEl);

  sceneEl.appendChild(assetsEl);

  /* CAMERA */

  const cameraEl = document.createElement("a-camera");

  cameraEl.setAttribute("position","0 0 0");
  cameraEl.setAttribute(
    "look-controls",
    "enabled: false"
  );

  sceneEl.appendChild(cameraEl);

  /* CREATE ONE TARGET FOR EACH CARD */

  cards.forEach(card=>{

    const targetEl = document.createElement("a-entity");

    targetEl.id = "cardTarget"+card.targetIndex;

    targetEl.setAttribute(
      "mindar-image-target",
      "targetIndex: "+card.targetIndex
    );

    const planeEl = document.createElement("a-video");

    planeEl.id = "cardVideoPlane"+card.targetIndex;

    planeEl.setAttribute("src","#arVideo");
    planeEl.setAttribute("position","0 0 0.01");
    planeEl.setAttribute("width","1");
    planeEl.setAttribute("height","0.7");

    planeEl.setAttribute(
      "material",
      "shader: flat; side: double"
    );

    targetEl.appendChild(planeEl);

    targetEl.addEventListener(
      "targetFound",
      ()=>onTargetFound(card,planeEl)
    );

    targetEl.addEventListener(
      "targetLost",
      ()=>onTargetLost(card)
    );

    sceneEl.appendChild(targetEl);

  });

  /* ADD SCENE TO CAMERA CONTAINER */

  cameraBox.insertBefore(
    sceneEl,
    cameraBox.querySelector(".scan-frame")
  );

}

/* PREPARE THE SELECTED CARD VIDEO */

async function prepareCard(card,planeEl,version){

  videoEl.pause();

  videoEl.removeAttribute("src");
  videoEl.load();

  videoEl.crossOrigin = "anonymous";
  videoEl.muted = !audioEnabled;
  videoEl.loop = true;
  videoEl.playsInline = true;

  videoEl.src = card.videoUrl;
  videoEl.load();

  await waitForVideo();

  /* IGNORE OLD REQUEST IF ANOTHER CARD WAS FOUND */

  if(version!==playVersion) return false;

  const cardHeight = await getImageRatio(card.imageUrl);

  if(version!==playVersion) return false;

  const videoWidth = videoEl.videoWidth || 16;
  const videoHeight = videoEl.videoHeight || 9;

  const videoRatio = videoWidth/videoHeight;
  const cardRatio = 1/cardHeight;

  let planeWidth = 1;
  let planeHeight = cardHeight;

  /* FIT VIDEO INSIDE CARD */

  if(videoRatio>cardRatio){

    planeWidth = 1;
    planeHeight = 1/videoRatio;

  }else{

    planeHeight = cardHeight;
    planeWidth = cardHeight*videoRatio;

  }

  planeEl.setAttribute("width",planeWidth);
  planeEl.setAttribute("height",planeHeight);

  console.log(
    "Card:",card.name,
    "Target:",card.targetIndex,
    "Video ratio:",videoRatio
  );

  return true;

}

/* TARGET FOUND */

async function onTargetFound(card,planeEl){

  if(activeCardId===card.id) return;

  activeCardId = card.id;

  const thisVersion = ++playVersion;

  resultName.textContent =
    card.name || "Card AR";

  resultBox.style.display = "block";

  setStatus(
    "Đã nhận diện "+(card.name||"Card AR")+
    ". Đang tải video..."
  );

  try{

    const prepared = await prepareCard(
      card,
      planeEl,
      thisVersion
    );

    if(!prepared) return;

    if(activeCardId!==card.id) return;

    videoEl.muted = !audioEnabled;

    await videoEl.play();

    if(
      thisVersion!==playVersion ||
      activeCardId!==card.id
    ){

      videoEl.pause();
      return;

    }

    setStatus(
      "Đã nhận diện: "+(card.name||"Card AR"),
      "success"
    );

  }catch(error){

    console.error("Video play error:",error);

    if(
      thisVersion===playVersion &&
      activeCardId===card.id
    ){

      setStatus(
        "Đã nhận diện thẻ nhưng video không phát được: "+
        error.message,
        "error"
      );

    }

  }

}

/* TARGET LOST - KEEP CAMERA RUNNING */

function onTargetLost(card){

  if(activeCardId!==card.id) return;

  activeCardId = null;

  playVersion++;

  videoEl.pause();

  resultBox.style.display = "none";

  setStatus(
    "Đưa mặt trước lá bài vào khung hình để xem video."
  );

}

/* AUDIO BUTTON */

audioButton.addEventListener("click",async()=>{

  audioEnabled = !audioEnabled;

  audioButton.textContent = audioEnabled
    ? "Tắt âm thanh"
    : "Bật âm thanh";

  if(!videoEl) return;

  videoEl.muted = !audioEnabled;

  if(audioEnabled && activeCardId){

    try{

      await videoEl.play();

    }catch(error){

      console.warn(error);

      setStatus(
        "Không thể bật âm thanh video.",
        "error"
      );

    }

  }

});

/* START AR */

async function initializeAR(){

  if(starting || initialized) return;

  starting = true;

  try{

    setStatus("Đang kết nối Firebase...");

    /* FIREBASE */

    const app = initializeApp(firebaseConfig);

    db = getFirestore(app);

    /* LOAD CARDS AND SHARED MIND URL */

    const result = await loadCards();

    const mindUrl = result.mindUrl;

    /* LOAD A-FRAME FIRST */

    setStatus(
      "Đã tải "+cards.length+
      " card. Đang nạp hệ thống AR..."
    );

    await loadScript(
      "https://aframe.io/releases/1.5.0/aframe.min.js"
    );

    /* LOAD MINDAR AFTER A-FRAME */

    await loadScript(
      "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"
    );

    /* CREATE SCENE USING FIRESTORE MIND URL */

    createScene(mindUrl);

    /* WAIT FOR A-FRAME TO INITIALIZE */

    await waitForScene();

    makeCanvasTransparent();

    /* GET MINDAR SYSTEM */

    arSystem =
      sceneEl.systems["mindar-image-system"];

    if(!arSystem){

      throw new Error(
        "Không tìm thấy MindAR Image System."
      );

    }

    /* LISTEN FOR READY BEFORE STARTING */

    const readyPromise = new Promise((resolve,reject)=>{

      const timeout = setTimeout(()=>{

        cleanup();

        reject(
          new Error("Camera khởi động quá lâu.")
        );

      },35000);

      function cleanup(){

        clearTimeout(timeout);

        sceneEl.removeEventListener(
          "arReady",
          ready
        );

        sceneEl.removeEventListener(
          "arError",
          failed
        );

      }

      function ready(){

        cleanup();
        resolve();

      }

      function failed(event){

        cleanup();

        const detail =
          event?.detail?.error?.message ||
          event?.detail?.message ||
          "MindAR không thể khởi động camera.";

        reject(new Error(detail));

      }

      sceneEl.addEventListener("arReady",ready);
      sceneEl.addEventListener("arError",failed);

    });

    setStatus(
      "Đang mở camera. Vui lòng chờ..."
    );

    /* START CAMERA AND MINDAR */

    await arSystem.start();

    await readyPromise;

    makeCanvasTransparent();

    initialized = true;

    setStatus(
      "Camera đã sẵn sàng. Có "+
      cards.length+
      " card để nhận diện. Hãy đưa thẻ vào khung hình."
    );

    console.log("AR ready.");
    console.log("Cards loaded:",cards.length);
    console.log("Mind file:",mindUrl);

  }catch(error){

    console.error(
      "AR initialization error:",
      error
    );

    setStatus(
      "Lỗi khởi động: "+error.message,
      "error"
    );

  }finally{

    starting = false;

  }

}

/* START WHEN PAGE LOADS */

initializeAR();

/* KHÔNG DỪNG CAMERA KHI TARGET LOST.
   CAMERA CHỈ DỪNG KHI ĐÓNG TRANG. */

</script>

</body>
</html>
