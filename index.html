
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>AR Card Scanner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .scanner {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #29466e;
      border-radius: 24px;
      background: #111c2e;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      color: #9aabc2;
      text-align: center;
      padding: 25px;
      line-height: 1.7;
    }

    .scan-line {
      position: absolute;
      display: none;
      left: 5%;
      right: 5%;
      height: 2px;
      background: #60a5fa;
      box-shadow: 0 0 15px #60a5fa;
      animation: scan 2s infinite alternate;
      pointer-events: none;
    }

    @keyframes scan {
      from { top: 15%; }
      to { top: 85%; }
    }

    .hint {
      margin: 22px 0 12px;
      text-align: center;
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 14px;
    }

    #status {
      color: #60a5fa;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    button, .upload {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: 0;
      border-radius: 14px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      background: linear-gradient(120deg, #2563eb, #6366f1);
    }

    .upload {
      display: block;
      background: #1d2c43;
      border: 1px solid #385477;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #fileInput { display: none; }

    #result {
      display: none;
      width: 100%;
      margin-top: 22px;
    }

    #result img {
      width: 100%;
      max-height: 230px;
      object-fit: contain;
      border-radius: 14px;
      background: #111c2e;
    }

    #resultName {
      text-align: center;
      color: #93c5fd;
      margin: 12px 0;
    }

    #videoPlayer {
      width: 100%;
      border-radius: 14px;
      background: black;
    }

    .stop {
      background: #263449;
    }
  </style>

  <!-- OpenCV -->
  <script>
    window.openCVLoaded = false;

    window.Module = {
      onRuntimeInitialized: function() {
        window.openCVLoaded = true;
        console.log("OpenCV đã sẵn sàng");
      }
    };
  </script>

  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>

<body>
<div class="app">

  <div class="scanner">
    <div class="placeholder" id="placeholder">
      Đưa thẻ vào giữa khung hình<br>
      hoặc tải ảnh thẻ từ thiết bị
    </div>

    <video id="camera" autoplay muted playsinline></video>
    <div class="scan-line" id="scanLine"></div>
  </div>

  <div class="hint">
    Giữ thẻ rõ nét và đủ sáng để hệ thống nhận diện
  </div>

  <div id="status">Camera sẵn sàng.</div>

  <button id="cameraBtn">BẮT ĐẦU QUÉT CAMERA</button>

  <label class="upload" for="fileInput">
    TẢI ẢNH THẺ LÊN
  </label>

  <input type="file" id="fileInput" accept="image/*">

  <button class="stop" id="stopBtn">DỪNG QUÉT</button>

  <div id="result">
    <img id="cardPreview" alt="Ảnh thẻ">
    <div id="resultName"></div>
    <video id="videoPlayer" controls playsinline></video>
  </div>

</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFTvux73x5oAl273PN_0_wwzA1OVvh34c",
    authDomain: "ar-card-video.firebaseapp.com",
    projectId: "ar-card-video",
    storageBucket: "ar-card-video.firebasestorage.app",
    messagingSenderId: "725938606795",
    appId: "1:725938606795:web:516149f4210f26344bc14e"
  };

  const $ = id => document.getElementById(id);

  const camera = $("camera");
  const status = $("status");
  const result = $("result");
  const player = $("videoPlayer");

  let db = null;
  let cv = null;
  let cards = [];
  let cameraStream = null;
  let scanning = false;
  let referenceData = [];
  let lastRecognized = "";
  let lastScan = 0;
  let busy = false;
  let openCVPromise = null;

  function say(message) {
    status.textContent = message;
  }

  // Khởi tạo Firebase
  try {
    const firebaseApp = initializeApp(firebaseConfig);
    db = getFirestore(firebaseApp);
  } catch (error) {
    console.error("Firebase:", error);
    say("Không khởi tạo được Firebase.");
  }

  // Chờ OpenCV
  function waitForOpenCV() {
    if (openCVPromise) return openCVPromise;

    openCVPromise = new Promise((resolve, reject) => {
      let attempts = 0;

      const timer = setInterval(() => {
        attempts++;

        if (
          window.openCVLoaded &&
          window.cv &&
          window.cv.Mat
        ) {
          clearInterval(timer);
          cv = window.cv;
          resolve(cv);
          return;
        }

        if (window.cv && window.cv.Mat) {
          clearInterval(timer);
          cv = window.cv;
          resolve(cv);
          return;
        }

        if (attempts > 120) {
          clearInterval(timer);
          reject(new Error("Không tải được thư viện OpenCV."));
        }
      }, 500);
    });

    return openCVPromise;
  }

  async function loadCards() {
    if (!db) throw new Error("Firebase chưa kết nối.");

    const snapshot = await getDocs(collection(db, "cards"));

    cards = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    })).filter(card =>
      card.imageUrl && card.videoUrl
    );

    if (!cards.length) {
      throw new Error("Chưa có thẻ hợp lệ trong Firebase.");
    }
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();

      img.crossOrigin = "anonymous";

      img.onload = () => resolve(img);

      img.onerror = () => reject(
        new Error("Không tải được ảnh thẻ. Kiểm tra link ảnh Cloudinary.")
      );

      img.src = url;
    });
  }

  function imageToMat(img) {
    const canvas = document.createElement("canvas");
    canvas.width = 700;
    canvas.height = 700;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 700, 700);

    const scale = Math.min(
      680 / img.width,
      680 / img.height
    );

    const w = img.width * scale;
    const h = img.height * scale;

    ctx.drawImage(
      img,
      (700 - w) / 2,
      (700 - h) / 2,
      w,
      h
    );

    return cv.imread(canvas);
  }

  function getDescriptors(mat) {
    const gray = new cv.Mat();
    const keypoints = new cv.KeyPointVector();
    const descriptors = new cv.Mat();
    const mask = new cv.Mat();
    const orb = cv.ORB_create(1200);

    try {
      cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);

      orb.detectAndCompute(
        gray,
        mask,
        keypoints,
        descriptors
      );

      return descriptors;
    } catch (error) {
      descriptors.delete();
      throw error;
    } finally {
      gray.delete();
      keypoints.delete();
      mask.delete();
      orb.delete();
    }
  }

  async function prepareReferences() {
    referenceData.forEach(ref => ref.descriptors.delete());
    referenceData = [];

    say("Đang chuẩn bị dữ liệu nhận diện...");

    for (const card of cards) {
      const img = await loadImage(card.imageUrl);
      const mat = imageToMat(img);

      try {
        const descriptors = getDescriptors(mat);

        if (!descriptors.empty()) {
          referenceData.push({
            card,
            descriptors
          });
        } else {
          descriptors.delete();
        }
      } finally {
        mat.delete();
      }
    }

    if (!referenceData.length) {
      throw new Error("Không tạo được dữ liệu nhận diện.");
    }
  }

  function compareImages(queryMat) {
    const queryDescriptors = getDescriptors(queryMat);

    if (queryDescriptors.empty()) {
      queryDescriptors.delete();
      return null;
    }

    const matcher = new cv.BFMatcher(
      cv.NORM_HAMMING,
      false
    );

    let bestCard = null;
    let bestScore = 0;

    try {
      for (const ref of referenceData) {
        const matches = new cv.DMatchVectorVector();

        try {
          matcher.knnMatch(
            ref.descriptors,
            queryDescriptors,
            matches,
            2
          );

          let good = 0;

          for (let i = 0; i < matches.size(); i++) {
            const pair = matches.get(i);

            try {
              if (pair.size() >= 2) {
                const first = pair.get(0);
                const second = pair.get(1);

                try {
                  if (first.distance < 0.72 * second.distance) {
                    good++;
                  }
                } finally {
                  first.delete();
                  second.delete();
                }
              }
            } finally {
              pair.delete();
            }
          }

          if (good > bestScore) {
            bestScore = good;
            bestCard = ref.card;
          }
        } finally {
          matches.delete();
        }
      }
    } finally {
      matcher.delete();
      queryDescriptors.delete();
    }

    return bestScore >= 10 ? bestCard : null;
  }

  async function recognizeImage(mat) {
    if (!cv || !referenceData.length) {
      say("Camera hoạt động, nhưng dữ liệu nhận diện chưa sẵn sàng.");
      return;
    }

    const card = compareImages(mat);

    if (!card) {
      say("Chưa nhận diện được. Hãy thử ảnh rõ hơn.");
      return;
    }

    showResult(card);
  }

  function showResult(card) {
    if (lastRecognized === card.id) return;

    lastRecognized = card.id;

    player.pause();
    player.src = card.videoUrl;
    player.load();

    $("cardPreview").src = card.imageUrl;

    $("resultName").textContent =
      "Đã nhận diện: " + (card.name || "Thẻ của bạn");

    result.style.display = "block";

    say("Đã tìm thấy thẻ! Đang phát video...");

    player.play().catch(() => {
      say("Đã nhận diện thẻ. Nhấn nút phát video để xem.");
    });
  }

  async function uploadImage(file) {
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      say("Vui lòng chọn một file ảnh.");
      return;
    }

    try {
      stopCamera();

      player.pause();
      lastRecognized = "";

      if (!cv || !referenceData.length) {
        say("Đang chờ dữ liệu nhận diện tải xong...");

        await waitForOpenCV();

        if (!cards.length) await loadCards();

        if (!referenceData.length) {
          await prepareReferences();
        }
      }

      say("Đang nhận diện ảnh...");

      const objectUrl = URL.createObjectURL(file);

      try {
        const img = await loadImage(objectUrl);
        const mat = imageToMat(img);

        try {
          await recognizeImage(mat);
        } finally {
          mat.delete();
        }
      } finally {
        URL.revokeObjectURL(objectUrl);
      }

    } catch (error) {
      console.error(error);
      say("Lỗi xử lý ảnh: " + error.message);
    }
  }

  // Mở camera độc lập với OpenCV và Firebase
  async function startCamera() {
    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(
          "Trình duyệt không hỗ trợ camera. Hãy mở website bằng HTTPS."
        );
      }

      player.pause();
      result.style.display = "none";
      lastRecognized = "";

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }

      say("Đang yêu cầu quyền camera...");

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

      camera.srcObject = cameraStream;
      camera.style.display = "block";
      $("placeholder").style.display = "none";
      $("scanLine").style.display = "block";

      await camera.play();

      scanning = true;

      if (cv && referenceData.length) {
        say("Camera đã mở. Đang tìm thẻ...");
        scanCamera();
      } else {
        say("Camera đã mở. Đang tải dữ liệu nhận diện...");
      }

    } catch (error) {
      console.error(error);

      let message = error.message;

      if (error.name === "NotAllowedError") {
        message = "Bạn chưa cấp quyền camera cho trình duyệt.";
      } else if (error.name === "NotFoundError") {
        message = "Không tìm thấy camera trên thiết bị.";
      } else if (error.name === "NotReadableError") {
        message = "Camera đang được ứng dụng khác sử dụng.";
      }

      say("Không mở được camera: " + message);
    }
  }

  function scanCamera() {
    if (!scanning) return;

    if (
      cv &&
      referenceData.length &&
      !busy &&
      Date.now() - lastScan > 1000 &&
      camera.videoWidth
    ) {
      lastScan = Date.now();
      busy = true;

      let mat = null;

      try {
        const canvas = document.createElement("canvas");
        canvas.width = 700;
        canvas.height = 700;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(camera, 0, 0, 700, 700);

        mat = cv.imread(canvas);

        recognizeImage(mat)
          .catch(error => console.error(error))
          .finally(() => {
            if (mat) mat.delete();
            busy = false;
          });

      } catch (error) {
        console.error(error);

        if (mat) mat.delete();
        busy = false;
      }
    }

    if (scanning) {
      requestAnimationFrame(scanCamera);
    }
  }

  function stopCamera() {
    scanning = false;

    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    camera.srcObject = null;
    camera.style.display = "none";
    $("placeholder").style.display = "block";
    $("scanLine").style.display = "none";
  }

  $("cameraBtn").addEventListener("click", startCamera);

  $("stopBtn").addEventListener("click", () => {
    stopCamera();
    player.pause();
    lastRecognized = "";
    say("Đã dừng quét.");
  });

  $("fileInput").addEventListener("change", event => {
    uploadImage(event.target.files[0]);
    event.target.value = "";
  });

  // Tải dữ liệu nhận diện ở chế độ nền
  async function initialize() {
    try {
      say("Camera sẵn sàng. Đang tải dữ liệu nhận diện...");

      await waitForOpenCV();
      await loadCards();
      await prepareReferences();

      say("Sẵn sàng quét và nhận diện thẻ.");

      if (scanning) {
        scanCamera();
      }

    } catch (error) {
      console.error("Lỗi khởi tạo:", error);

      say("Camera vẫn có thể mở. Lỗi nhận diện: " + error.message);
    }
  }

  initialize();
</script>
</body>
</html>
