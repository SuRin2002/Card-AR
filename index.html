
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
  color:#f3f6ff;
  font-family:Arial,sans-serif;
  padding:20px 14px 35px
}
.wrap{max-width:760px;margin:auto}
.header{text-align:center;margin:20px 0 24px}
.header h1{font-size:25px;letter-spacing:.5px}
.header p{color:#91a3bf;font-size:13px;margin-top:9px}
.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px
}
.camera{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:4/3;
  background:#050a13;
  border-radius:13px
}
#camera{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}
.scan-frame{
  position:absolute;
  inset:12%;
  border:2px solid rgba(255,255,255,.7);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.12)
}
.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere
}
.status.error{color:#ff8998}
.status.success{color:#6de3ac}
.controls{display:flex;gap:9px;margin-top:12px}
button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer
}
button:disabled{opacity:.5}
.primary{background:linear-gradient(135deg,#438fe9,#396ce0)}
.result{
  display:none;
  margin-top:15px;
  padding:14px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b
}
.result h2{font-size:16px;margin-bottom:8px}
.result p{font-size:12px;color:#a9bbd5}
#resultVideo{
  width:100%;
  max-height:420px;
  margin-top:12px;
  border-radius:10px;
  background:#000
}
.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:18px;
  line-height:1.6
}
.hidden{display:none!important}
</style>
</head>

<body>
<main class="wrap">

<header class="header">
  <h1>AR CARD SCANNER</h1>
  <p>Đưa thẻ vào camera để xem video</p>
</header>

<section class="panel">
  <div class="camera">
    <video id="camera" autoplay muted playsinline></video>
    <div class="scan-frame"></div>
  </div>

  <div id="status" class="status">
    Đang khởi động...
  </div>

  <div class="controls">
    <button id="stopButton">Dừng camera</button>
    <button id="retryButton" class="primary hidden">Thử lại</button>
  </div>
</section>

<section id="result" class="result">
  <h2 id="resultName"></h2>
  <p>Đã nhận diện thẻ thành công.</p>
  <video id="resultVideo" controls playsinline></video>
</section>

<p class="footer">
  Đặt thẻ trong khung hình, đủ ánh sáng và tránh bị lóa.
  Giữ camera cách thẻ khoảng 15–30 cm.
</p>

</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

/* ELEMENTS */
const camera = document.getElementById("camera");
const statusBox = document.getElementById("status");
const stopButton = document.getElementById("stopButton");
const retryButton = document.getElementById("retryButton");
const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");
const resultVideo = document.getElementById("resultVideo");

let db = null;
let cv = null;
let stream = null;
let cards = [];
let frameCanvas = document.createElement("canvas");

let scanning = false;
let scanningBusy = false;
let stopped = false;
let scanTimer = null;
let activeCardId = null;
let lastMatchTime = 0;
let lastStatusTime = 0;
let statusMessage = "";

/* STATUS */
function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
  statusMessage = message;
}

/* LOAD FIREBASE */
function initializeFirebase(){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
}

/* LOAD OPENCV */
function loadOpenCV(){
  return new Promise((resolve,reject)=>{
    let finished = false;
    let runtimeReady = false;
    let timeoutId;

    function finish(error,value){
      if(finished) return;
      finished = true;
      clearTimeout(timeoutId);

      if(error) reject(error);
      else resolve(value);
    }

    window.Module = {
      onRuntimeInitialized(){
        runtimeReady = true;

        if(window.cv && window.cv.Mat){
          finish(null,window.cv);
        }
      }
    };

    const script = document.createElement("script");
    script.src = "https://docs.opencv.org/4.x/opencv.js";
    script.async = true;

    script.onerror = ()=>{
      finish(new Error("Không tải được OpenCV. Kiểm tra kết nối Internet."));
    };

    script.onload = ()=>{
      const started = Date.now();

      const check = ()=>{
        if(
          window.cv &&
          window.cv.Mat &&
          window.cv.ORB &&
          (runtimeReady || window.cv.Mat)
        ){
          finish(null,window.cv);
          return;
        }

        if(Date.now()-started>35000){
          finish(new Error("OpenCV khởi động quá lâu. Hãy tải lại trang."));
          return;
        }

        setTimeout(check,200);
      };

      check();
    };

    timeoutId = setTimeout(()=>{
      finish(new Error("Hết thời gian chờ OpenCV."));
    },40000);

    document.head.appendChild(script);
  });
}

/* OPEN CAMERA */
async function startCamera(){
  stopped = false;
  retryButton.classList.add("hidden");

  stopCamera();

  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Trình duyệt không hỗ trợ camera. Hãy mở trang bằng HTTPS.");
    }

    setStatus("Đang xin quyền truy cập camera...");

    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{exact:"environment"},
          width:{ideal:1280},
          height:{ideal:720}
        }
      });
    }catch(error){
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1280},
          height:{ideal:720}
        }
      });
    }

    camera.srcObject = stream;
    await camera.play();

    setStatus("Camera đã mở. Đang chuẩn bị bộ nhận diện...");
    startScanning();

  }catch(error){
    console.error("Camera error:",error);

    setStatus(
      "Không mở được camera: "+error.message+
      ". Hãy cấp quyền camera và dùng HTTPS.",
      "error"
    );

    retryButton.classList.remove("hidden");
  }
}

/* STOP CAMERA */
function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream = null;
  }

  camera.srcObject = null;

  if(scanTimer){
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  scanning = false;
}

/* LOAD IMAGE */
function loadImage(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";

    img.onload = ()=>resolve(img);

    img.onerror = ()=>{
      reject(new Error(
        "Không tải được ảnh mẫu. Kiểm tra đường dẫn Cloudinary hoặc quyền CORS."
      ));
    };

    img.src = url;
  });
}

/* CREATE ORB FEATURES */
async function makeReference(url){
  const img = await loadImage(url);

  const canvas = document.createElement("canvas");
  const maxSize = 1200;

  let width = img.naturalWidth;
  let height = img.naturalHeight;

  if(!width || !height){
    throw new Error("Ảnh mẫu không có kích thước hợp lệ.");
  }

  const scale = Math.min(1,maxSize/Math.max(width,height));
  width = Math.round(width*scale);
  height = Math.round(height*scale);

  canvas.width = width;
  canvas.height = height;

  const context = canvas.getContext("2d",{willReadFrequently:true});
  context.drawImage(img,0,0,width,height);

  const source = cv.imread(canvas);
  const gray = new cv.Mat();
  const descriptors = new cv.Mat();
  const keypoints = new cv.KeyPointVector();
  const mask = new cv.Mat();
  const orb = new cv.ORB(2500);

  try{
    cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);
    cv.equalizeHist(gray,gray);

    orb.detectAndCompute(
      gray,
      mask,
      keypoints,
      descriptors
    );

    if(keypoints.size()<15 || descriptors.empty()){
      throw new Error(
        "Ảnh mẫu quá ít chi tiết. Hãy dùng ảnh rõ nét, không bị mờ."
      );
    }

    return {
      descriptors,
      keypoints,
      width,
      height
    };

  }catch(error){
    descriptors.delete();
    keypoints.delete();
    throw error;
  }finally{
    source.delete();
    gray.delete();
    mask.delete();
    orb.delete();
  }
}

/* LOAD CARDS FROM FIRESTORE */
async function loadCards(){
  setStatus("OpenCV đã sẵn sàng. Đang tải danh sách thẻ...");

  const snapshot = await getDocs(collection(db,"cards"));
  const rawCards = [];

  snapshot.forEach(item=>{
    rawCards.push({
      id:item.id,
      ...item.data()
    });
  });

  const prepared = [];
  let imageCount = 0;
  const errors = [];

  for(let i=0;i<rawCards.length;i++){
    const card = rawCards[i];

    const urls = Array.isArray(card.imageUrls)
      ? card.imageUrls.filter(Boolean)
      : [card.imageUrl].filter(Boolean);

    const references = [];

    for(const url of urls.slice(0,2)){
      try{
        const reference = await makeReference(url);
        references.push(reference);
        imageCount++;
      }catch(error){
        console.error("Reference error:",card.name,error);
        errors.push((card.name || "Thẻ không tên")+": "+error.message);
      }
    }

    if(references.length>0){
      prepared.push({
        ...card,
        references
      });
    }

    setStatus(
      "Đang xử lý ảnh mẫu: "+(i+1)+"/"+rawCards.length+
      " thẻ..."
    );
  }

  cards = prepared;

  console.log("Cards loaded:",cards);
  console.log("Reference images loaded:",imageCount);

  if(cards.length===0){
    const detail = errors.length ? " Lỗi: "+errors[0] : "";

    setStatus(
      "Không có ảnh mẫu hợp lệ. Hãy kiểm tra ảnh trong Admin."+detail,
      "error"
    );
  }else{
    setStatus(
      "Đã sẵn sàng: "+cards.length+" thẻ, "+
      imageCount+" ảnh mẫu. Hãy đưa thẻ vào khung hình."
    );
  }
}

/* EXTRACT FEATURES FROM CAMERA FRAME */
function getFrameFeatures(){
  if(
    !camera.videoWidth ||
    !camera.videoHeight ||
    camera.readyState<2
  ){
    return null;
  }

  const maxWidth = 960;
  const scale = Math.min(1,maxWidth/camera.videoWidth);

  frameCanvas.width = Math.round(camera.videoWidth*scale);
  frameCanvas.height = Math.round(camera.videoHeight*scale);

  const context = frameCanvas.getContext("2d",{willReadFrequently:true});

  context.drawImage(
    camera,
    0,
    0,
    frameCanvas.width,
    frameCanvas.height
  );

  const source = cv.imread(frameCanvas);
  const gray = new cv.Mat();
  const descriptors = new cv.Mat();
  const keypoints = new cv.KeyPointVector();
  const mask = new cv.Mat();
  const orb = new cv.ORB(2500);

  try{
    cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);
    cv.equalizeHist(gray,gray);

    orb.detectAndCompute(
      gray,
      mask,
      keypoints,
      descriptors
    );

    return {
      descriptors,
      keypoints
    };

  }catch(error){
    descriptors.delete();
    keypoints.delete();
    throw error;
  }finally{
    source.delete();
    gray.delete();
    mask.delete();
    orb.delete();
  }
}

/* COMPARE REFERENCE WITH CAMERA FRAME */
function compareReference(reference,frame){
  if(
    reference.descriptors.empty() ||
    frame.descriptors.empty() ||
    reference.keypoints.size()<10 ||
    frame.keypoints.size()<10
  ){
    return 0;
  }

  const matcher = new cv.BFMatcher(cv.NORM_HAMMING,false);
  const matches = new cv.DMatchVectorVector();

  let sourcePoints = null;
  let destinationPoints = null;
  let homography = null;
  let inlierMask = null;

  try{
    matcher.knnMatch(
      reference.descriptors,
      frame.descriptors,
      matches,
      2
    );

    const sourceData = [];
    const destinationData = [];

    for(let i=0;i<matches.size();i++){
      const pair = matches.get(i);

      if(pair.size()<2) continue;

      const best = pair.get(0);
      const second = pair.get(1);

      if(best.distance < 0.75*second.distance){
        const pointA = reference.keypoints.get(best.queryIdx).pt;
        const pointB = frame.keypoints.get(best.trainIdx).pt;

        sourceData.push(pointA.x,pointA.y);
        destinationData.push(pointB.x,pointB.y);
      }
    }

    const goodCount = sourceData.length/2;

    if(goodCount<10) return 0;

    sourcePoints = cv.matFromArray(
      goodCount,1,cv.CV_32FC2,sourceData
    );

    destinationPoints = cv.matFromArray(
      goodCount,1,cv.CV_32FC2,destinationData
    );

    inlierMask = new cv.Mat();

    homography = cv.findHomography(
      sourcePoints,
      destinationPoints,
      cv.RANSAC,
      5,
      inlierMask
    );

    if(!homography || homography.empty()) return 0;

    let inliers = 0;

    for(let i=0;i<inlierMask.rows;i++){
      if(inlierMask.data[i]!==0) inliers++;
    }

    const ratio = inliers/goodCount;

    if(inliers>=9 && ratio>=0.20){
      return inliers;
    }

    return 0;

  }catch(error){
    console.warn("Compare error:",error);
    return 0;
  }finally{
    matcher.delete();
    matches.delete();

    if(sourcePoints) sourcePoints.delete();
    if(destinationPoints) destinationPoints.delete();
    if(homography) homography.delete();
    if(inlierMask) inlierMask.delete();
  }
}

/* RECOGNIZE CARD */
function recognize(frame){
  let bestCard = null;
  let bestScore = 0;

  for(const card of cards){
    for(const reference of card.references){
      const score = compareReference(reference,frame);

      if(score>bestScore){
        bestScore = score;
        bestCard = card;
      }
    }
  }

  return bestCard;
}

/* PLAY VIDEO */
function playCard(card){
  if(activeCardId===card.id) return;

  if(!card.videoUrl){
    setStatus(
      "Đã nhận diện "+(card.name || "thẻ")+
      " nhưng thẻ chưa có video.",
      "error"
    );
    return;
  }

  activeCardId = card.id;
  resultName.textContent = card.name || "Card AR";
  resultBox.style.display = "block";

  resultVideo.pause();
  resultVideo.src = card.videoUrl;
  resultVideo.load();

  resultVideo.play().then(()=>{
    setStatus("Đã nhận diện: "+(card.name || "Card AR"),"success");
  }).catch(error=>{
    console.error("Video error:",error);
    setStatus(
      "Đã nhận diện thẻ nhưng video chưa tự phát. Hãy bấm Play.",
      "error"
    );
  });
}

/* ALLOW SAME CARD TO BE RECOGNIZED AGAIN AFTER VIDEO ENDS */
resultVideo.addEventListener("ended",()=>{
  activeCardId = null;
  setStatus("Video đã phát xong. Đưa thẻ vào lại để quét tiếp.");
});

/* SCAN LOOP */
async function scanLoop(){
  if(!scanning || stopped || scanningBusy) return;

  scanningBusy = true;

  let frame = null;

  try{
    if(cv && cards.length && camera.readyState>=2){
      frame = getFrameFeatures();

      if(frame){
        const found = recognize(frame);

        if(found){
          const now = Date.now();

          if(
            found.id!==activeCardId &&
            now-lastMatchTime>2500
          ){
            lastMatchTime = now;
            playCard(found);
          }
        }else{
          const now = Date.now();

          if(now-lastStatusTime>5000 && !activeCardId){
            setStatus(
              "Đang quét... Đã nạp "+cards.length+
              " thẻ. Hãy đưa mặt thẻ rõ vào giữa khung hình."
            );
            lastStatusTime = now;
          }
        }
      }
    }
  }catch(error){
    console.error("Scan error:",error);
    setStatus("Lỗi nhận diện: "+error.message,"error");
  }finally{
    if(frame){
      frame.descriptors.delete();
      frame.keypoints.delete();
    }

    scanningBusy = false;

    if(scanning && !stopped){
      scanTimer = setTimeout(scanLoop,500);
    }
  }
}

/* START SCANNING */
function startScanning(){
  if(scanning) return;

  scanning = true;
  scanLoop();
}

/* BUTTONS */
stopButton.addEventListener("click",()=>{
  stopped = true;
  stopCamera();
  setStatus("Camera đã dừng.");
  retryButton.classList.remove("hidden");
});

retryButton.addEventListener("click",()=>{
  startCamera();
});

/* CLEAN UP REFERENCES */
function releaseReferences(){
  for(const card of cards){
    for(const reference of card.references || []){
      try{
        reference.descriptors.delete();
        reference.keypoints.delete();
      }catch(error){
        console.warn("Cleanup error:",error);
      }
    }
  }

  cards = [];
}

/* INITIALIZE */
async function initialize(){
  try{
    setStatus("Đang khởi động camera...");

    /* Camera starts independently of Firebase/OpenCV */
    startCamera();

    setStatus("Đang tải bộ nhận diện hình ảnh...");

    cv = await loadOpenCV();

    setStatus("OpenCV đã sẵn sàng. Đang kết nối Firebase...");

    initializeFirebase();

    setStatus("Đang tải ảnh mẫu từ danh sách thẻ...");

    await loadCards();

    if(cards.length>0){
      setStatus(
        "Sẵn sàng nhận diện "+cards.length+
        " thẻ. Hãy đưa thẻ vào khung hình."
      );
    }

    if(!scanning && camera.srcObject){
      startScanning();
    }

  }catch(error){
    console.error("Initialization error:",error);

    setStatus(
      "Không thể khởi động nhận diện: "+error.message,
      "error"
    );
  }
}

window.addEventListener("pagehide",()=>{
  stopped = true;
  stopCamera();
  releaseReferences();
});

initialize();
</script>
</body>
</html>
