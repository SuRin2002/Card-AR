
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  min-height:100%;
  background:#0b1020;
  color:#f3f6ff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  padding:12px 12px 25px;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
}

.wrap{max-width:760px;margin:auto}

.header{text-align:center;margin:12px 0 16px}
.header h1{font-size:25px;letter-spacing:.5px}
.header p{color:#91a3bf;font-size:13px;margin-top:8px}

.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:12px;
  margin-bottom:15px;
}

/* CAMERA */
.camera{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  width:min(100%,420px);
  aspect-ratio:9/16;
  max-height:75svh;
  margin:auto;
  background:#050a13;
  border-radius:13px;
}

/* Camera video */
.camera video:not(#arVideo),
body > video:not(#arVideo){
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  background:#050a13!important;
  z-index:1!important;
  display:block!important;
}

/* AR canvas */
#arScene{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:2!important;
  background:transparent!important;
}

#arScene canvas.a-canvas{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:2!important;
  background:transparent!important;
}

/* Scan frame */
.scan-frame{
  position:absolute;
  z-index:5;
  inset:12%;
  border:2px solid rgba(255,255,255,.65);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.08);
}

/* Status */
.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
}

.status.error{color:#ff8998}
.status.success{color:#6de3ac}

/* Buttons */
.controls{display:flex;gap:8px;margin-top:12px}

button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px 10px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer;
}

button.primary{background:#2563a8}
button:disabled{opacity:.45;cursor:not-allowed}
.audio-control{margin-top:9px}

/* Result */
.result{
  display:none;
  margin-top:12px;
  padding:13px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b;
  text-align:center;
}

.result h2{font-size:16px;margin-bottom:6px}
.result p{font-size:12px;color:#a9bbd5}

.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:16px;
  line-height:1.6;
}

@media(max-height:650px){
  .camera{max-height:65svh}
}
</style>
</head>

<body>
<main class="wrap">

  <header class="header">
    <h1>AR CARD SCANNER</h1>
    <p>Đưa từng lá bài vào camera để xem video AR</p>
  </header>

  <section class="panel">

    <div class="camera" id="cameraBox">

      <a-scene
        id="arScene"
        embedded
        color-space="sRGB"
        renderer="alpha: true; antialias: true; colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        background="transparent: true">

        <a-assets id="arAssets" timeout="30000">
          <video
            id="arVideo"
            crossorigin="anonymous"
            playsinline
            webkit-playsinline
            loop
            muted>
          </video>
        </a-assets>

        <a-camera
          position="0 0 0"
          look-controls="enabled: false">
        </a-camera>

      </a-scene>

      <div class="scan-frame"></div>
    </div>

    <div id="status" class="status">
      Nhấn Bắt đầu quét để mở camera.
    </div>

    <div class="controls">
      <button id="startButton" class="primary">Bắt đầu quét</button>
      <button id="stopButton" disabled>Dừng quét</button>
    </div>

    <div class="audio-control">
      <button id="audioButton">Bật âm thanh</button>
    </div>

    <section id="result" class="result">
      <h2 id="resultName"></h2>
      <p>Đã nhận diện lá bài thành công!</p>
    </section>

  </section>

  <p class="footer">
    Đưa mặt trước lá bài vào khung hình.
    Giữ điện thoại ổn định, đủ ánh sáng và tránh bị lóa.
  </p>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

/* ELEMENTS */

const sceneEl = document.getElementById("arScene");
const videoEl = document.getElementById("arVideo");

const statusBox = document.getElementById("status");
const audioButton = document.getElementById("audioButton");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");

const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");

/* STATE */

let db = null;
let allCards = [];
let mindGroups = [];

let arSystem = null;
let activeCard = null;
let activeGroupIndex = 0;

let audioEnabled = false;
let targetFound = false;
let starting = false;
let running = false;
let switching = false;
let stopping = false;

let videoRequestId = 0;
let switchTimer = null;

/*
  Thời gian thử mỗi file .mind khi chưa tìm thấy thẻ.
  Có thể tăng lên nếu có nhiều file .mind.
*/
const SCAN_INTERVAL = 7000;

/* STATUS */

function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* WAIT */

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function waitForScene(){
  return new Promise(resolve=>{
    if(sceneEl.hasLoaded){
      resolve();
    }else{
      sceneEl.addEventListener("loaded",resolve,{once:true});
    }
  });
}

/* TRANSPARENT CANVAS */

function makeCanvasTransparent(){
  try{
    if(!sceneEl.renderer) return;

    sceneEl.renderer.setClearColor(0x000000,0);
    sceneEl.renderer.setClearAlpha(0);

    if(sceneEl.canvas){
      sceneEl.canvas.style.background="transparent";
    }
  }catch(error){
    console.warn("Canvas transparency:",error);
  }
}

/* FIRESTORE */

async function loadCardsFromFirebase(){

  setStatus("Đang kết nối Firebase...");

  const snapshot = await getDocs(collection(db,"cards"));

  allCards = [];

  snapshot.forEach(doc=>{

    const data = doc.data();

    const imageUrl =
      data.imageUrl ||
      (
        Array.isArray(data.imageUrls)
        ? data.imageUrls[0]
        : ""
      );

    if(imageUrl && data.videoUrl){

      allCards.push({
        id:doc.id,
        ...data,
        imageUrl
      });

    }

  });

  if(allCards.length===0){
    throw new Error(
      "Không tìm thấy thẻ có đủ imageUrl và videoUrl trong Firestore."
    );
  }

}

/* GROUP CARDS BY MIND FILE */

function buildMindGroups(){

  const groupsMap = new Map();

  allCards.forEach(card=>{

    /*
      mindUrl là đường dẫn file .mind của thẻ.
      Có thể là đường dẫn trên Render hoặc URL Cloudinary.
    */

    const mindUrl = String(card.mindUrl || "").trim();

    if(!mindUrl){
      console.warn("Thẻ thiếu mindUrl:",card.id);
      return;
    }

    const index = Number(card.targetIndex);

    if(
      card.targetIndex === undefined ||
      card.targetIndex === null ||
      card.targetIndex === "" ||
      !Number.isInteger(index) ||
      index < 0
    ){
      console.warn("Thẻ thiếu targetIndex hợp lệ:",card.id);
      return;
    }

    if(!groupsMap.has(mindUrl)){
      groupsMap.set(mindUrl,{
        file:mindUrl,
        cards:[]
      });
    }

    groupsMap.get(mindUrl).cards.push({
      ...card,
      targetIndex:index
    });

  });

  mindGroups = Array.from(groupsMap.values());

  mindGroups.forEach(group=>{

    group.cards.sort((a,b)=>{
      return a.targetIndex-b.targetIndex;
    });

    const usedIndexes = new Set();

    group.cards.forEach(card=>{

      if(usedIndexes.has(card.targetIndex)){
        throw new Error(
          "File " + group.file +
          " có nhiều thẻ trùng targetIndex " +
          card.targetIndex
        );
      }

      usedIndexes.add(card.targetIndex);

    });

  });

  if(mindGroups.length===0){
    throw new Error(
      "Không tìm thấy file .mind. Hãy kiểm tra trường mindUrl trong Firestore."
    );
  }

  console.log("Các file MindAR tìm thấy:",mindGroups);

}

/* CLEAR TARGETS */

function clearTargets(){

  sceneEl.querySelectorAll(".dynamic-card-target").forEach(el=>{
    el.remove();
  });

}

/* CREATE TARGETS FOR CURRENT FILE */

function createTargets(group){

  clearTargets();

  group.cards.forEach(card=>{

    const target = document.createElement("a-entity");

    target.classList.add("dynamic-card-target");

    target.setAttribute(
      "mindar-image-target",
      "targetIndex: " + card.targetIndex
    );

    const plane = document.createElement("a-video");

    plane.setAttribute("src","#arVideo");
    plane.setAttribute("position","0 0 0.01");
    plane.setAttribute("width","1");
    plane.setAttribute("height","0.7");
    plane.setAttribute(
      "material",
      "shader: flat; side: double"
    );

    target.appendChild(plane);
    sceneEl.appendChild(target);

    target.addEventListener("targetFound",()=>{
      onTargetFound(card,plane);
    });

    target.addEventListener("targetLost",()=>{
      onTargetLost(card);
    });

  });

}

/* LOAD VIDEO */

function loadVideo(url){

  return new Promise((resolve,reject)=>{

    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("Video tải quá lâu."));
    },30000);

    function cleanup(){
      clearTimeout(timeout);
      videoEl.removeEventListener("loadedmetadata",success);
      videoEl.removeEventListener("error",failed);
    }

    function success(){
      cleanup();
      resolve();
    }

    function failed(){
      cleanup();
      reject(new Error("Không tải được video. Hãy kiểm tra videoUrl Cloudinary."));
    }

    videoEl.addEventListener("loadedmetadata",success);
    videoEl.addEventListener("error",failed);

    videoEl.pause();
    videoEl.src=url;
    videoEl.load();

    if(videoEl.readyState>=1){
      cleanup();
      resolve();
    }

  });

}

/* IMAGE RATIO */

function getImageRatio(url){

  return new Promise(resolve=>{

    const img=new Image();

    const timeout=setTimeout(()=>{
      resolve(0.7);
    },10000);

    img.onload=()=>{
      clearTimeout(timeout);

      if(img.naturalWidth && img.naturalHeight){
        resolve(img.naturalHeight/img.naturalWidth);
      }else{
        resolve(0.7);
      }
    };

    img.onerror=()=>{
      clearTimeout(timeout);
      resolve(0.7);
    };

    img.src=url;

  });

}

/* FIT VIDEO TO CARD */

async function resizeVideoPlane(card,plane){

  const cardHeight=await getImageRatio(card.imageUrl);

  const videoWidth=videoEl.videoWidth || 16;
  const videoHeight=videoEl.videoHeight || 9;

  const videoRatio=videoWidth/videoHeight;
  const cardRatio=1/cardHeight;

  let planeWidth=1;
  let planeHeight=cardHeight;

  if(videoRatio>cardRatio){
    planeWidth=1;
    planeHeight=1/videoRatio;
  }else{
    planeHeight=cardHeight;
    planeWidth=cardHeight*videoRatio;
  }

  plane.setAttribute("width",planeWidth);
  plane.setAttribute("height",planeHeight);

}

/* TARGET FOUND */

async function onTargetFound(card,plane){

  if(!running || stopping) return;

  activeCard=card;
  targetFound=true;

  clearTimeout(switchTimer);

  const requestId=++videoRequestId;

  resultName.textContent=card.name || "Card AR";
  resultBox.style.display="block";

  setStatus(
    "Đã nhận diện " + (card.name || "Card AR") +
    ". Đang tải video..."
  );

  try{

    videoEl.pause();
    videoEl.muted=!audioEnabled;

    await loadVideo(card.videoUrl);

    if(
      requestId!==videoRequestId ||
      !activeCard ||
      activeCard.id!==card.id
    ){
      return;
    }

    await resizeVideoPlane(card,plane);

    if(
      requestId!==videoRequestId ||
      !activeCard ||
      activeCard.id!==card.id
    ){
      return;
    }

    await videoEl.play();

    if(requestId===videoRequestId){
      setStatus(
        "Đang phát video: " + (card.name || "Card AR"),
        "success"
      );
    }

  }catch(error){

    console.error("Video error:",error);

    if(requestId===videoRequestId){
      setStatus(
        "Nhận diện được thẻ nhưng video không phát được: " +
        error.message,
        "error"
      );
    }

  }

}

/* TARGET LOST */

function onTargetLost(card){

  if(!activeCard || activeCard.id!==card.id){
    return;
  }

  targetFound=false;
  activeCard=null;

  videoRequestId++;

  videoEl.pause();

  resultBox.style.display="none";

  setStatus(
    "Đã mất thẻ. Đang chuyển sang nhận diện các thẻ khác..."
  );

  /*
    Chờ một chút để tránh chuyển file khi tracking chập chờn.
  */

  clearTimeout(switchTimer);

  switchTimer=setTimeout(()=>{
    if(running && !targetFound){
      moveToNextGroup();
    }
  },1200);

}

/* WAIT FOR MINDAR SYSTEM */

async function waitForMindSystem(){

  for(let i=0;i<100;i++){

    const system=sceneEl.systems["mindar-image-system"];

    if(system){
      return system;
    }

    await sleep(100);

  }

  throw new Error("Không khởi tạo được MindAR Image System.");

}

/* STOP CURRENT MINDAR INSTANCE */

async function stopCurrentMind(){

  clearTimeout(switchTimer);

  if(arSystem){

    try{
      await arSystem.stop();
    }catch(error){
      console.warn("Stop MindAR:",error);
    }

  }

  arSystem=null;

  clearTargets();

  sceneEl.removeAttribute("mindar-image");

  await sleep(300);

}

/* START A SPECIFIC MIND FILE */

async function startMindGroup(index){

  if(stopping) return;

  switching=true;

  const group=mindGroups[index];

  if(!group){
    throw new Error("Không tìm thấy file .mind cần quét.");
  }

  activeGroupIndex=index;

  targetFound=false;
  activeCard=null;

  videoRequestId++;

  videoEl.pause();
  resultBox.style.display="none";

  await stopCurrentMind();

  setStatus(
    "Đang nạp file nhận diện " +
    (index+1) + "/" + mindGroups.length +
    ". Vui lòng giữ điện thoại..."
  );

  createTargets(group);

  sceneEl.setAttribute("mindar-image",{
    imageTargetSrc:group.file,
    autoStart:false,
    maxTrack:1,
    uiLoading:"no",
    uiScanning:"no",
    uiError:"no"
  });

  arSystem=await waitForMindSystem();

  const readyPromise=new Promise((resolve,reject)=>{

    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error("MindAR khởi động quá lâu."));
    },35000);

    function cleanup(){
      clearTimeout(timeout);
      sceneEl.removeEventListener("arReady",ready);
      sceneEl.removeEventListener("arError",failed);
    }

    function ready(){
      cleanup();
      resolve();
    }

    function failed(){
      cleanup();
      reject(new Error("MindAR không thể khởi động camera."));
    }

    sceneEl.addEventListener("arReady",ready);
    sceneEl.addEventListener("arError",failed);

  });

  await arSystem.start();
  await readyPromise;

  makeCanvasTransparent();

  switching=false;

  setStatus(
    "Đang quét file " + (index+1) +
    "/" + mindGroups.length +
    " — Có " + group.cards.length +
    " thẻ trong file này. Hãy đưa thẻ vào camera.",
    "success"
  );

  /*
    Nếu chưa nhận diện được thẻ sau SCAN_INTERVAL,
    tự chuyển sang file .mind tiếp theo.
  */

  clearTimeout(switchTimer);

  switchTimer=setTimeout(()=>{

    if(running && !targetFound && !stopping){
      moveToNextGroup();
    }

  },SCAN_INTERVAL);

}

/* MOVE TO NEXT MIND FILE */

async function moveToNextGroup(){

  if(!running || switching || stopping || targetFound){
    return;
  }

  const nextIndex=(activeGroupIndex+1)%mindGroups.length;

  try{

    await startMindGroup(nextIndex);

  }catch(error){

    console.error("Switch MindAR error:",error);

    setStatus(
      "Không thể chuyển file nhận diện: " + error.message,
      "error"
    );

  }

}

/* START SCANNER */

async function startScanner(){

  if(starting || running) return;

  starting=true;

  startButton.disabled=true;
  stopButton.disabled=true;

  try{

    await waitForScene();

    makeCanvasTransparent();

    if(!db){

      const app=initializeApp(firebaseConfig);
      db=getFirestore(app);

    }

    await loadCardsFromFirebase();

    buildMindGroups();

    running=true;
    stopping=false;

    await startMindGroup(0);

    stopButton.disabled=false;

  }catch(error){

    console.error("AR initialization error:",error);

    running=false;

    await stopCurrentMind();

    setStatus(
      "Lỗi: " + error.message,
      "error"
    );

    startButton.disabled=false;
    stopButton.disabled=true;

  }finally{

    starting=false;

  }

}

/* STOP SCANNER */

async function stopScanner(){

  if(starting || stopping) return;

  stopping=true;
  running=false;

  clearTimeout(switchTimer);

  videoRequestId++;

  targetFound=false;
  activeCard=null;

  videoEl.pause();
  videoEl.removeAttribute("src");
  videoEl.load();

  await stopCurrentMind();

  resultBox.style.display="none";

  stopping=false;

  startButton.disabled=false;
  stopButton.disabled=true;

  setStatus("Đã dừng quét. Nhấn Bắt đầu quét để tiếp tục.");

}

/* BUTTON EVENTS */

startButton.addEventListener("click",startScanner);
stopButton.addEventListener("click",stopScanner);

/* AUDIO */

audioButton.addEventListener("click",async()=>{

  audioEnabled=!audioEnabled;

  audioButton.textContent=audioEnabled
    ? "Tắt âm thanh"
    : "Bật âm thanh";

  videoEl.muted=!audioEnabled;

  if(audioEnabled && targetFound){

    try{
      await videoEl.play();
    }catch(error){

      console.warn(error);

      setStatus(
        "Không thể bật âm thanh video. Hãy chạm lại nút âm thanh.",
        "error"
      );

    }

  }

});

/* INITIALIZE */

async function initialize(){

  await waitForScene();
  makeCanvasTransparent();

  setStatus("Nhấn Bắt đầu quét để mở camera.");

}

initialize().catch(error=>{
  console.error(error);
  setStatus("Lỗi khởi tạo: "+error.message,"error");
});

/* RELEASE CAMERA */

window.addEventListener("pagehide",()=>{

  try{
    if(arSystem){
      arSystem.stop();
    }
  }catch(error){
    console.warn(error);
  }

});

</script>
</body>
</html>
