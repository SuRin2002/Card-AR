<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AR Card Scanner</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  min-height:100%;
  background:#0b1020;
  color:#f3f6ff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  padding:12px 12px 25px;
  background:radial-gradient(ellipse at 50% -10%,#243b61,#0b1020 65%);
}

.wrap{max-width:760px;margin:auto}

.header{text-align:center;margin:12px 0 16px}
.header h1{font-size:25px;letter-spacing:.5px}
.header p{color:#91a3bf;font-size:13px;margin-top:8px}

.panel{
  background:#121d30;
  border:1px solid #2a3b57;
  border-radius:18px;
  padding:12px;
  margin-bottom:15px;
}

.selector{margin-bottom:13px}
.selector label{
  display:block;
  font-size:13px;
  color:#a9bbd5;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #36547a;
  border-radius:10px;
  background:#0c1729;
  color:white;
  font-size:15px;
  outline:none;
}

.camera{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  width:min(100%,420px);
  aspect-ratio:9/16;
  max-height:75svh;
  margin:auto;
  background:#050a13;
  border-radius:13px;
}

.camera video:not(#arVideo){
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  z-index:0!important;
  display:block!important;
}

#arScene{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}

#arScene canvas.a-canvas{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}

.scan-frame{
  position:absolute;
  z-index:5;
  inset:12%;
  border:2px solid rgba(255,255,255,.65);
  border-radius:13px;
  pointer-events:none;
  box-shadow:0 0 0 1000px rgba(0,0,0,.10);
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#0c1729;
  color:#a9bbd5;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
}

.status.error{color:#ff8998}
.status.success{color:#6de3ac}

.controls{
  display:flex;
  gap:8px;
  margin-top:12px;
}

button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px 10px;
  font-weight:700;
  color:white;
  background:#293b58;
  cursor:pointer;
}

button.primary{background:#2563a8}
button:disabled{opacity:.45;cursor:not-allowed}

.audio-control{margin-top:9px}

.result{
  display:none;
  margin-top:12px;
  padding:13px;
  border:1px solid #36547a;
  border-radius:13px;
  background:#0d192b;
  text-align:center;
}

.result h2{font-size:16px;margin-bottom:6px}
.result p{font-size:12px;color:#a9bbd5}

.footer{
  text-align:center;
  color:#70839f;
  font-size:11px;
  margin-top:16px;
  line-height:1.6;
}

@media(max-height:650px){
  .camera{max-height:65svh}
}
</style>
</head>

<body>
<main class="wrap">

  <header class="header">
    <h1>AR CARD SCANNER</h1>
    <p>Chọn bộ thẻ rồi đưa mặt trước lá bài vào camera</p>
  </header>

  <section class="panel">

    <div class="selector">
      <label for="targetSetSelect">Chọn bộ thẻ muốn quét</label>
      <select id="targetSetSelect">
        <option value="set1">Bộ 1</option>
        <option value="set2">Bộ 2</option>
        <option value="set3">Bộ 3</option>
      </select>
    </div>

    <div class="camera" id="cameraBox">

      <!-- MindAR sẽ được nạp sau khi chọn bộ và bấm bắt đầu -->
      <a-scene
        id="arScene"
        embedded
        color-space="sRGB"
        renderer="alpha: true; antialias: true; colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        background="transparent: true">

        <a-assets id="arAssets" timeout="30000">
          <video
            id="arVideo"
            crossorigin="anonymous"
            playsinline
            webkit-playsinline
            loop
            muted>
          </video>
        </a-assets>

        <a-camera
          position="0 0 0"
          look-controls="enabled: false">
        </a-camera>

      </a-scene>

      <div class="scan-frame"></div>
    </div>

    <div id="status" class="status">
      Hãy chọn bộ thẻ và nhấn Bắt đầu quét.
    </div>

    <div class="controls">
      <button id="startButton" class="primary">Bắt đầu quét</button>
      <button id="stopButton" disabled>Dừng quét</button>
    </div>

    <div class="audio-control">
      <button id="audioButton">Bật âm thanh</button>
    </div>

    <section id="result" class="result">
      <h2 id="resultName"></h2>
      <p>Đã nhận diện lá bài thành công!</p>
    </section>

  </section>

  <p class="footer">
    Đưa mặt trước lá bài vào khung hình.
    Giữ điện thoại ổn định, đủ ánh sáng và tránh bị lóa.
  </p>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyDFTvux73x5oAl273PN_0wzz_A1OVvh34c",
  authDomain: "ar-card-video.firebaseapp.com",
  projectId: "ar-card-video",
  storageBucket: "ar-card-video.firebasestorage.app",
  messagingSenderId: "725938606795",
  appId: "1:725938606795:web:516149f4210f26344bc14e"
};

/*
  DANH SÁCH FILE MINDAR

  Bạn có thể giữ nguyên tên file đã tải về.
  Nếu file nằm trong thư mục targets thì thêm targets/ vào đường dẫn.

  Lưu ý: dấu cách trong tên file được viết thành %20.
*/

const TARGET_SETS = [
  {
    id: "set1",
    name: "Bộ 1",
    file: "./targets.mind"
  },
  {
    id: "set2",
    name: "Bộ 2",
    file: "./targets%20(1).mind"
  },
  {
    id: "set3",
    name: "Bộ 3",
    file: "./targets%20(2).mind"
  }
];

/* ELEMENTS */

const sceneEl = document.getElementById("arScene");
const videoEl = document.getElementById("arVideo");

const statusBox = document.getElementById("status");
const audioButton = document.getElementById("audioButton");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const setSelect = document.getElementById("targetSetSelect");

const resultBox = document.getElementById("result");
const resultName = document.getElementById("resultName");

let db;
let arSystem = null;
let allCards = [];
let activeCards = [];
let activeSet = null;
let activeCard = null;
let activePlane = null;

let audioEnabled = false;
let targetFound = false;
let starting = false;
let running = false;

/* STATUS */

function setStatus(message,type=""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* WAIT FOR A-FRAME */

function waitForScene(){
  return new Promise(resolve=>{
    if(sceneEl.hasLoaded){
      resolve();
    }else{
      sceneEl.addEventListener("loaded",resolve,{once:true});
    }
  });
}

/* TRANSPARENT CANVAS */

function makeCanvasTransparent(){
  if(!sceneEl.renderer) return;

  try{
    sceneEl.renderer.setClearColor(0x000000,0);
    sceneEl.renderer.setClearAlpha(0);

    if(sceneEl.canvas){
      sceneEl.canvas.style.background = "transparent";
    }
  }catch(error){
    console.warn(error);
  }
}

/* IMAGE RATIO */

function getImageRatio(url){
  return new Promise(resolve=>{
    const img = new Image();

    const timeout = setTimeout(()=>resolve(0.7),10000);

    img.onload = ()=>{
      clearTimeout(timeout);

      if(img.naturalWidth && img.naturalHeight){
        resolve(img.naturalHeight/img.naturalWidth);
      }else{
        resolve(0.7);
      }
    };

    img.onerror = ()=>{
      clearTimeout(timeout);
      resolve(0.7);
    };

    img.src = url;
  });
}

/* WAIT VIDEO METADATA */

function waitForVideo(){
  return new Promise((resolve,reject)=>{

    if(videoEl.readyState>=1){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("Video tải quá lâu."));
    },25000);

    function cleanup(){
      clearTimeout(timeout);
      videoEl.removeEventListener("loadedmetadata",success);
      videoEl.removeEventListener("error",failed);
    }

    function success(){
      cleanup();
      resolve();
    }

    function failed(){
      cleanup();
      reject(new Error("Không tải được video Cloudinary."));
    }

    videoEl.addEventListener("loadedmetadata",success);
    videoEl.addEventListener("error",failed);
    videoEl.load();
  });
}

/* LOAD FIRESTORE */

async function loadCardsFromFirebase(){

  setStatus("Đang kết nối Firebase...");

  const snapshot = await getDocs(collection(db,"cards"));

  allCards = [];

  snapshot.forEach(doc=>{

    const data = doc.data();

    const imageUrl =
      data.imageUrl ||
      (Array.isArray(data.imageUrls) ? data.imageUrls[0] : "");

    if(imageUrl && data.videoUrl){

      allCards.push({
        id: doc.id,
        ...data,
        imageUrl
      });

    }

  });

  if(allCards.length===0){
    throw new Error("Không tìm thấy thẻ có đủ ảnh và video trong Firestore.");
  }

}

/* FIND CARDS BELONGING TO SELECTED FILE */

function getCardsForSet(set){

  return allCards.filter(card=>{

    return String(card.targetSetId || "") === set.id &&
      Number.isInteger(Number(card.targetIndex)) &&
      Number(card.targetIndex) >= 0;

  }).sort((a,b)=>Number(a.targetIndex)-Number(b.targetIndex));

}

/* REMOVE OLD TARGET ENTITIES */

function clearTargets(){

  const oldTargets = sceneEl.querySelectorAll(".dynamic-card-target");

  oldTargets.forEach(el=>el.remove());

  activePlane = null;
}

/* CREATE ONE MINDAR TARGET FOR EACH FIRESTORE CARD */

function createTargets(cards){

  clearTargets();

  cards.forEach(card=>{

    const target = document.createElement("a-entity");

    target.classList.add("dynamic-card-target");

    target.setAttribute(
      "mindar-image-target",
      "targetIndex: " + Number(card.targetIndex)
    );

    const plane = document.createElement("a-video");

    plane.setAttribute("src","#arVideo");
    plane.setAttribute("position","0 0 0.01");
    plane.setAttribute("width","1");
    plane.setAttribute("height","0.7");
    plane.setAttribute(
      "material",
      "shader: flat; side: double"
    );

    target.appendChild(plane);
    sceneEl.appendChild(target);

    target.addEventListener("targetFound",()=>{
      onTargetFound(card,plane);
    });

    target.addEventListener("targetLost",()=>{
      onTargetLost(card);
    });

  });

}

/* SET VIDEO SIZE TO FIT CARD */

async function resizeVideoPlane(card,plane){

  const cardHeight = await getImageRatio(card.imageUrl);

  const videoWidth = videoEl.videoWidth || 16;
  const videoHeight = videoEl.videoHeight || 9;

  const videoRatio = videoWidth/videoHeight;
  const cardRatio = 1/cardHeight;

  let planeWidth = 1;
  let planeHeight = cardHeight;

  if(videoRatio > cardRatio){
    planeWidth = 1;
    planeHeight = 1/videoRatio;
  }else{
    planeHeight = cardHeight;
    planeWidth = cardHeight*videoRatio;
  }

  plane.setAttribute("width",planeWidth);
  plane.setAttribute("height",planeHeight);
}

/* PLAY THE MATCHING CARD VIDEO */

async function onTargetFound(card,plane){

  activeCard = card;
  activePlane = plane;
  targetFound = true;

  resultName.textContent = card.name || "Card AR";
  resultBox.style.display = "block";

  try{

    videoEl.pause();

    videoEl.src = card.videoUrl;
    videoEl.muted = !audioEnabled;

    await waitForVideo();

    await resizeVideoPlane(card,plane);

    if(!targetFound || activeCard.id !== card.id){
      return;
    }

    await videoEl.play();

    setStatus(
      "Đã nhận diện: " + (card.name || "Card AR"),
      "success"
    );

  }catch(error){

    console.error("Video error:",error);

    setStatus(
      "Nhận diện được thẻ nhưng không phát được video: " + error.message,
      "error"
    );

  }

}

/* TARGET LOST */

function onTargetLost(card){

  if(!activeCard || activeCard.id !== card.id){
    return;
  }

  targetFound = false;
  activeCard = null;
  activePlane = null;

  videoEl.pause();

  resultBox.style.display = "none";

  setStatus("Đưa mặt trước lá bài vào khung hình để xem video.");

}

/* START SELECTED TARGET FILE */

async function startScanner(){

  if(starting || running) return;

  starting = true;
  startButton.disabled = true;
  setSelect.disabled = true;

  try{

    await waitForScene();
    makeCanvasTransparent();

    if(!db){

      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);

    }

    if(allCards.length===0){
      await loadCardsFromFirebase();
    }

    const selectedId = setSelect.value;

    activeSet = TARGET_SETS.find(set=>set.id===selectedId);

    if(!activeSet){
      throw new Error("Không tìm thấy bộ thẻ đã chọn.");
    }

    activeCards = getCardsForSet(activeSet);

    if(activeCards.length===0){

      throw new Error(
        "Bộ này chưa có thẻ trong Firestore. Hãy kiểm tra targetSetId và targetIndex."
      );

    }

    const duplicateIndexes = new Set();

    for(const card of activeCards){

      const index = Number(card.targetIndex);

      if(duplicateIndexes.has(index)){
        throw new Error(
          "Có nhiều thẻ trùng targetIndex " + index +
          " trong " + activeSet.name
        );
      }

      duplicateIndexes.add(index);

    }

    setStatus(
      "Đang nạp " + activeSet.name +
      " (" + activeCards.length + " thẻ)..."
    );

    createTargets(activeCards);

    /*
      Gắn MindAR vào scene sau khi đã tạo target.
      imageTargetSrc là file được chọn.
    */

    sceneEl.setAttribute(
      "mindar-image",
      {
        imageTargetSrc: activeSet.file,
        autoStart: false,
        maxTrack: 1,
        uiLoading: "no",
        uiScanning: "no",
        uiError: "no"
      }
    );

    await new Promise(resolve=>setTimeout(resolve,300));

    arSystem = sceneEl.systems["mindar-image-system"];

    if(!arSystem){
      throw new Error("Không tìm thấy MindAR Image System.");
    }

    const readyPromise = new Promise((resolve,reject)=>{

      const timeout = setTimeout(()=>{
        cleanup();
        reject(new Error("Camera khởi động quá lâu."));
      },35000);

      function cleanup(){
        clearTimeout(timeout);
        sceneEl.removeEventListener("arReady",ready);
        sceneEl.removeEventListener("arError",failed);
      }

      function ready(){
        cleanup();
        resolve();
      }

      function failed(){
        cleanup();
        reject(new Error("MindAR không thể khởi động camera."));
      }

      sceneEl.addEventListener("arReady",ready);
      sceneEl.addEventListener("arError",failed);

    });

    setStatus("Đang mở camera...");

    await arSystem.start();
    await readyPromise;

    makeCanvasTransparent();

    running = true;
    stopButton.disabled = false;

    setStatus(
      activeSet.name + " đã sẵn sàng. Hãy đưa thẻ vào khung hình.",
      "success"
    );

  }catch(error){

    console.error("AR initialization error:",error);

    setStatus(
      "Lỗi: " + error.message +
      " Hãy kiểm tra file .mind, dữ liệu Firestore và quyền camera.",
      "error"
    );

    try{
      if(arSystem && arSystem.stop){
        arSystem.stop();
      }
    }catch(e){}

    clearTargets();

    sceneEl.removeAttribute("mindar-image");
    arSystem = null;

    running = false;
    stopButton.disabled = true;
    setSelect.disabled = false;

  }finally{

    starting = false;
    startButton.disabled = false;

  }

}

/* STOP SCANNER */

async function stopScanner(){

  try{
    if(arSystem){
      await arSystem.stop();
    }
  }catch(error){
    console.warn("Stop AR:",error);
  }

  videoEl.pause();
  videoEl.removeAttribute("src");
  videoEl.load();

  clearTargets();

  sceneEl.removeAttribute("mindar-image");

  arSystem = null;
  activeCard = null;
  activePlane = null;
  targetFound = false;
  running = false;

  resultBox.style.display = "none";

  startButton.disabled = false;
  stopButton.disabled = true;
  setSelect.disabled = false;

  setStatus("Đã dừng quét. Bạn có thể chọn bộ khác.");

}

/* BUTTONS */

startButton.addEventListener("click",startScanner);

stopButton.addEventListener("click",stopScanner);

/* AUDIO */

audioButton.addEventListener("click",async()=>{

  audioEnabled = !audioEnabled;

  audioButton.textContent = audioEnabled
    ? "Tắt âm thanh"
    : "Bật âm thanh";

  videoEl.muted = !audioEnabled;

  if(audioEnabled && targetFound){

    try{
      await videoEl.play();
    }catch(error){
      console.warn(error);
      setStatus("Không thể bật âm thanh video.","error");
    }

  }

});

/* CHANGE SET */

setSelect.addEventListener("change",()=>{

  if(running){
    stopScanner();
  }

  setStatus(
    "Đã chọn " +
    (TARGET_SETS.find(s=>s.id===setSelect.value)?.name || "bộ thẻ") +
    ". Nhấn Bắt đầu quét."
  );

});

/* INITIALIZE */

async function initialize(){

  try{
    await waitForScene();

    const options = TARGET_SETS.map(set=>({
      value:set.id,
      name:set.name
    }));

    setSelect.innerHTML = "";

    options.forEach(option=>{
      const el = document.createElement("option");
      el.value = option.value;
      el.textContent = option.name;
      setSelect.appendChild(el);
    });

    setStatus("Hãy chọn bộ thẻ rồi nhấn Bắt đầu quét.");

  }catch(error){
    setStatus("Lỗi khởi tạo trang: " + error.message,"error");
  }

}

initialize();

/* DỪNG CAMERA KHI ĐÓNG TRANG */

window.addEventListener("pagehide",()=>{
  try{
    if(arSystem){
      arSystem.stop();
    }
  }catch(error){}
});

</script>
</body>
</html>
