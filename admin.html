
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Quản lý thẻ AR</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      background:radial-gradient(ellipse at 50% -10%,#243b61 0%,#0b1020 55%);
      color:#f3f6ff;
      font-family:Arial,sans-serif;
      padding:24px 16px 50px
    }
    .wrap{max-width:1050px;margin:auto}
    .panel{
      background:#121d30;
      border:1px solid #2a3b57;
      border-radius:18px;
      padding:22px;
      margin-bottom:20px
    }
    .login{max-width:430px;margin:65px auto}
    h1{font-size:25px}
    h2{font-size:18px;margin-bottom:17px}
    p.sub{color:#91a1bc;font-size:13px;margin-top:8px;line-height:1.5}
    .field{margin-bottom:15px}
    label{display:block;color:#b9c7db;font-size:13px;margin-bottom:7px}
    input{
      width:100%;
      border:1px solid #354967;
      border-radius:10px;
      background:#0c1525;
      color:white;
      padding:12px 13px;
      outline:none
    }
    input:focus{border-color:#5b9df5}
    input[type=file]{padding:10px}
    .hint{font-size:11px;color:#8596b2;margin-top:6px;line-height:1.5}
    button{
      border:0;
      border-radius:10px;
      padding:11px 16px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      color:white;
      background:#293b58
    }
    button:disabled{opacity:.5;cursor:wait}
    .primary{background:linear-gradient(135deg,#438fe9,#396ce0)}
    .danger{background:#783247}
    .ghost{background:#24344d}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:25px
    }
    .top-actions{display:flex;gap:9px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .notice{
      font-size:13px;
      line-height:1.6;
      margin-top:12px;
      white-space:pre-wrap;
      overflow-wrap:anywhere
    }
    .notice.error{color:#ff8795}
    .notice.success{color:#65dfa9}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .card{
      display:flex;
      gap:13px;
      min-width:0;
      background:#0d1728;
      border:1px solid #293c58;
      border-radius:14px;
      padding:12px
    }
    .thumb{
      width:92px;
      height:105px;
      flex:none;
      border-radius:9px;
      background:#1d2b41;
      object-fit:cover
    }
    .card-info{min-width:0;flex:1}
    .card-info h3{font-size:14px;line-height:1.4;overflow-wrap:anywhere;margin:3px 0 7px}
    .card-info p{font-size:11px;color:#91a2bd;line-height:1.5;overflow-wrap:anywhere}
    .card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .card-actions button{padding:8px 10px;font-size:11px}
    .list-head,.form-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px
    }
    .count,.small{font-size:12px;color:#94a6c1}
    .empty{
      padding:35px 15px;
      text-align:center;
      color:#94a6c1;
      border:1px dashed #344967;
      border-radius:13px;
      font-size:13px;
      grid-column:1/-1
    }
    .hidden{display:none!important}
    @media(max-width:680px){
      body{padding:15px 11px 35px}
      .panel{padding:16px}
      .cards{grid-template-columns:1fr}
      .row{grid-template-columns:1fr}
      .top{align-items:flex-start}
      .top h1{font-size:21px}
      .login{margin:40px auto}
    }
  </style>
</head>

<body>
<main class="wrap">

  <!-- LOGIN -->
  <section class="panel login" id="loginPanel">
    <h2>Đăng nhập quản trị</h2>
    <p class="sub">Đăng nhập bằng tài khoản Firebase Authentication.</p>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email"
          autocomplete="username"
          placeholder="Email quản trị"
          required>
      </div>

      <div class="field">
        <label>Mật khẩu</label>
        <input id="password" type="password"
          autocomplete="current-password"
          placeholder="Mật khẩu"
          required>
      </div>

      <button class="primary" id="loginButton"
        type="submit" style="width:100%">
        Đăng nhập
      </button>
    </form>

    <div class="notice" id="loginNotice"></div>
  </section>

  <!-- ADMIN -->
  <section id="adminArea" class="hidden">

    <header class="top">
      <div>
        <h1>Quản lý thẻ AR</h1>
        <p class="sub">Quản lý danh sách và nội dung từng thẻ</p>
      </div>

      <div class="top-actions">
        <button class="ghost" id="reloadButton">Tải lại</button>
        <button class="danger" id="logoutButton">Đăng xuất</button>
      </div>
    </header>

    <!-- FORM THÊM / SỬA -->
    <section class="panel" id="editorPanel">
      <div class="form-title">
        <h2 id="formTitle">Thêm thẻ mới</h2>
        <span class="small" id="editHint">Thẻ mới</span>
      </div>

      <form id="cardForm">

        <div class="field">
          <label>Tên thẻ *</label>
          <input id="cardName" type="text"
            maxlength="100"
            placeholder="Ví dụ: Thẻ nhân vật A"
            required>
        </div>

        <div class="row">
          <div class="field">
            <label>Ảnh thẻ *</label>
            <input id="imageFile" type="file" accept="image/*">
            <p class="hint" id="imageHint">
              Chọn ảnh mẫu để nhận diện.
            </p>
          </div>

          <div class="field">
            <label>File MindAR (.mind)</label>
            <input id="mindFile" type="file" accept=".mind">
            <p class="hint">
              Không bắt buộc. Có thể bỏ trống khi chỉnh sửa.
            </p>
          </div>
        </div>

        <div class="field">
          <label>Đường dẫn video *</label>
          <input id="videoUrl" type="url"
            placeholder="https://res.cloudinary.com/..."
            required>
        </div>

        <div class="field">
          <label>Tỷ lệ khung hình</label>
          <input id="ratio" type="text"
            placeholder="Ví dụ: 1.0 hoặc 16/9">
        </div>

        <div class="actions">
          <button class="primary" id="saveButton" type="submit">
            Lưu thẻ
          </button>

          <button class="ghost hidden" id="cancelEdit" type="button">
            Hủy chỉnh sửa
          </button>
        </div>

        <div class="notice" id="formNotice"></div>
      </form>
    </section>

    <!-- DANH SÁCH -->
    <section class="panel">
      <div class="list-head">
        <h2>Danh sách thẻ</h2>
        <span class="count" id="cardCount">Đang tải...</span>
      </div>

      <div id="cardList" class="cards">
        <div class="empty">Đang tải dữ liệu...</div>
      </div>
    </section>

  </section>
</main>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyDFTvux73x5oAl273PN_0_wwzA1OVvh34c",
    authDomain: "ar-card-video.firebaseapp.com",
    projectId: "ar-card-video",
    storageBucket: "ar-card-video.firebasestorage.app",
    messagingSenderId: "725938606795",
    appId: "1:725938606795:web:516149f4210f26344bc14e"
  };

  // CLOUDINARY
  const CLOUD_NAME = "cjhppbjd";
  const UPLOAD_PRESET = "ml_default";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ELEMENTS
  const $ = id => document.getElementById(id);

  const loginPanel = $("loginPanel");
  const adminArea = $("adminArea");
  const loginForm = $("loginForm");
  const loginButton = $("loginButton");
  const loginNotice = $("loginNotice");

  const cardForm = $("cardForm");
  const cardList = $("cardList");
  const cardCount = $("cardCount");

  const cardName = $("cardName");
  const imageFile = $("imageFile");
  const mindFile = $("mindFile");
  const videoUrl = $("videoUrl");
  const ratio = $("ratio");

  const saveButton = $("saveButton");
  const formNotice = $("formNotice");
  const cancelEdit = $("cancelEdit");

  let currentUser = null;
  let editingId = null;
  let editingData = null;
  let allCards = [];

  function showNotice(element, text, type = "") {
    element.textContent = text;
    element.className = "notice " + type;
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char]));
  }

  // HIỂN THỊ TRẠNG THÁI ĐĂNG NHẬP
  onAuthStateChanged(auth, async user => {
    currentUser = user;

    if (user) {
      loginPanel.classList.add("hidden");
      adminArea.classList.remove("hidden");
      await loadCards();
    } else {
      adminArea.classList.add("hidden");
      loginPanel.classList.remove("hidden");
    }
  });

  // ĐĂNG NHẬP VÀ BÁO LỖI CHI TIẾT
  loginForm.addEventListener("submit", async event => {
    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "Đang đăng nhập...";
    showNotice(loginNotice, "");

    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );

      showNotice(loginNotice, "Đăng nhập thành công.", "success");

    } catch (error) {
      console.error("Firebase Login Error:", error);

      const errors = {
        "auth/invalid-credential":
          "Email hoặc mật khẩu không chính xác.",

        "auth/user-not-found":
          "Không tìm thấy tài khoản này.",

        "auth/wrong-password":
          "Mật khẩu không đúng.",

        "auth/invalid-email":
          "Email không hợp lệ.",

        "auth/unauthorized-domain":
          "Tên miền website chưa được cấp quyền trong Firebase Authentication.",

        "auth/operation-not-allowed":
          "Firebase chưa bật đăng nhập Email/Password.",

        "auth/network-request-failed":
          "Lỗi kết nối mạng. Hãy kiểm tra Internet.",

        "auth/too-many-requests":
          "Bạn đã thử đăng nhập quá nhiều lần. Hãy chờ rồi thử lại.",

        "auth/user-disabled":
          "Tài khoản này đã bị vô hiệu hóa.",

        "auth/invalid-api-key":
          "Firebase API Key không hợp lệ."
      };

      const message =
        errors[error.code] ||
        "Mã lỗi: " + (error.code || "Không xác định") +
        "\nChi tiết: " + (error.message || "");

      showNotice(loginNotice, message, "error");

    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Đăng nhập";
    }
  });

  // ĐĂNG XUẤT
  $("logoutButton").addEventListener("click", async () => {
    try {
      await signOut(auth);
      loginForm.reset();
    } catch (error) {
      alert("Không đăng xuất được: " + error.message);
    }
  });

  $("reloadButton").addEventListener("click", loadCards);

  // TẢI FILE LÊN CLOUDINARY
  async function uploadCloudinary(file, resourceType) {
    const endpoint =
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;

    const data = new FormData();
    data.append("file", file);
    data.append("upload_preset", UPLOAD_PRESET);

    const response = await fetch(endpoint, {
      method: "POST",
      body: data
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error?.message || "Cloudinary tải file thất bại."
      );
    }

    return result.secure_url;
  }

  // LẤY DANH SÁCH CARD
  async function loadCards() {
    cardList.innerHTML =
      '<div class="empty">Đang tải danh sách...</div>';

    cardCount.textContent = "Đang tải...";

    try {
      const snapshot = await getDocs(collection(db, "cards"));

      allCards = [];

      snapshot.forEach(item => {
        allCards.push({
          id: item.id,
          ...item.data()
        });
      });

      cardCount.textContent = allCards.length + " thẻ";
      renderCards();

    } catch (error) {
      console.error("Load cards error:", error);

      cardList.innerHTML =
        '<div class="empty">Không tải được danh sách. Kiểm tra Firestore Rules và kết nối.</div>';

      cardCount.textContent = "Lỗi tải dữ liệu";
    }
  }

  // HIỂN THỊ CARD
  function renderCards() {
    if (allCards.length === 0) {
      cardList.innerHTML =
        '<div class="empty">Chưa có thẻ nào. Hãy thêm thẻ đầu tiên.</div>';
      return;
    }

    cardList.innerHTML = allCards.map(card => `
      <article class="card">
        <img
          class="thumb"
          src="${escapeHtml(card.imageUrl || "")}"
          alt="Ảnh thẻ"
          onerror="this.style.opacity='.2';this.removeAttribute('src')"
        >

        <div class="card-info">
          <h3>${escapeHtml(card.name || "Thẻ chưa đặt tên")}</h3>
          <p>${card.mindUrl ? "Đã có file MindAR" : "Chưa có file MindAR"}</p>
          <p>${card.videoUrl ? "Đã có video" : "Chưa có video"}</p>

          <div class="card-actions">
            <button class="primary"
              data-action="edit"
              data-id="${escapeHtml(card.id)}">
              Sửa
            </button>

            <button class="danger"
              data-action="delete"
              data-id="${escapeHtml(card.id)}">
              Xóa
            </button>
          </div>
        </div>
      </article>
    `).join("");
  }

  // SỬA / XÓA CARD
  cardList.addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;
    const card = allCards.find(item => item.id === id);

    if (!card) return;

    if (action === "edit") {
      beginEdit(card);
    }

    if (action === "delete") {
      await removeCard(card);
    }
  });

  function beginEdit(card) {
    editingId = card.id;
    editingData = card;

    $("formTitle").textContent = "Chỉnh sửa thẻ";
    $("editHint").textContent = "Đang sửa: " + card.name;

    cardName.value = card.name || "";
    videoUrl.value = card.videoUrl || "";
    ratio.value = card.ratio || "";

    imageFile.value = "";
    mindFile.value = "";

    imageFile.required = false;

    $("imageHint").textContent =
      "Bỏ trống để giữ ảnh cũ. Chọn ảnh mới nếu muốn thay.";

    saveButton.textContent = "Lưu thay đổi";
    cancelEdit.classList.remove("hidden");

    showNotice(
      formNotice,
      "Bạn đang chỉnh sửa thẻ. File không chọn sẽ được giữ nguyên."
    );

    $("editorPanel").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function resetForm() {
    editingId = null;
    editingData = null;

    cardForm.reset();

    imageFile.required = true;

    $("formTitle").textContent = "Thêm thẻ mới";
    $("editHint").textContent = "Thẻ mới";

    $("imageHint").textContent =
      "Chọn ảnh mẫu để nhận diện.";

    saveButton.textContent = "Lưu thẻ";
    cancelEdit.classList.add("hidden");

    showNotice(formNotice, "");
  }

  cancelEdit.addEventListener("click", resetForm);

  async function removeCard(card) {
    const confirmed = confirm(
      `Bạn có chắc muốn xóa thẻ "${card.name}" không?\n\n` +
      "Dữ liệu Firestore sẽ bị xóa. File Cloudinary vẫn còn."
    );

    if (!confirmed) return;

    try {
      await deleteDoc(doc(db, "cards", card.id));

      if (editingId === card.id) {
        resetForm();
      }

      await loadCards();

      showNotice(formNotice, "Đã xóa thẻ thành công.", "success");

    } catch (error) {
      console.error("Delete error:", error);
      alert("Không xóa được thẻ: " + error.message);
    }
  }

  // THÊM / CẬP NHẬT CARD
  cardForm.addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentUser) {
      showNotice(
        formNotice,
        "Phiên đăng nhập đã hết. Hãy đăng nhập lại.",
        "error"
      );
      return;
    }

    const name = cardName.value.trim();
    const video = videoUrl.value.trim();

    if (!name || !video) {
      showNotice(
        formNotice,
        "Vui lòng nhập tên thẻ và URL video.",
        "error"
      );
      return;
    }

    if (!editingId && !imageFile.files[0]) {
      showNotice(
        formNotice,
        "Bạn cần chọn ảnh thẻ.",
        "error"
      );
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Đang lưu...";

    try {
      let imageUrl = editingData?.imageUrl || "";
      let mindUrl = editingData?.mindUrl || "";

      if (imageFile.files[0]) {
        showNotice(formNotice, "Đang tải ảnh lên Cloudinary...");

        imageUrl = await uploadCloudinary(
          imageFile.files[0],
          "image"
        );
      }

      if (mindFile.files[0]) {
        showNotice(formNotice, "Đang tải file MindAR lên Cloudinary...");

        mindUrl = await uploadCloudinary(
          mindFile.files[0],
          "raw"
        );
      }

      const payload = {
        name,
        imageUrl,
        mindUrl,
        videoUrl: video,
        ratio: ratio.value.trim()
      };

      if (editingId) {
        await updateDoc(
          doc(db, "cards", editingId),
          payload
        );
      } else {
        payload.createdAt = serverTimestamp();

        await addDoc(
          collection(db, "cards"),
          payload
        );
      }

      resetForm();
      await loadCards();

      showNotice(
        formNotice,
        "Đã lưu dữ liệu thẻ thành công.",
        "success"
      );

    } catch (error) {
      console.error("Save card error:", error);

      showNotice(
        formNotice,
        "Lưu thất bại: " + (error.message || "Lỗi không xác định"),
        "error"
      );

    } finally {
      saveButton.disabled = false;
      saveButton.textContent = editingId
        ? "Lưu thay đổi"
        : "Lưu thẻ";
    }
  });
</script>
</body>
</html>
